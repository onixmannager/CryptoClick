<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Buscando rival — Invasión</title>
<meta name="theme-color" content="#0B0A12">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3.13.2/dist/mux-player.js"></script>
<style>
:root{
  --bg:#0B0A12;--card:#16141F;--card2:#1c1a29;
  --yellow:#FFC369;--orange:#FFC369;--pink:#B85CFF;--purple:#B85CFF;
  --green:#C8FF4D;--red:#EF4444;--text:#EDEBFA;--muted:#918EAA;--border:rgba(232, 229, 250, 0.10);
  --fh:'Fredoka One',cursive;--fb:'Nunito',sans-serif;
  --glass:rgba(10,12,22,.5);--glass-border:rgba(255,255,255,.14);--glass-blur:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden}

/* ── Video de RESULTADO a pantalla completa — sustituye al antiguo radar
   animado. Se usa el MISMO criterio responsive que el resto del juego
   (ver #introvideo en index.html raíz e invasion/index.html): en MOVIL
   object-fit:cover llena el viewport; en ESCRITORIO (min-width:901px)
   object-fit:contain mantiene la proporción del video sin recortarlo,
   centrado sobre fondo negro con barras a los lados. Hay dos <video>
   superpuestos (uno por resultado) y solo se muestra el que toque vía
   .show, para poder cambiar de uno a otro sin recrear el elemento. ── */
#videoStage{position:fixed;inset:0;background:#000;z-index:1}
#videoStage mux-player{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;--controls:none}
#videoStage mux-player.show{display:block}
@media (min-width:901px){
  #videoStage mux-player{object-fit:contain}
}

/* ── Overlay de información, SIEMPRE por encima del video. Franja
   superior e inferior con degradado oscuro para que el texto/botones
   se lean con cualquier fondo de video, dejando el CENTRO de la
   pantalla despejado a propósito -es donde ocurre la parte más visual
   del video- tal y como se pidió explícitamente. ── */
#overlay{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
#overlay>*{pointer-events:auto}
#topBar{background:linear-gradient(to bottom,rgba(6,5,14,.82),rgba(6,5,14,.55) 65%,transparent);margin:calc(-14px - env(safe-area-inset-top)) -16px 0;padding:calc(14px + env(safe-area-inset-top)) 16px 26px;display:flex;align-items:center;gap:10px}
#backLink{color:var(--text);text-decoration:none;font-weight:800;font-size:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#topTitle{font-family:var(--fh);font-size:15px;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#topSub{font-size:11px;font-weight:800;color:var(--muted);margin-top:1px}

#bottomPanel{width:100%;max-width:430px;margin:0 auto}

/* Estado "buscando": chip pequeño, no ocupa espacio del centro */
#searchingChip{display:none;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:16px;padding:12px 16px;width:100%;max-width:430px;margin:0 auto}
#searchingChip.show{display:flex}
.pulseDot{width:10px;height:10px;border-radius:50%;background:var(--purple);flex-shrink:0;animation:pulseDot 1s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
#searchingText{font-weight:800;font-size:13px}
#searchingSub{font-size:11px;color:var(--muted);font-weight:700;margin-top:1px}

/* Resultado: rival encontrado */
#result{display:none}
#result.show{display:block}
.rivalCard{background:var(--glass);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:20px;padding:18px 20px}
.rivalTop{display:flex;align-items:center;gap:12px}
.rivalAvatar{font-size:40px;line-height:1;flex-shrink:0}
.rivalInfo{flex:1;min-width:0;text-align:left}
.rivalName{font-family:var(--fh);font-size:18px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rivalLvl{font-size:12px;color:var(--muted);font-weight:800;margin-top:1px}
.diffBadge{flex-shrink:0;padding:6px 14px;border-radius:20px;font-family:var(--fh);font-size:12px;white-space:nowrap}
.diffBadge.muy_facil{background:rgba(200,255,77,.22);color:var(--green)}
.diffBadge.facil{background:rgba(200,255,77,.18);color:#ddff9e}
.diffBadge.normal{background:rgba(255,195,105,.14);color:var(--yellow)}
.diffBadge.dificil{background:rgba(255,195,105,.28);color:var(--orange)}
.diffBadge.muy_dificil{background:rgba(239,68,68,.18);color:var(--red)}
.rivalClkRow{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.rivalClk{font-family:var(--fh);font-size:24px;color:var(--yellow)}
.rivalClkLabel{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1px}

/* Mismo lenguaje visual que .claimall/.mcbtn de misiones en el
   index.html padre (gradiente verde, texto oscuro, sombra suave). */
#attackBtn{width:100%;margin-top:14px;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--green),#059669);color:#001a0a;font-family:var(--fh);font-size:16px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#attackBtn:active{transform:scale(.97)}
#retryBtn{width:100%;margin-top:10px;padding:12px;border:none;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text);font-weight:800;font-size:13px;cursor:pointer}

/* Resultado: sin objetivos */
#noneFound{display:none;text-align:center}
#noneFound.show{display:block}
.noneCard{background:var(--glass);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:20px;padding:20px}
.noneIcon{font-size:38px;margin-bottom:6px}
#noneTitle{font-family:var(--fh);font-size:17px}
#noneText{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;line-height:1.5}
#retryBtn2{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--green),#059669);color:#001a0a;font-weight:800;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div id="videoStage">
  <mux-player id="videoSinExito" stream-type="on-demand" playback-id="Jk01e7JET6fWivLqUhOMMH8uBpGx01Ub01wDsIDGujgJ3Q" no-muted-pref playsinline loop></mux-player>
  <mux-player id="videoExito" stream-type="on-demand" playback-id="JJDwuSwjtgL1kvyj3gA02XSA79hNBbU00MRXEC1GJaQDs" no-muted-pref playsinline loop></mux-player>
</div>

<div id="overlay">
  <div id="topBar">
    <a href="./" id="backLink" aria-label="Volver" data-i18n-aria="backAria">←</a>
    <div>
      <div id="topTitle" data-i18n="sectorTitle">SECTOR DE INVASIÓN</div>
      <div id="topSub" data-i18n="radarSub">Radar de objetivos</div>
    </div>
  </div>

  <div id="bottomPanel">
    <div id="searchingChip">
      <div class="pulseDot"></div>
      <div>
        <div id="searchingText" data-i18n="scanningSectorText">Escaneando sector…</div>
        <div id="searchingSub" data-i18n="searchingTargetsSub">Buscando objetivos disponibles</div>
      </div>
    </div>

    <div id="result">
      <div class="rivalCard">
        <div class="rivalTop">
          <div class="rivalAvatar">👽</div>
          <div class="rivalInfo">
            <div class="rivalName" id="rivalName">–</div>
            <div class="rivalLvl" id="rivalLvl">–</div>
          </div>
          <div class="diffBadge" id="diffBadge">–</div>
        </div>
        <div class="rivalClkRow">
          <div class="rivalClk" id="rivalClk">–</div>
          <div class="rivalClkLabel" data-i18n="clkInPlayLabel">$CLK EN JUEGO</div>
        </div>
      </div>
      <button id="attackBtn" data-i18n="attackBtnText">⚔️ ATACAR</button>
      <button id="retryBtn" data-i18n="findAnotherRivalBtn">🔄 Buscar otro rival</button>
    </div>

    <div id="noneFound">
      <div class="noneCard">
        <div class="noneIcon">🛸</div>
        <h1 id="noneTitle" data-i18n="noTargetsNowTitle">Sin objetivos ahora</h1>
        <div id="noneText" data-i18n="noRivalsAvailableText">No hay rivales disponibles en este momento. Todos protegidos o sin $CLK suficiente.</div>
        <button id="retryBtn2" data-i18n="retryBtn2Text">🔄 Reintentar</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import './js/invasion-core.js';

// ============================================================================
// i18n de search.html: mismo criterio es/en que el resto del modo Invasión,
// compartiendo la misma clave de localStorage ('cck4_lang'). Diccionario
// propio (I18N_INV), porque esta pantalla puede abrirse directamente sin
// haber cargado el resto de scripts del proyecto.
// ============================================================================
let currentLang=(function(){try{return localStorage.getItem('cck4_lang')==='en'?'en':'es';}catch(e){return 'es';}})();
const I18N_INV={
  backAria:{es:'Volver',en:'Back'},
  sectorTitle:{es:'SECTOR DE INVASIÓN',en:'INVASION SECTOR'},
  radarSub:{es:'Radar de objetivos',en:'Target radar'},
  scanningSectorText:{es:'Escaneando sector…',en:'Scanning sector…'},
  searchingTargetsSub:{es:'Buscando objetivos disponibles',en:'Looking for available targets'},
  clkInPlayLabel:{es:'$CLK EN JUEGO',en:'$CLK AT STAKE'},
  attackBtnText:{es:'⚔️ ATACAR',en:'⚔️ ATTACK'},
  findAnotherRivalBtn:{es:'🔄 Buscar otro rival',en:'🔄 Find another rival'},
  noTargetsNowTitle:{es:'Sin objetivos ahora',en:'No targets right now'},
  noRivalsAvailableText:{es:'No hay rivales disponibles en este momento. Todos protegidos o sin $CLK suficiente.',en:'No rivals available right now. All are protected or don\'t have enough $CLK.'},
  retryBtn2Text:{es:'🔄 Reintentar',en:'🔄 Retry'},
  diffMuyFacil:{es:'Muy fácil',en:'Very easy'},
  diffFacil:{es:'Fácil',en:'Easy'},
  diffNormal:{es:'Normal',en:'Normal'},
  diffDificil:{es:'Difícil',en:'Difficult'},
  diffMuyDificil:{es:'Casi imposible',en:'Nearly impossible'},
  playerDefault:{es:'Jugador',en:'Player'},
  levelLabel:{es:'Nivel {lvl}',en:'Level {lvl}'},
  signInFirst:{es:'Inicia sesión en el juego principal primero.',en:'Sign in on the main game first.'},
  cantRevengeThatPlayer:{es:'Ya no puedes vengarte de ese jugador — puede que ya te hayas vengado o que hayan pasado más de 24h.',en:'You can no longer take revenge on that player — you may have already taken revenge, or more than 24h have passed.'},
  targetActivatedShield:{es:'Ese jugador activó un escudo — no puedes vengarte ahora.',en:'That player activated a shield — you can\'t take revenge right now.'},
  targetNoClk:{es:'Ese jugador ya no tiene $CLK suficiente para robar.',en:'That player no longer has enough $CLK to steal.'},
  targetHasPendingDefense:{es:'Ese jugador ya tiene otro ataque pendiente sin resolver — inténtalo de nuevo más tarde.',en:'That player already has another unresolved pending attack — try again later.'},
  couldNotLoadTarget:{es:'No se pudo cargar ese objetivo.',en:'Could not load that target.'},
  invasionLockedTitle:{es:'Invasión bloqueada',en:'Invasion locked'},
  invasionLockedText:{es:'Disponible a partir de nivel {lvl}. Sigue jugando para desbloquearla.',en:'Available from level {lvl}. Keep playing to unlock it.'},
  backBtn:{es:'← Volver',en:'← Back'},
  cantInvadeNow:{es:'No puedes invadir ahora mismo — vuelve al menú para ver cuánto falta.',en:'You can\'t invade right now — go back to the menu to see how long is left.'},
  bootFailedGeneric:{es:'No se pudo cargar. Reintenta o avisa si persiste.',en:'Could not load. Retry or report if it persists.'},
  revengeFailedTitle:{es:'No se pudo completar la venganza',en:'Could not complete the revenge'},
  attackFailedTitle:{es:'No se pudo lanzar el ataque',en:'Could not launch the attack'},
  searchErrorRetry:{es:'Error al buscar. Inténtalo de nuevo.',en:'Search error. Try again.'},
  couldNotCheckTarget:{es:'No se pudo comprobar el objetivo. Inténtalo de nuevo.',en:'Could not check the target. Try again.'},
};
function t(key,vars){
  const entry=I18N_INV[key];
  let str=entry?(entry[currentLang]||entry.es):key;
  if(vars)for(const k in vars)str=str.split('{'+k+'}').join(vars[k]);
  return str;
}
function applyI18nInv(root){
  const scope=root||document;
  scope.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.getAttribute('data-i18n');
    const entry=I18N_INV[key];
    if(!entry)return;
    const val=entry[currentLang]||entry.es;
    if(val.indexOf('<')!==-1)el.innerHTML=val;else el.textContent=val;
  });
  scope.querySelectorAll('[data-i18n-aria]').forEach(el=>{
    const key=el.getAttribute('data-i18n-aria');
    const entry=I18N_INV[key];
    if(entry)el.setAttribute('aria-label',entry[currentLang]||entry.es);
  });
}
(function(){
  const html=document.documentElement;
  if(html)html.setAttribute('lang',currentLang);
  applyI18nInv(document);
})();

let core, myProfile, foundTarget, isRevengeFlow=false;

function fmtClk(n){
  n=Math.floor(n);
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return n+'';
}
const DIFF_LABELS={muy_facil:t('diffMuyFacil'),facil:t('diffFacil'),normal:t('diffNormal'),dificil:t('diffDificil'),muy_dificil:t('diffMuyDificil')};

const vidSinExito = document.getElementById('videoSinExito');
const vidExito = document.getElementById('videoExito');

// Arranca (o mantiene) el video de "buscando/sin éxito" como fondo, con
// su audio propio -mismo criterio que #introvideo/#ruvideo en el resto
// del proyecto: vid.muted=false explícito antes de reproducir, sin
// consultar el mute global de SFX/BGM, porque estos videos traen su
// propia narración/sonido y se tratan como un elemento aparte-.
function playSinExitoVideo(){
  vidExito.pause();
  vidExito.classList.remove('show');
  vidSinExito.classList.add('show');
  vidSinExito.muted=false;
  if(vidSinExito.paused) vidSinExito.play().catch(()=>{});
}
function playExitoVideo(){
  vidSinExito.pause();
  vidSinExito.classList.remove('show');
  vidExito.classList.add('show');
  vidExito.muted=false;
  vidExito.currentTime=0;
  vidExito.play().catch(()=>{});
}

// Muestra el chip de "escaneando" o el panel de resultado (rival /
// sin objetivos) SOBRE el video, sin tapar el centro de la pantalla.
// El resultado (rival encontrado o sin objetivos) tarda 2s en aparecer
// desde que se entra a la página, aunque la búsqueda real ya haya
// terminado antes — 'scanning' no se retrasa, es lo que se ve mientras
// tanto. _pageEnterMs marca el instante de entrada a la página para que
// el retraso se cuente desde ahí y no se acumule si showView('result'/
// 'noneFound') se llama más de una vez (p.ej. al reintentar).
const _pageEnterMs = Date.now();
const RESULT_DELAY_MS = 3000;
function showView(id){
  if(id!=='scanning'){
    const wait = Math.max(0, RESULT_DELAY_MS-(Date.now()-_pageEnterMs));
    setTimeout(()=>_showView(id), wait);
    return;
  }
  _showView(id);
}
function _showView(id){
  document.getElementById('searchingChip').classList.toggle('show', id==='scanning');
  document.getElementById('result').classList.toggle('show', id==='result');
  document.getElementById('noneFound').classList.toggle('show', id==='noneFound');
}

async function boot(){
  core = window.InvasionCore;
  const user = await core.authReady;
  if(!user){
    playSinExitoVideo();
    document.getElementById('searchingText').textContent=t('signInFirst');
    document.getElementById('searchingSub').textContent='';
    showView('scanning');
    return;
  }

  try{
    myProfile = { uid: user.uid, ...(await core.syncProfileFromMainSave(user.uid)) };

    // Invasión bloqueada hasta nivel 3 (spec 11) — se revalida aquí por
    // si se llega a search.html saltándose el hub (URL directa), que es
    // donde vive el botón ya deshabilitado para niveles 1-2.
    if(!core.isInvasionUnlocked(myProfile.lvl)){
      playSinExitoVideo();
      document.getElementById('noneTitle').textContent = t('invasionLockedTitle');
      document.getElementById('noneText').textContent = t('invasionLockedText',{lvl:core.CFG.MIN_LEVEL_TO_UNLOCK});
      document.getElementById('retryBtn2').textContent = t('backBtn');
      directTargetFailed = true;
      showView('noneFound');
      return;
    }

    // Se comprueba primero si es venganza o ataque normal, porque el
    // mensaje/título que se muestra si algo falla depende de cuál sea
    // — antes esto se decidía DESPUÉS de comprobar checkCanInvade, así
    // que un simple cooldown en un ataque normal mostraba "no se pudo
    // completar la venganza" aunque no hubiera venganza de por medio.
    const directTarget = sessionStorage.getItem('invasion_direct_target');
    if(directTarget){
      isRevengeFlow = sessionStorage.getItem('invasion_is_revenge')==='1';
      sessionStorage.removeItem('invasion_direct_target');
      sessionStorage.removeItem('invasion_is_revenge');
    }

    const check = core.checkCanInvade(myProfile);
    if(!check.ok){
      markSearchFailed(t('cantInvadeNow'), isRevengeFlow);
      return;
    }

    if(directTarget){
      await searchDirectTarget(directTarget);
    }else{
      await searchRandom();
    }
  }catch(e){
    // Sin este catch, un fallo aquí (permisos, red) dejaba la pantalla
    // de escaneo girando para siempre sin explicación — ver el mismo
    // problema y su arreglo en index.html/boot().
    console.error('boot() falló:', e);
    markSearchFailed(t('bootFailedGeneric'), isRevengeFlow);
  }
}

let directTargetFailed=false; // true si el fallo viene de un intento de VENGANZA
                                // (reintentar al azar no tiene sentido en ese caso)

// Sustituye a la antigua markDirectTargetFailed(): el título y el
// comportamiento de "Reintentar" ahora dependen de isRevenge, en vez de
// asumir siempre que el fallo viene de una venganza. Un ataque normal
// (isRevenge=false) que falla por cooldown/límite/error de red debe
// poder reintentar la búsqueda al azar, no mandar al jugador de vuelta
// al menú con un mensaje que no le corresponde.
function markSearchFailed(msg, isRevenge){
  playSinExitoVideo();
  document.getElementById('noneTitle').textContent = isRevenge ? t('revengeFailedTitle') : t('attackFailedTitle');
  document.getElementById('noneText').textContent = msg;
  document.getElementById('retryBtn2').textContent = isRevenge ? t('backBtn') : t('retryBtn2Text');
  directTargetFailed = isRevenge;
  showView('noneFound');
}

async function searchDirectTarget(uid){
  // La búsqueda corre en segundo plano: el video de "escaneando" se
  // muestra a pantalla completa de inmediato y no bloquea la petición.
  playSinExitoVideo();
  showView('scanning');
  try{
    // isRevengeFlow llega de sessionStorage (ver boot() más arriba), que
    // el propio navegador del jugador puede escribir a mano — nada
    // impide entrar aquí con invasion_is_revenge='1' forzado contra un
    // uid que nunca atacó a este jugador, o del que ya se vengó. Se
    // revalida aquí, ANTES de mostrar el rival y dejar avanzar al
    // minijuego, para que el mensaje de error sea claro de inmediato en
    // vez de que el jugador juegue una partida entera y descubra al
    // volver que no contó como venganza (createPendingAttack() también
    // revalida esto de forma obligatoria — ver esa función — esta
    // comprobación de aquí es solo para dar el aviso pronto, no la única
    // barrera).
    if(isRevengeFlow){
      const legit = await core.isLegitimateRevenge(myProfile.uid, uid);
      if(!legit){
        markSearchFailed(t('cantRevengeThatPlayer'), true);
        return;
      }
    }
    const snap = await core.getDoc(core.doc(core.db,'invasion_players',uid));
    if(!snap.exists()) throw new Error('target not found');
    const d = snap.data();
    const now = Date.now();
    if((d.shieldUntil||0) > now){
      markSearchFailed(t('targetActivatedShield'), true);
      return;
    }
    if((d.clk||0) < core.CFG.MIN_CLK_TO_BE_TARGET){
      markSearchFailed(t('targetNoClk'), true);
      return;
    }
    if(await core.hasActivePendingDefense(uid)){
      markSearchFailed(t('targetHasPendingDefense'), true);
      return;
    }
    foundTarget = { uid, ...d };
    showResult();
  }catch(e){
    console.error(e);
    markSearchFailed(t('couldNotLoadTarget'), true);
  }
}

async function searchRandom(){
  // Igual que searchDirectTarget: el video de resultado (éxito/sin
  // éxito) es lo único que ve el usuario mientras dura la búsqueda real;
  // no hay pantalla de radar/spinner por separado.
  //
  // Prioridad por nivel (spec 10): se busca primero en el propio nivel
  // del atacante, y solo si no hay candidato válido ahí se prueba el
  // nivel inmediatamente inferior, y así sucesivamente — ver
  // findTargetByLevel() en invasion-core.js. Ya no es una búsqueda
  // puramente aleatoria entre TODOS los jugadores.
  //
  // BUGFIX: myProfile se cargaba UNA SOLA VEZ en boot() y se reutilizaba
  // en memoria en cada llamada a searchRandom() (p.ej. al pulsar
  // "🔄 Reintentar" varias veces sin salir de esta pantalla) — así que
  // el cooldown de 4h por objetivo (recentTargets), que SÍ queda bien
  // escrito en Firestore por createPendingAttack() tras cada ataque,
  // nunca se veía reflejado aquí hasta recargar la página entera o
  // volver a pasar por el hub (invasion/index.html, que sí resincroniza
  // en su propio boot()). Efecto observable: se podía atacar 2-3 veces
  // seguidas al mismo rival pese al cooldown, con solo pulsar
  // "Reintentar" repetidamente. Se relee el perfil real justo antes de
  // cada búsqueda para que cualquier cooldown recién escrito (por este
  // ataque o por otra pestaña/dispositivo con la misma cuenta) se
  // respete siempre, sin depender de cuántas veces se reintente sin
  // recargar.
  playSinExitoVideo();
  showView('scanning');
  try{
    myProfile = { uid: myProfile.uid, ...(await core.syncProfileFromMainSave(myProfile.uid)) };
    foundTarget = await core.findTargetByLevel(myProfile.uid, myProfile.lvl, myProfile.recentTargets);
    if(!foundTarget){
      playSinExitoVideo();
      document.getElementById('noneTitle').textContent = t('noTargetsNowTitle');
      document.getElementById('noneText').textContent = core.explainNoTargetFound();
      document.getElementById('retryBtn2').textContent = t('retryBtn2Text');
      directTargetFailed = false;
      showView('noneFound');
      return;
    }
    showResult();
  }catch(e){
    console.error('findTargetByLevel failed:',e);
    markSearchFailed(t('searchErrorRetry'), false);
  }
}

function showResult(){
  playExitoVideo();
  const tier = core.difficultyFor(myProfile.lvl, foundTarget.lvl);
  document.getElementById('rivalName').textContent = foundTarget.alias || t('playerDefault');
  document.getElementById('rivalLvl').textContent = t('levelLabel',{lvl:foundTarget.lvl});
  const badge=document.getElementById('diffBadge');
  badge.textContent = DIFF_LABELS[tier.key];
  badge.className = 'diffBadge ' + tier.key;
  document.getElementById('rivalClk').textContent = fmtClk(foundTarget.clk);
  showView('result');
}

document.getElementById('attackBtn').onclick=async ()=>{
  const btn=document.getElementById('attackBtn');
  btn.disabled=true;
  try{
    // Un defensor solo puede tener UN ataque pendiente sin resolver a la
    // vez — se revalida aquí, justo antes del punto de no retorno, para
    // no dejar que el jugador juegue el minijuego entero y descubra al
    // volver que el objetivo ya estaba ocupado (createPendingAttack()
    // también revalida esto de forma obligatoria — ver esa función —
    // esta comprobación es solo para avisar pronto, no la única barrera).
    //
    // hasActivePendingDefense() en vez de hasPendingDefense(): el
    // candidato ya pasó este mismo filtro (con este mismo criterio) para
    // llegar a mostrarse en pantalla, tanto desde la búsqueda aleatoria
    // (firstValidCandidate() en invasion-core.js) como desde la venganza
    // directa (searchDirectTarget() más arriba) — usar aquí la variante
    // genérica sin fecha rechazaría, con un mensaje que ya no es cierto,
    // a un candidato cuyo único pendiente ya venció y que el resto del
    // flujo ya trató (y, de paso, resolvió) como libre.
    const busy = await core.hasActivePendingDefense(foundTarget.uid);
    if(busy){
      markSearchFailed(t('targetHasPendingDefense'), isRevengeFlow);
      return;
    }
    sessionStorage.setItem('invasion_battle_defender', foundTarget.uid);
    sessionStorage.setItem('invasion_battle_is_revenge', isRevengeFlow ? '1':'0');
    window.location.href='minigame.html';
  }catch(e){
    console.error('hasActivePendingDefense check failed:', e);
    markSearchFailed(t('couldNotCheckTarget'), isRevengeFlow);
  }finally{
    btn.disabled=false;
  }
};
document.getElementById('retryBtn').onclick=()=>searchRandom();
document.getElementById('retryBtn2').onclick=()=>{
  if(directTargetFailed){
    // Venganza fallida: no tiene sentido "reintentar al azar" contra
    // otro jugador, el usuario pulsó Vengarse de alguien específico.
    window.location.href='./';
  }else{
    searchRandom();
  }
};

boot();
</script>
