<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Invasión — Crypto Alien Click</title>

<meta name="theme-color" content="#0b0a14">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a14;--card:#16142a;--card2:#1e1c34;--card3:#252342;
  --yellow:#FFD700;--orange:#FF6B35;--pink:#FF3CAC;--purple:#8B5CF6;
  --blue:#3B82F6;--cyan:#06B6D4;--green:#10B981;--red:#EF4444;
  --text:#fff;--muted:#6B68A0;--border:rgba(255,255,255,0.07);
  --fh:'Fredoka One',cursive;--fb:'Nunito',sans-serif;
  --glass:rgba(10,12,22,.42);--glass2:rgba(12,14,26,.5);
  --glass-border:rgba(255,255,255,.14);--glass-blur:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{width:100%;min-height:100vh;background-color:#0b0a14}
body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden;overflow-y:auto;scrollbar-width:none;display:flex;justify-content:center}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}

#blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1;animation:blobF 10s ease-in-out infinite alternate}
.b1{width:500px;height:500px;background:#8B5CF6;top:-150px;left:-150px}
.b2{width:400px;height:400px;background:#FF3CAC;bottom:-100px;right:-100px;animation-delay:-4s}
.b3{width:300px;height:300px;background:#06B6D4;top:40%;left:60%;animation-delay:-7s}
@keyframes blobF{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,30px) scale(1.1)}}

#app{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:32px}

#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
#backHome{color:var(--text);text-decoration:none;font-weight:800;font-size:20px;line-height:1;flex-shrink:0}
#logo{font-family:var(--fh);font-size:15px;color:var(--yellow);text-decoration:none;flex:1;text-align:center}
#balMini{display:flex;align-items:center;gap:7px;background:var(--glass);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:12px;padding:6px 12px}
#balMiniIcon{font-size:17px}
#balMiniNum{font-family:var(--fh);font-size:18px;color:var(--yellow);line-height:1}
#balMiniLabel{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:1.5px;margin-top:1px}

main{padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}

.panel{background:var(--glass);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:18px;padding:18px}

/* ESCUDO */
#shieldPanel.active{border-color:rgba(16,185,129,.5);background:rgba(16,185,129,.08)}
#shieldPanel.inactive{border-color:rgba(239,68,68,.35)}
.shieldRow{display:flex;align-items:center;gap:12px}
.shieldIcon{font-size:32px}
.shieldTitle{font-family:var(--fh);font-size:16px;color:var(--text)}
.shieldSub{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.shieldCountdown{font-family:var(--fh);font-size:20px;color:var(--green);margin-left:auto}
.shieldBuyBtns{display:flex;gap:8px;margin-top:12px}
.shieldBuyBtn{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 6px;font-weight:800;font-size:12px;color:var(--text);cursor:pointer;text-align:center;line-height:1.5}
.shieldBuyBtn:active{transform:scale(.96)}
.shieldBuyBtn:disabled{opacity:.4;cursor:not-allowed}

/* BOTÓN INVASIÓN */
#invadeBtn{width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-family:var(--fh);font-size:18px;cursor:pointer;box-shadow:0 8px 24px rgba(255,60,172,.35)}
#invadeBtn:active{transform:scale(.97)}
#invadeBtn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#invadeHint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;font-weight:700}

/* VENGANZA */
#revengePanel{display:none;border-color:rgba(255,107,53,.5);background:rgba(255,107,53,.08)}
#revengePanel.show{display:block}
.revengeRow{display:flex;align-items:center;gap:12px}
.revengeIcon{font-size:28px}
#revengeBtn{margin-top:10px;width:100%;padding:12px;border:none;border-radius:12px;background:var(--orange);color:#fff;font-family:var(--fh);font-size:14px;cursor:pointer}
#revengeBtn:active{transform:scale(.97)}

/* HISTORIAL */
.sectionTitle{font-family:var(--fh);font-size:14px;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;padding-left:4px}
.histRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.histRow:last-child{border-bottom:none}
.histIcon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.histText{flex:1;font-size:13px;font-weight:700;min-width:0}
.histText b{color:var(--text)}
.histAmount{font-family:var(--fh);font-size:14px;flex-shrink:0}
.histAmount.win{color:var(--green)}
.histAmount.lose{color:var(--red)}
.histTime{font-size:10px;color:var(--muted);margin-top:2px}
.emptyHist{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:20px 0}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 20px;font-size:13px;font-weight:700;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
#toast.show{opacity:1}

#loading{position:fixed;inset:0;background:#0b0a14;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loadingImg{width:100%;height:100%;object-fit:contain}

/* ── Video de INTRO de Invasión — se muestra una sola vez, la primera
   vez que se entra a este modo (misma lógica y misma interfaz que el
   video de presentación del juego padre en index.html: overlay a
   pantalla completa con fundido de entrada/salida y botón "Saltar").
   No hay música de fondo propia en Invasión con la que solaparse, así
   que aquí no hace falta pausar/reanudar ningún BGM.

   El video está en vertical 9:16. En MOVIL ocupa todo el viewport con
   object-fit:cover. En ESCRITORIO (min-width:901px) se mantiene la
   MISMA proporción 9:16 sin estirar, centrada sobre fondo negro con
   object-fit:contain -igual criterio que el padre-.

   #introfade es una capa negra por encima del video que se usa SOLO
   para el fundido de 1s de entrada/salida; no recorta ni adelanta el
   video, que sigue su curso completo por debajo. ─────────────────── */
#introov{display:none;position:fixed;inset:0;background:#000;z-index:100000;align-items:center;justify-content:center}
#introov.show{display:flex}
#introvideo{width:100%;height:100%;object-fit:cover}
#introfade{position:fixed;inset:0;background:#000;z-index:100002;opacity:1;pointer-events:none;transition:opacity 1s linear}
#introfade.in{opacity:0}
#introskip{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:100003;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:9px 18px;color:#fff;font-family:var(--fb);font-weight:800;font-size:12.5px;cursor:pointer;backdrop-filter:blur(4px)}
@media (min-width:901px){
  #introvideo{width:100%;height:100%;object-fit:contain}
}
</style>
</head>
<body>

<div id="loading"><img id="loadingImg" src="images/preloadinvasion.jpeg" alt="Invasión"></div>
<div id="introov">
  <video id="introvideo" src="videos/invasioncortapresentacion.mp4" playsinline></video>
  <div id="introfade"></div>
  <button id="introskip" onclick="skipIntroVideo()">Saltar ⏭️</button>
</div>
<div id="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="app">
  <main>
    <!-- ESCUDO -->
    <div class="panel" id="shieldPanel">
      <div class="shieldRow">
        <div class="shieldIcon" id="shieldIcon">🛡️</div>
        <div>
          <div class="shieldTitle" id="shieldTitle">Sin escudo</div>
          <div class="shieldSub" id="shieldSub">Eres un objetivo válido</div>
        </div>
        <div class="shieldCountdown" id="shieldCountdown" style="display:none"></div>
      </div>
      <div class="shieldBuyBtns" id="shieldBuyBtns"></div>
    </div>

    <!-- VENGANZA -->
    <div class="panel" id="revengePanel">
      <div class="revengeRow">
        <div class="revengeIcon">⚔️</div>
        <div>
          <div class="shieldTitle" id="revengeTitle">¡Te han robado!</div>
          <div class="shieldSub" id="revengeSub"></div>
        </div>
      </div>
      <button id="revengeBtn">VENGARSE AHORA</button>
    </div>

    <!-- BUSCAR RIVAL -->
    <div class="panel">
      <button id="invadeBtn">🚀 BUSCAR RIVAL</button>
      <div id="invadeHint"></div>
    </div>

    <!-- HISTORIAL -->
    <div>
      <div class="sectionTitle">HISTORIAL DE ROBOS</div>
      <div class="panel" id="histPanel">
        <div class="emptyHist">Cargando historial…</div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script type="module">
import './js/invasion-core.js'; // define window.InvasionCore antes de seguir

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

function fmtClk(n){
  n=Math.floor(n);
  if(n>=1e12)return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return n+'';
}

function fmtCountdown(ms){
  if(ms<=0)return '';
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60), sec=s%60;
  if(d>0)return `${d}d ${h}h`;
  if(h>0)return `${h}h ${m}m`;
  if(m>0)return `${m}m ${sec}s`;
  return `${sec}s`;
}

let core, myProfile, countdownInterval, invadeHintInterval;

/* ── Video de presentación de Invasión, mismo criterio que el video de
   intro del juego padre (index.html): se reproduce una sola vez, la
   primera vez que se entra a este modo, con fundido de entrada/salida
   de 1s sobre una capa negra (#introfade) que no toca ni recorta el
   video -éste sigue su curso completo por debajo-. Como este archivo
   es un <script type="module">, sus declaraciones no quedan colgadas
   de window por defecto, así que skipIntroVideo se expone a mano para
   que el botón "Saltar" (onclick en HTML) pueda encontrarla.
   La "primera vez" se recuerda en localStorage bajo la misma
   convención de prefijo cck4_ que usa el resto del proyecto (ver
   cck4_muted/cck4_refs en index.html), así que una vez visto no
   vuelve a aparecer aunque se recargue o se reabra la app. ────────── */
const INVASION_INTRO_KEY='cck4_invasion_intro_shown';
const INTRO_FADE_MS=1000;
function invasionIntroAlreadyShown(){
  try{ return localStorage.getItem(INVASION_INTRO_KEY)==='1'; }catch(e){ return false; }
}
function markInvasionIntroShown(){
  try{ localStorage.setItem(INVASION_INTRO_KEY,'1'); }catch(e){}
}
function playIntroVideo(onDone){
  const ov=document.getElementById('introov');
  const vid=document.getElementById('introvideo');
  const fade=document.getElementById('introfade');
  if(!ov||!vid){onDone();return}
  let done=false;
  let outStarted=false;
  // Fundido de SALIDA: arranca 1s antes de que el video termine, para
  // que justo cuando llega a su último frame ya esté en negro. No toca
  // la reproducción -sigue corriendo hasta el final real-, solo tapa
  // visualmente ese último segundo.
  const onTime=()=>{
    if(outStarted||!vid.duration)return;
    if(vid.duration-vid.currentTime<=INTRO_FADE_MS/1000){
      outStarted=true;
      fade.classList.remove('in');
    }
  };
  vid.addEventListener('timeupdate',onTime);
  const finish=()=>{
    if(done)return; done=true;
    vid.removeEventListener('timeupdate',onTime);
    vid.pause();
    ov.classList.remove('show');
    fade.classList.remove('in'); // listo en negro por si se necesitara reutilizar el overlay
    markInvasionIntroShown();
    onDone();
  };
  vid.currentTime=0;
  vid.muted=false;
  fade.style.transitionDuration=INTRO_FADE_MS+'ms';
  fade.classList.remove('in'); // arranca tapado en negro
  ov.classList.add('show');
  vid.onended=finish;
  vid.onerror=finish; // si el archivo no carga (red, ruta, etc.), seguimos sin bloquear el arranque
  // Fundido de ENTRADA: en cuanto el video empieza a reproducirse de
  // verdad (no solo "play() resuelto", sino el primer frame ya
  // avanzando) se desvanece el negro. requestAnimationFrame tras
  // play() evita un parpadeo si el primer frame tarda en pintarse.
  vid.play().then(()=>{
    requestAnimationFrame(()=>fade.classList.add('in'));
  }).catch(finish); // autoplay con sonido puede fallar sin gesto previo del usuario
  window.__skipInvasionIntroVideo=finish;
}
window.skipIntroVideo=function(){ if(window.__skipInvasionIntroVideo)window.__skipInvasionIntroVideo(); };

async function boot(){
  // El import de invasion-core.js al principio de este mismo módulo ya
  // garantiza que window.InvasionCore existe antes de que llegue este punto.
  core = window.InvasionCore;
  const user = await core.authReady;
  if(!user){
    toast('⚠️ Debes iniciar sesión en el juego principal primero');
    document.getElementById('loading').classList.add('hide');
    return;
  }

  try{
    myProfile = { uid: user.uid, ...(await core.syncProfileFromMainSave(user.uid)) };
    renderAll();
    document.getElementById('loading').classList.add('hide');

    const startRest=()=>{
      countdownInterval = setInterval(updateShieldUI, 1000);
      loadHistory();
      checkRevenge();
    };
    // El video de presentación (si aplica) arranca SOLO cuando el
    // loading ya terminó de ocultarse, nunca en paralelo con él —mismo
    // criterio que el video de intro del juego padre en index.html—.
    // El resto del arranque (countdown, historial, revancha) espera a
    // que termine o se salte el video para no competir por atención
    // con él mientras está en pantalla.
    if(!invasionIntroAlreadyShown()){
      playIntroVideo(startRest);
    }else{
      startRest();
    }
  }catch(e){
    // Sin este catch, cualquier fallo aquí (permisos, red, lo que sea)
    // dejaba el loader colgado para siempre en silencio, sin mostrar
    // nada al jugador ni una pista de qué pasó. Con el catch, al menos
    // se ve el error real en consola y el jugador sabe que algo falló
    // en vez de quedarse mirando el logo parpadeando sin explicación.
    console.error('boot() falló:', e);
    toast('❌ No se pudo cargar el modo Invasión. Reintenta o avisa si persiste.');
    document.getElementById('loading').classList.add('hide');
  }
}

function renderAll(){
  document.getElementById('balMiniNum').textContent = fmtClk(myProfile.clk);
  renderShieldButtons();
  updateShieldUI();
  updateInvadeButton();
}

function updateShieldUI(){
  const panel=document.getElementById('shieldPanel');
  const now=Date.now();
  const active = myProfile.shieldUntil > now;
  panel.classList.toggle('active', active);
  panel.classList.toggle('inactive', !active);
  document.getElementById('shieldIcon').textContent = active ? '🛡️' : '⚠️';
  document.getElementById('shieldTitle').textContent = active
    ? `Escudo activo (${myProfile.shieldType})`
    : 'Sin escudo';
  document.getElementById('shieldSub').textContent = active
    ? 'No puedes ser invadido'
    : 'Eres un objetivo válido';
  const cd=document.getElementById('shieldCountdown');
  if(active){
    cd.style.display='block';
    cd.textContent = fmtCountdown(myProfile.shieldUntil - now);
  } else {
    cd.style.display='none';
  }
}

function renderShieldButtons(){
  const wrap=document.getElementById('shieldBuyBtns');
  wrap.innerHTML='';
  core.CFG.SHIELDS_ENABLED.forEach(type=>{
    const hours=core.CFG.SHIELD_HOURS[type];
    const label = hours>=24 ? `${hours/24}d` : `${hours}h`;
    const cost = core.shieldCost(type, myProfile.lvl || 1);
    const btn=document.createElement('button');
    btn.className='shieldBuyBtn';
    btn.innerHTML=`Escudo ${label}<br>🪙 ${fmtClk(cost)}`;
    btn.disabled = (myProfile.clk||0) < cost;
    btn.onclick=()=>buyShield(type, cost);
    wrap.appendChild(btn);
  });
}

async function buyShield(type, expectedCost){
  try{
    const { shieldUntil, cost, newClk } = await core.activateShield(myProfile.uid, type);
    myProfile.shieldUntil = shieldUntil;
    myProfile.shieldType = type;
    myProfile.clk = newClk;
    document.getElementById('balMiniNum').textContent = fmtClk(myProfile.clk);
    renderShieldButtons();
    updateShieldUI();
    toast(`🛡️ Escudo activado por 🪙 ${fmtClk(cost)}`);
  }catch(e){
    console.error(e);
    if((e.message||'').includes('CLK insuficiente')){
      toast(`❌ Te faltan $CLK para este escudo (cuesta 🪙 ${fmtClk(expectedCost)})`);
    }else{
      toast('❌ No se pudo activar el escudo');
    }
  }
}

function updateInvadeButton(){
  const btn=document.getElementById('invadeBtn');
  const hint=document.getElementById('invadeHint');
  const check = core.checkCanInvade(myProfile);
  clearInterval(invadeHintInterval);
  if(check.ok){
    btn.disabled=false;
    hint.textContent='';
    return;
  }
  btn.disabled=true;
  const reasons={
    cuenta_nueva:'Cuenta nueva: protegida 24h antes de poder invadir',
    cooldown:'Espera antes de lanzar otra invasión',
    limite_diario:'Límite diario de invasiones alcanzado',
  };
  const update=()=>{
    const c2 = core.checkCanInvade(myProfile);
    if(c2.ok){
      btn.disabled=false;hint.textContent='';clearInterval(invadeHintInterval);return;
    }
    hint.textContent = reasons[c2.reason] + (c2.msLeft>0 ? ` (${fmtCountdown(c2.msLeft)})` : '');
  };
  update();
  invadeHintInterval=setInterval(update,1000);
}

document.getElementById('invadeBtn').onclick=()=>{
  window.location.href='search.html';
};

document.getElementById('revengeBtn').onclick=async ()=>{
  const target = await core.getActiveRevengeTarget(myProfile.uid);
  if(!target){
    toast('Ya no puedes vengarte de ese ataque');
    document.getElementById('revengePanel').classList.remove('show');
    return;
  }
  sessionStorage.setItem('invasion_direct_target', target.attackerUid);
  sessionStorage.setItem('invasion_is_revenge', '1');
  window.location.href='search.html'; // search.html detecta invasion_direct_target
                                        // y salta la búsqueda aleatoria, pero SÍ
                                        // muestra la pantalla de confirmación de
                                        // rival (dificultad, saldo) antes del
                                        // minijuego — "directa" es saltarse el
                                        // azar, no saltarse la confirmación.
};

async function checkRevenge(){
  try{
    const target = await core.getActiveRevengeTarget(myProfile.uid);
    const panel=document.getElementById('revengePanel');
    if(target){
      document.getElementById('revengeSub').textContent =
        `${target.attackerAlias} te robó ${fmtClk(target.stolenAmount)} $CLK — ${fmtCountdown(target.msLeft)} para vengarte`;
      panel.classList.add('show');
    }else{
      panel.classList.remove('show');
    }
  }catch(e){ console.error('checkRevenge failed:',e); }
}

async function loadHistory(){
  const panel=document.getElementById('histPanel');
  try{
    const rows = await core.getAttackHistory(myProfile.uid, 15);
    if(rows.length===0){
      panel.innerHTML='<div class="emptyHist">Aún no hay robos registrados</div>';
      return;
    }
    panel.innerHTML='';
    rows.forEach(r=>{
      const isMeAttacker = r.role==='attacker';
      const won = r.won;
      const icon = isMeAttacker ? (won?'💰':'💥') : (won?'😱':'🛡️');
      const otherAlias = isMeAttacker ? r.defenderAlias : r.attackerAlias;
      let text;
      if(isMeAttacker){
        text = won ? `Robaste a <b>${escapeHtml(otherAlias)}</b>` : `Fallaste contra <b>${escapeHtml(otherAlias)}</b>`;
      }else{
        text = won ? `<b>${escapeHtml(otherAlias)}</b> te robó` : `<b>${escapeHtml(otherAlias)}</b> intentó robarte y falló`;
      }
      const amountClass = (isMeAttacker && won) ? 'win' : ((!isMeAttacker && won) ? 'lose' : '');
      const amountText = r.stolenAmount>0 ? `${isMeAttacker?'+':'-'}${fmtClk(r.stolenAmount)}` : '—';
      const createdMs = r.createdAt && r.createdAt.toMillis ? r.createdAt.toMillis() : Date.now();
      const row=document.createElement('div');
      row.className='histRow';
      row.innerHTML=`
        <div class="histIcon">${icon}</div>
        <div class="histText">${text}<div class="histTime">${timeAgo(createdMs)}</div></div>
        <div class="histAmount ${amountClass}">${amountText}</div>
      `;
      panel.appendChild(row);
    });
  }catch(e){
    console.error('loadHistory failed:',e);
    panel.innerHTML='<div class="emptyHist">No se pudo cargar el historial</div>';
  }
}

function escapeHtml(s){
  const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;
}
function timeAgo(ms){
  const diff=Date.now()-ms;
  const m=Math.floor(diff/60000);
  if(m<1)return 'ahora mismo';
  if(m<60)return `hace ${m}m`;
  const h=Math.floor(m/60);
  if(h<24)return `hace ${h}h`;
  return `hace ${Math.floor(h/24)}d`;
}

boot();
</script>

</body>
</html>
