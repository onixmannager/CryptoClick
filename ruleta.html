<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Galáctica</title>
<style>
  :root{
    --gold-light:#f5d68a;
    --gold:#d9a441;
    --gold-dark:#8a5a1e;
    --cyan:#4bd8ff;
    --cyan-glow:#7ff2ff;
    --purple:#7b2fd6;
    --purple-dark:#3a1266;
    --green:#1fae7a;
    --green-dark:#0c5f42;
    --blue:#1b4fa8;
    --blue-dark:#0a2a5e;
    --bg-void:#050818;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 30%, #0e1a3a 0%, #050818 60%, #020310 100%);
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
    padding:20px;
  }

  .stage{
    position:relative;
    width:min(92vw, 440px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- estrellas de fondo ---------- */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#bfe6ff;
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }

  /* ---------- contenedor de la rueda ---------- */
  .wheel-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.6));
  }

  /* pico con cabeza alien */
  .alien-spike{
    position:absolute;
    top:-11%;
    left:50%;
    transform:translateX(-50%);
    width:24%;
    z-index:20;
    filter:drop-shadow(0 0 10px rgba(75,216,255,.7));
  }

  /* aro exterior con luces animadas */
  .ring-lights{
    position:absolute;
    inset:0;
    animation:none;
  }
  .bulb{
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.35; filter:brightness(1);}
    50%{opacity:1; filter:brightness(1.8);}
  }

  /* la rueda que gira */
  #wheelSvg{
    display:block;
    width:100%;
    height:100%;
    transform:rotate(0deg);
  }
  #wheelRotor{
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .sector-label{
    font-family:'Arial Black', 'Segoe UI', sans-serif;
    font-weight:900;
    fill:url(#textGoldBevel);
    stroke:#4a2b06;
    stroke-width:3;
    paint-order:stroke fill;
    letter-spacing:.5px;
    filter:url(#textEmboss);
  }

  /* botón central de disparo */
  .spin-btn{
    position:absolute;
    top:50%;
    left:50%;
    width:15.5%;
    height:15.5%;
    transform:translate(-50%,-50%);
    z-index:30;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:transparent;
    padding:0;
  }
  .spin-btn:active .hub-core{
    transform:scale(.94);
  }
  .spin-btn:disabled{cursor:default;}
  .hub-core{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #c9a6ff 0%, #8b4fe0 22%, #5a1fb0 48%, #2c0d5e 78%, #180736 100%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.35),
      inset 0 -10px 20px rgba(0,0,0,.55),
      0 0 22px rgba(139,79,224,.85),
      0 0 45px rgba(75,216,255,.35);
    border:3px solid var(--gold);
    transition:transform .15s ease;
  }

  /* puntero superior */
  .pointer{
    position:absolute;
    top:-2.5%;
    left:50%;
    transform:translateX(-50%);
    width:7%;
    z-index:25;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  }

  /* ---------- Resultado ---------- */
  .result-box{
    margin-top:22px;
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .result-box.show{
    opacity:1;
    transform:translateY(0);
  }
  .result-pill{
    padding:10px 28px;
    border-radius:999px;
    background:linear-gradient(180deg,#1a2350,#0c1230);
    border:1.5px solid var(--cyan);
    box-shadow:0 0 18px rgba(75,216,255,.55), inset 0 0 10px rgba(75,216,255,.15);
    color:var(--gold-light);
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.5px;
    text-shadow:0 0 8px rgba(245,214,138,.5);
  }

  .spin-cta{
    margin-top:18px;
    padding:13px 40px;
    border-radius:999px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,#3a1266,#1a0838);
    color:var(--gold-light);
    font-weight:800;
    font-size:1rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 0 20px rgba(123,47,214,.55), inset 0 1px 0 rgba(255,255,255,.15);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .spin-cta:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 0 28px rgba(75,216,255,.6), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .spin-cta:active:not(:disabled){
    transform:translateY(0);
  }
  .spin-cta:disabled{
    opacity:.5;
    cursor:default;
  }

  .brand{
    margin-top:26px;
    color:var(--cyan-glow);
    letter-spacing:4px;
    font-size:.7rem;
    opacity:.55;
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .result-pill{font-size:.9rem; padding:9px 20px;}
    .spin-cta{font-size:.85rem; padding:11px 30px;}
  }

  /* ============================================================================
     ALIEN MASCOTA ANIMADA — esquina inferior izquierda
     ============================================================================
     Estructura de capas (todas ancladas al mismo pie/base para que ningún
     movimiento "flote" ni se desconecte del suelo):
       .alien-mascot        -> contenedor fijo en la esquina, define posición y tamaño
         .alien-bob         -> capa de balanceo/salto vertical global (Y)
           .alien-tilt      -> capa de inclinación de todo el cuerpo (rotación leve)
             .alien-sprite  -> la imagen PNG real, con foco de transform-origin en los pies
       .alien-shadow        -> sombra elíptica en el suelo, se comprime/expande con el salto

     Dos animaciones CSS independientes controladas por clases JS:
       .is-waiting    -> intriga/emoción mientras la ruleta gira (bucle continuo)
       .is-celebrating -> festejo al anunciar el premio (una sola pasada, luego vuelve a idle)
     Por defecto (sin clase) el alien respira suavemente en idle.
  ---------------------------------------------------------------------------- */

  .alien-mascot{
    position:fixed;
    left:clamp(8px, 2.5vw, 26px);
    bottom:clamp(8px, 2.5vh, 26px);
    width:clamp(78px, 16vw, 140px);
    z-index:50;
    pointer-events:none;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.55));
  }

  .alien-shadow{
    position:absolute;
    left:50%;
    bottom:-6%;
    width:62%;
    height:14%;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,0) 80%);
    border-radius:50%;
    animation:shadowIdle 3.6s ease-in-out infinite;
    transform-origin:center;
  }

  .alien-bob{
    width:100%;
    transform-origin:50% 100%;
    animation:bobIdle 3.6s ease-in-out infinite;
  }

  .alien-tilt{
    width:100%;
    transform-origin:50% 96%;
    animation:tiltIdle 3.6s ease-in-out infinite;
  }

  .alien-sprite{
    display:block;
    width:100%;
    height:auto;
    -webkit-user-select:none;
    user-select:none;
    transform-origin:50% 96%;
  }

  /* ---------------- IDLE: respiración suave, en bucle permanente ---------------- */
  @keyframes bobIdle{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3%); }
  }
  @keyframes tiltIdle{
    0%,100%{ transform:rotate(-1.2deg); }
    50%{ transform:rotate(1.2deg); }
  }
  @keyframes shadowIdle{
    0%,100%{ transform:translateX(-50%) scaleX(1); opacity:.75; }
    50%{ transform:translateX(-50%) scaleX(.92); opacity:.55; }
  }

  /* ================================================================
     FASE 1 — is-waiting: intriga / emoción mientras gira la ruleta
     El cuerpo se inclina hacia adelante como "asomándose" a mirar,
     la cabeza-cuerpo oscila siguiendo el giro imaginario de la rueda,
     hay un ligero temblor de expectación y un salto de impaciencia
     cada cierto tiempo. Bucle continuo (se corta cuando llega el
     resultado y se cambia a is-celebrating).
     ================================================================ */
  .alien-mascot.is-waiting .alien-bob{
    animation:bobWaiting 0.62s ease-in-out infinite;
  }
  .alien-mascot.is-waiting .alien-tilt{
    animation:tiltWaiting 1.85s cubic-bezier(.45,0,.55,1) infinite;
  }
  .alien-mascot.is-waiting .alien-shadow{
    animation:shadowWaiting 0.62s ease-in-out infinite;
  }
  .alien-mascot.is-waiting .alien-sprite{
    animation:squashWaiting 0.62s ease-in-out infinite;
  }

  @keyframes bobWaiting{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5%); }
  }

  /* inclinación pronunciada hacia adelante + balanceo lateral tipo
     "siguiendo la rueda con la mirada", con un pico de tensión donde
     se inclina más hacia el centro de la escena (derecha) como si
     estirara el cuello para ver mejor el premio */
  @keyframes tiltWaiting{
    0%      { transform:rotate(-3deg)  translateX(0); }
    12%     { transform:rotate(6deg)   translateX(2%); }
    25%     { transform:rotate(-8deg)  translateX(-1%); }
    37%     { transform:rotate(9deg)   translateX(3%); }
    50%     { transform:rotate(-10deg) translateX(-2%); }
    62%     { transform:rotate(10deg)  translateX(4%) scale(1.04); }
    75%     { transform:rotate(-7deg)  translateX(-1%); }
    87%     { transform:rotate(5deg)   translateX(2%); }
    100%    { transform:rotate(-3deg)  translateX(0); }
  }

  @keyframes shadowWaiting{
    0%,100%{ transform:translateX(-50%) scaleX(1); opacity:.7; }
    50%{ transform:translateX(-50%) scaleX(.82); opacity:.45; }
  }

  /* micro "squash & stretch" nervioso en la propia imagen, como si
     contuviera la respiración por la emoción */
  @keyframes squashWaiting{
    0%,100%{ transform:scaleY(1) scaleX(1); }
    50%{ transform:scaleY(1.03) scaleX(.985); }
  }

  /* ================================================================
     FASE 2 — is-celebrating: festejo al ganar el premio
     Secuencia única (no infinita): sorpresa breve -> salto grande con
     giro de alegría -> rebotes decrecientes -> pose final feliz con
     balanceo idle de nuevo. Duración pensada para encajar con el
     tiempo que el result-box tarda en mostrarse (~1.9s).
     ================================================================ */
  .alien-mascot.is-celebrating .alien-bob{
    animation:bobCelebrate 1.9s cubic-bezier(.34,1.56,.64,1) 1;
  }
  .alien-mascot.is-celebrating .alien-tilt{
    animation:tiltCelebrate 1.9s cubic-bezier(.34,1.56,.64,1) 1;
  }
  .alien-mascot.is-celebrating .alien-shadow{
    animation:shadowCelebrate 1.9s cubic-bezier(.34,1.56,.64,1) 1;
  }
  .alien-mascot.is-celebrating .alien-sprite{
    animation:squashCelebrate 1.9s cubic-bezier(.34,1.56,.64,1) 1;
  }

  @keyframes bobCelebrate{
    0%    { transform:translateY(0); }
    8%    { transform:translateY(6%); }               /* se agacha para tomar impulso */
    22%   { transform:translateY(-68%); }              /* salto grande de alegría */
    34%   { transform:translateY(-56%); }
    46%   { transform:translateY(-3%); }               /* aterriza */
    56%   { transform:translateY(-26%); }              /* rebote 2 */
    68%   { transform:translateY(0%); }
    78%   { transform:translateY(-11%); }              /* rebote 3, más pequeño */
    88%   { transform:translateY(0%); }
    100%  { transform:translateY(0); }
  }

  @keyframes tiltCelebrate{
    0%    { transform:rotate(-2deg)   scale(1); }
    8%    { transform:rotate(-9deg)   scale(.94); }    /* se encoge de sorpresa/emoción */
    22%   { transform:rotate(20deg)   scale(1.14); }   /* salto con giro hacia un lado */
    34%   { transform:rotate(-22deg)  scale(1.14); }   /* giro hacia el otro, "bailando" */
    46%   { transform:rotate(13deg)   scale(1.04); }
    56%   { transform:rotate(-12deg)  scale(1.07); }
    68%   { transform:rotate(8deg)    scale(1.01); }
    78%   { transform:rotate(-5deg)   scale(1.03); }
    88%   { transform:rotate(2deg)    scale(1); }
    100%  { transform:rotate(0deg)    scale(1); }
  }

  @keyframes shadowCelebrate{
    0%    { transform:translateX(-50%) scaleX(1);   opacity:.75; }
    8%    { transform:translateX(-50%) scaleX(1.1);  opacity:.8; }
    22%   { transform:translateX(-50%) scaleX(.4);   opacity:.15; }  /* sombra muy chica = está bien arriba */
    34%   { transform:translateX(-50%) scaleX(.48);  opacity:.18; }
    46%   { transform:translateX(-50%) scaleX(1.15); opacity:.7; }   /* aterriza, sombra ancha */
    56%   { transform:translateX(-50%) scaleX(.7);   opacity:.35; }
    68%   { transform:translateX(-50%) scaleX(1.05); opacity:.7; }
    78%   { transform:translateX(-50%) scaleX(.88);  opacity:.5; }
    88%   { transform:translateX(-50%) scaleX(1);    opacity:.75; }
    100%  { transform:translateX(-50%) scaleX(1);    opacity:.75; }
  }

  @keyframes squashCelebrate{
    0%    { transform:scaleY(1)    scaleX(1); }
    8%    { transform:scaleY(.88)  scaleX(1.12); }     /* se aplasta antes de saltar */
    22%   { transform:scaleY(1.18) scaleX(.88); }       /* estirado en el aire */
    34%   { transform:scaleY(1.15) scaleX(.9); }
    46%   { transform:scaleY(.85)  scaleX(1.15); }      /* aplastado al aterrizar */
    56%   { transform:scaleY(1.08) scaleX(.95); }
    68%   { transform:scaleY(.95)  scaleX(1.05); }
    78%   { transform:scaleY(1.04) scaleX(.98); }
    88%   { transform:scaleY(.99)  scaleX(1.01); }
    100%  { transform:scaleY(1)    scaleX(1); }
  }

  /* estrellitas/destellos de celebración alrededor del alien.
     El contenedor NO anima opacidad propia (eso causaba doble-atenuación
     junto con la animación de cada .spark y las dejaba casi invisibles);
     solo posiciona el área donde se generan las chispas. Cada .spark
     controla su propia aparición/desaparición de forma independiente. */
  .alien-sparkles{
    position:absolute;
    inset:-55% -70%;
    pointer-events:none;
  }
  .spark{
    position:absolute;
    width:14px;height:14px;
    margin:-7px 0 0 -7px; /* centra el marcador en su punto left/top */
    background:radial-gradient(circle, #fffdf0 0%, var(--gold-light) 35%, var(--gold) 70%, transparent 100%);
    clip-path:polygon(50% 0%, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0% 50%, 37% 37%);
    filter:drop-shadow(0 0 6px rgba(255,244,190,.95)) drop-shadow(0 0 12px rgba(75,216,255,.6));
    animation:sparkPop 1.3s ease-out 1 both;
    opacity:0;
  }
  @keyframes sparkPop{
    0%     { transform:scale(0)    rotate(0deg);   opacity:0; }
    12%    { transform:scale(1.4)  rotate(40deg);  opacity:1; }
    30%    { transform:scale(1)    rotate(90deg);  opacity:1; }
    70%    { transform:scale(.85)  rotate(170deg); opacity:.9; }
    100%   { transform:scale(0)    rotate(230deg); opacity:0; }
  }

  @media (max-width:380px){
    .alien-mascot{ width:clamp(64px, 20vw, 100px); }
  }
</style>
</head>
<body>

<div class="stars" id="starsField"></div>

<!-- ===================== ALIEN MASCOTA — esquina inferior izquierda =====================
     Estados controlados por JS añadiendo/quitando clases sobre #alienMascot:
       (sin clase)      -> idle, respiración suave en bucle
       is-waiting       -> intriga/emoción mientras la ruleta está girando
       is-celebrating   -> festejo al anunciar el premio (una sola pasada)
     ============================================================================ -->
<div class="alien-mascot" id="alienMascot">
  <div class="alien-shadow"></div>
  <div class="alien-bob">
    <div class="alien-tilt">
      <img class="alien-sprite" src="alien.png" alt="Alien mascota" draggable="false">
    </div>
  </div>
  <div class="alien-sparkles" id="alienSparkles"></div>
</div>

<div class="stage">

  <div class="wheel-wrap" id="wheelWrap">

    <!-- pico dorado con cabeza alien -->
    <svg class="alien-spike" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="spikeGold" x1="0.15" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="30%" stop-color="#f5d68a"/>
          <stop offset="55%" stop-color="#c99a3a"/>
          <stop offset="80%" stop-color="#a9701f"/>
          <stop offset="100%" stop-color="#6b4413"/>
        </linearGradient>
        <radialGradient id="alienFace" cx="50%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#204f64"/>
          <stop offset="55%" stop-color="#0b2430"/>
          <stop offset="100%" stop-color="#020608"/>
        </radialGradient>
        <radialGradient id="eyeGlow" cx="45%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#eafeff"/>
          <stop offset="40%" stop-color="#7ff2ff"/>
          <stop offset="75%" stop-color="#279cc4"/>
          <stop offset="100%" stop-color="#0d5a78"/>
        </radialGradient>
      </defs>

      <!-- marco dorado del pico, forma de escudo redondeado, con bisel -->
      <path d="M100 2
               C140 2 168 28 170 62
               C172 98 158 130 138 158
               L100 226
               L62 158
               C42 130 28 98 30 62
               C32 28 60 2 100 2 Z"
            fill="url(#spikeGold)" stroke="#3a2200" stroke-width="3"/>
      <path d="M100 10
               C134 10 158 32 160 62
               C162 94 149 122 132 148
               L100 210
               L68 148
               C51 122 38 94 40 62
               C42 32 66 10 100 10 Z"
            fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.55"/>

      <!-- cara oscura interior -->
      <path d="M100 22
               C130 22 149 41 151 64
               C153 90 143 113 129 136
               L100 192
               L71 136
               C57 113 47 90 49 64
               C51 41 70 22 100 22 Z"
            fill="url(#alienFace)" stroke="#7ff2ff" stroke-width="3" opacity="0.95"/>

      <!-- ojos almendrados, tamaño moderado para leerse nítidos incluso pequeños -->
      <ellipse cx="82" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="118" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="79" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>
      <ellipse cx="115" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>

      <!-- boca pequeña -->
      <path d="M92 146 Q100 152 108 146" stroke="#4bd8ff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    </svg>

    <!-- puntero -->
    <svg class="pointer" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ptrGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fdeeb0"/>
          <stop offset="60%" stop-color="#d9a441"/>
          <stop offset="100%" stop-color="#7a4d16"/>
        </linearGradient>
      </defs>
      <path d="M30 68 L2 10 Q30 -6 58 10 Z" fill="url(#ptrGold)" stroke="#5c3a0f" stroke-width="2"/>
      <circle cx="30" cy="16" r="6" fill="#7b2fd6" stroke="#f5d68a" stroke-width="2"/>
    </svg>

    <!-- ================= RUEDA SVG ================= -->
    <svg id="wheelSvg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- gradientes de sectores: radiales tipo "cuenco" — sombra hacia el centro, luz hacia el borde -->
        <radialGradient id="secGreen" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#052c1f"/>
          <stop offset="38%" stop-color="#0e7a52"/>
          <stop offset="68%" stop-color="#2fd39a"/>
          <stop offset="88%" stop-color="#7ffcd0"/>
          <stop offset="100%" stop-color="#c8fff0"/>
        </radialGradient>
        <radialGradient id="secPurple" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#230a4a"/>
          <stop offset="38%" stop-color="#6620c4"/>
          <stop offset="68%" stop-color="#a86bf0"/>
          <stop offset="88%" stop-color="#d9b6ff"/>
          <stop offset="100%" stop-color="#f3e5ff"/>
        </radialGradient>
        <radialGradient id="secBlue" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#071b40"/>
          <stop offset="38%" stop-color="#1b52ad"/>
          <stop offset="68%" stop-color="#4f8bf0"/>
          <stop offset="88%" stop-color="#a9caff"/>
          <stop offset="100%" stop-color="#e2edff"/>
        </radialGradient>
        <radialGradient id="secRed" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#3a0a10"/>
          <stop offset="38%" stop-color="#a3182b"/>
          <stop offset="68%" stop-color="#e8536a"/>
          <stop offset="88%" stop-color="#ffa7b6"/>
          <stop offset="100%" stop-color="#ffe1e6"/>
        </radialGradient>
        <radialGradient id="secOrange" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#3a1c02"/>
          <stop offset="38%" stop-color="#c1650f"/>
          <stop offset="68%" stop-color="#f5a13a"/>
          <stop offset="88%" stop-color="#ffcf8f"/>
          <stop offset="100%" stop-color="#ffedd0"/>
        </radialGradient>

        <!-- brillo especular tipo cristal, elipse desplazada hacia arriba-izquierda -->

        <!-- relieve dorado para texto: bisel metálico con luz arriba-izq y sombra abajo-der -->
        <linearGradient id="textGoldBevel" x1="0.2" y1="0" x2="0.75" y2="1">
          <stop offset="0%" stop-color="#fffdf5"/>
          <stop offset="30%" stop-color="#fff1bf"/>
          <stop offset="55%" stop-color="#f0bd4e"/>

        <filter id="textEmboss" x="-40%" y="-40%" width="180%" height="180%">

        <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">

          <feMerge>
            <feMergeNode in="wideBlur"/>
            <feMergeNode in="tightBlur"/>
            <feMergeNode in="SourceGraphic"/>

        </filter>

        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">

        </radialGradient>

        <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c9a6ff"/>
          <stop offset="30%" stop-color="#8b4fe0"/>

          <stop offset="100%" stop-color="#1c0838"/>
        </radialGradient>

        <linearGradient id="frameGold" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="18%" stop-color="#f5d68a"/>
          <stop offset="35%" stop-color="#c99a3a"/>
          <stop offset="50%" stop-color="#8a5a1e"/>
          <stop offset="65%" stop-color="#c99a3a"/>
          <stop offset="82%" stop-color="#f5d68a"/>
          <stop offset="100%" stop-color="#6b4413"/>
        </linearGradient>

        <!-- bisel interior del aro: da el canto grueso metálico -->
        <linearGradient id="frameGoldInner" x1="0.1" y1="0.05" x2="0.9" y2="1">
          <stop offset="0%" stop-color="#7a4d16"/>
          <stop offset="20%" stop-color="#e9c364"/>
          <stop offset="45%" stop-color="#fff6d8"/>
          <stop offset="55%" stop-color="#b9862f"/>
          <stop offset="80%" stop-color="#6b4413"/>
          <stop offset="100%" stop-color="#3a2200"/>
        </linearGradient>

        <radialGradient id="hubBevel" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="55%" stop-color="#e9c364"/>
          <stop offset="80%" stop-color="#8a5a1e"/>
          <stop offset="100%" stop-color="#3a2200"/>
        </radialGradient>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

      </defs>

      <!-- ===== marco exterior dorado — biselado multicapa, canal de luces hundido ===== -->
      <!-- sombra de contacto general, debajo de todo -->
      <ellipse cx="250" cy="260" rx="235" ry="220" fill="rgba(0,0,0,0.45)" filter="url(#softGlow)"/>

      <!-- ANILLO DORADO EXTERIOR: delgado, bisel marcado con franjas de luz/sombra -->
      <circle cx="250" cy="250" r="248" fill="url(#frameGold)"/>
      <circle cx="250" cy="250" r="248" fill="none" stroke="#3a2200" stroke-width="2"/>
      <circle cx="250" cy="250" r="243" fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="250" cy="250" r="236" fill="none" stroke="#4a2e0c" stroke-width="2" opacity="0.7"/>

      <!-- CANAL HUNDIDO: fondo oscuro morado donde viven las luces, entre dos bordes dorados -->
      <circle cx="250" cy="250" r="233" fill="#1a0f38"/>
      <circle cx="250" cy="250" r="233" fill="none" stroke="#0a0620" stroke-width="3"/>
      <circle cx="250" cy="250" r="220" fill="none" stroke="#0a0620" stroke-width="3"/>

      <!-- ANILLO DORADO INTERIOR: separa el canal de luces del disco -->
      <circle cx="250" cy="250" r="217" fill="url(#frameGoldInner)"/>
      <circle cx="250" cy="250" r="217" fill="none" stroke="#fff6d8" stroke-width="1" opacity="0.55"/>
      <circle cx="250" cy="250" r="210" fill="none" stroke="#3a2200" stroke-width="2" opacity="0.7"/>

      <!-- BANDA NEGRA: caída hacia el disco de sectores -->
      <circle cx="250" cy="250" r="207" fill="none" stroke="#050310" stroke-width="10"/>
      <circle cx="250" cy="250" r="200" fill="#0c1230"/>

      <!-- aro morado + cian justo antes del disco -->
      <circle cx="250" cy="250" r="200" fill="none" stroke="#5a1fb0" stroke-width="4" opacity="0.7"/>
      <circle cx="250" cy="250" r="197" fill="none" stroke="#4bd8ff" stroke-width="2" opacity="0.9" filter="url(#softGlow)"/>

      <!-- bombillas del canal hundido, radio intermedio entre los dos anillos dorados -->
      <g class="ring-lights" id="bulbsOuter"></g>

      <!-- ===== rueda giratoria (sectores + textos) — generada 100% por JS con trigonometría exacta ===== -->
      <g id="wheelRotor">

        <!-- disco base -->
        <circle cx="250" cy="250" r="196" fill="#08101f"/>

        <!-- los <path> de cada sector y sus <text> se insertan aquí por JavaScript,
             calculados con el mismo ángulo exacto que define el premio, así que
             SIEMPRE coinciden sector <-> etiqueta <-> resultado del giro -->
        <g id="sectorsGroup"></g>

        <!-- líneas divisoras: doble trazo (dorado grueso + cian brillante fino) -->
        <g id="dividersGroup" stroke-linecap="round"></g>

        <!-- sombra curva tipo "cuenco" — da profundidad de plato hondo a cada sector -->
        <circle cx="250" cy="250" r="196" fill="url(#bowlShade)"/>

        <!-- brillo especular tipo cristal, superpuesto sobre toda la rueda -->
        <circle cx="250" cy="250" r="196" fill="url(#glassSheen)" style="mix-blend-mode:screen"/>

        <!-- aro cian luminoso justo en el borde interior del disco, como vidrio retroiluminado -->
        <circle cx="250" cy="250" r="188" fill="none" stroke="#9df3ff" stroke-width="3" opacity="0.85" filter="url(#neonGlow)"/>

        <circle cx="250" cy="250" r="196" fill="none" stroke="#c99a3a" stroke-width="4"/>
        <circle cx="250" cy="250" r="192" fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.5"/>

        <!-- ===== textos de premios: insertados por JS, centrados por trigonometría real
             en el centroide de cada sector y orientados como un rayo recto desde el centro ===== -->
        <g id="labelsGroup"></g>

        <!-- marcadores triangulares dorados en los bordes: uno por cada límite entre sectores -->
        <g id="markersGroup" fill="url(#frameGold)" stroke="#5c3a0f" stroke-width="1.5"></g>
      </g>

      <!-- ===== hub central fijo (no gira) — esfera de cristal con profundidad real ===== -->
      <ellipse cx="250" cy="258" rx="52" ry="46" fill="rgba(0,0,0,0.5)" filter="url(#softGlow)"/>
      <circle cx="250" cy="250" r="60" fill="url(#hubBevel)"/>
      <circle cx="250" cy="250" r="60" fill="none" stroke="#3a2200" stroke-width="1.5"/>
      <circle cx="250" cy="250" r="51" fill="#08101f"/>
      <circle cx="250" cy="250" r="48" fill="url(#hubGlow)"/>
      <!-- sombra interna inferior de la esfera -->
      <path d="M210,268 A48,48 0 0,0 290,268 A55,38 0 0,1 210,268 Z" fill="rgba(0,0,0,0.4)"/>
      <!-- highlight especular principal -->
      <ellipse cx="233" cy="232" rx="17" ry="11" fill="rgba(255,255,255,0.55)"/>
      <!-- highlight secundario, más pequeño y nítido -->
      <ellipse cx="226" cy="226" rx="6" ry="4" fill="rgba(255,255,255,0.9)"/>
      <circle cx="250" cy="250" r="48" fill="none" stroke="#f5d68a" stroke-width="1.5" opacity="0.55"/>

    </svg>

    <!-- botón invisible clickable sobre el hub -->
    <button class="spin-btn" id="spinHubBtn" aria-label="Girar ruleta"></button>

  </div>

  <div class="result-box" id="resultBox">
    <div class="result-pill" id="resultPill">¡100K créditos!</div>
  </div>

  <button class="spin-cta" id="spinCtaBtn">GIRAR</button>

  <div class="brand">GALACTIC WINS</div>
</div>

<script>
(function(){
  // ============================================================================
  // ÚNICA FUENTE DE VERDAD DE LOS PREMIOS.
  // Todo lo demás (sectores de colores, textos, marcadores, cálculo del giro y
  // el resultado mostrado) se genera a partir de ESTE array, así que nunca puede
  // haber un desajuste entre lo que se ve pintado y lo que realmente se gana.
  //
  // "angle" = ángulo del CENTRO del sector, medido en sentido horario desde
  // arriba (12 en punto = 0°). No hace falta tocarlo si quieres añadir/quitar
  // premios: el ancho de sector (arc) se reparte solo entre 360°.
  // ============================================================================
  const prizes = [
    { label: "100K", value: 100000, gradient: "secGreen"  },
    { label: "5K",   value: 5000,   gradient: "secPurple" },
    { label: "10K",  value: 10000,  gradient: "secBlue"   },
    { label: "25K",  value: 25000,  gradient: "secRed"    },
    { label: "50K",  value: 50000,  gradient: "secOrange" },
    { label: "1K",   value: 1000,   gradient: "secTeal"   }
  ];

  // ---- probabilidades (opcional, editable) ----
  // "Peso" relativo de cada premio. Por defecto son equiprobables.
  // Puedes cambiar estos números libremente: la geometría de la rueda (tamaño
  // de cada sector, posición del texto) siempre se mantendrá coherente porque
  // se recalcula a partir de "prizes", que es fijo; solo cambia la PROBABILIDAD
  // de caer en cada sector, no su tamaño visual ni su etiqueta.
  const weights = {
    "100K": 1,
    "5K":   1,
    "10K":  1,
    "25K":  1,
    "50K":  1,
    "1K":   1
  };

  const CX = 250, CY = 250;
  const R_SECTOR   = 196;   // radio del disco de sectores
  const R_LABEL    = 128;   // radio donde se centra el texto de cada premio
  const R_MARK_IN  = 190;   // radio interior del marcador triangular
  const R_MARK_OUT = 202;   // radio exterior del marcador triangular
  const arc = 360 / prizes.length; // ancho angular de cada sector (60° con 6 premios)

  // Convierte un ángulo "horario desde arriba" a coordenadas cartesianas del SVG.
  // ángulo 0° = arriba (12 en punto), 90° = derecha, 180° = abajo, 270° = izquierda.
  function polarToXY(angleDeg, radius){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: CX + radius * Math.cos(rad),
      y: CY + radius * Math.sin(rad)
    };
  }

  // Precalcula, para cada premio, su ángulo de inicio/centro/fin de sector.
  // Esto es lo que garantiza la coherencia total: el mismo "centerAngle" se usa
  // para dibujar el sector, para rotar+colocar su texto, y para calcular a qué
  // ángulo debe parar la rueda cuando ese premio es el elegido.
  prizes.forEach((p, i) => {
    p.startAngle  = i * arc;
    p.centerAngle = i * arc + arc / 2;
    p.endAngle    = (i + 1) * arc;
  });

  // ---- Validación de integridad al cargar ----
  // Impide que la rueda arranque en un estado ambiguo: dos premios con la
  // misma etiqueta harían imposible saber cuál de los dos "ganó" realmente,
  // y un peso en "weights" que no corresponde a ningún premio dibujado sería
  // ruido sin efecto. Si algo de esto ocurre, se avisa fuerte en consola.
  (function validatePrizeIntegrity(){
    const seen = new Set();
    prizes.forEach(p => {
      if (seen.has(p.label)){
        console.error('[ruleta] ERROR DE CONFIGURACIÓN: la etiqueta "' + p.label + '" está repetida en "prizes". Cada premio debe tener una etiqueta única, o la rueda podría anunciar el premio equivocado entre los dos.');
      }
      seen.add(p.label);
    });
    Object.keys(weights).forEach(key => {
      if (!seen.has(key)){
        console.warn('[ruleta] Aviso: "weights" tiene una entrada ("' + key + '") que no corresponde a ningún premio dibujado en "prizes". Esa entrada se ignora y no tiene ningún efecto.');
      }
    });
  })();

  const sectorsGroup  = document.getElementById('sectorsGroup');
  const dividersGroup = document.getElementById('dividersGroup');
  const labelsGroup   = document.getElementById('labelsGroup');
  const markersGroup  = document.getElementById('markersGroup');

  // ---- 1) Dibuja los 6 sectores (arcos) ----
  prizes.forEach(p => {
    const start = polarToXY(p.startAngle, R_SECTOR);
    const end   = polarToXY(p.endAngle,   R_SECTOR);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    // arco de más de 180°? con 6 sectores de 60° nunca ocurre, pero se calcula
    // por si se cambia el número de premios en el futuro.
    const largeArc = (p.endAngle - p.startAngle) > 180 ? 1 : 0;
    path.setAttribute('d',
      `M${CX},${CY} L${start.x.toFixed(2)},${start.y.toFixed(2)} A${R_SECTOR},${R_SECTOR} 0 ${largeArc},1 ${end.x.toFixed(2)},${end.y.toFixed(2)} Z`
    );
    path.setAttribute('fill', `url(#${p.gradient})`);
    sectorsGroup.appendChild(path);
  });

  // ---- 2) Líneas divisoras en cada límite entre sectores (doble trazo) ----
  const dividerAngles = prizes.map(p => p.startAngle); // un límite antes de cada sector
  const thickLines = [];
  const glowLines  = [];
  dividerAngles.forEach(a => {
    const pt = polarToXY(a, R_SECTOR);
    thickLines.push(`<line x1="${CX}" y1="${CY}" x2="${pt.x.toFixed(2)}" y2="${pt.y.toFixed(2)}"/>`);
    glowLines.push(`<line x1="${CX}" y1="${CY}" x2="${pt.x.toFixed(2)}" y2="${pt.y.toFixed(2)}"/>`);
  });
  dividersGroup.innerHTML = `
    <g stroke="#7a4d16" stroke-width="5" opacity="0.55">${thickLines.join('')}</g>
    <g stroke="#7ff2ff" stroke-width="2.5" opacity="0.95" filter="url(#neonGlow)">${glowLines.join('')}</g>
  `;

  // ---- 3) Etiquetas de texto: SIEMPRE centradas en el centroide real del
  // sector y orientadas como un rayo recto (radial) desde el centro hacia
  // afuera, nunca "de cabeza" en la mitad inferior de la rueda. ----
  prizes.forEach(p => {
    const pos = polarToXY(p.centerAngle, R_LABEL);
    // Ángulo de rotación del texto = mismo ángulo del sector, para que quede
    // perfectamente alineado como una línea recta (radial) desde el centro.
    // Se normaliza matemáticamente al rango (-90°, 90°] usando módulo puro
    // (sin condiciones con bordes ambiguos), así el texto nunca aparece
    // invertido/patas arriba, ni siquiera en los ángulos exactos 90°/270°.
    let textAngle = ((p.centerAngle + 180) % 360 + 360) % 360 - 180;
    if (textAngle > 90) textAngle -= 180;
    if (textAngle < -90) textAngle += 180;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('class', 'sector-label');
    text.setAttribute('x', pos.x.toFixed(2));
    text.setAttribute('y', pos.y.toFixed(2));
    text.setAttribute('font-size', '42');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('transform', `rotate(${textAngle.toFixed(2)} ${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);
    text.textContent = p.label;
    labelsGroup.appendChild(text);
  });

  // ---- 4) Marcadores triangulares dorados en cada límite entre sectores ----
  dividerAngles.forEach(a => {
    const tipIn  = polarToXY(a, R_MARK_IN);
    const tipOut = polarToXY(a, R_MARK_OUT);
    // perpendicular al radio, para dar ancho al triángulo
    const perpRad = (a) * Math.PI / 180;
    const nx = Math.cos(perpRad), ny = Math.sin(perpRad);
    const widthPx = 9;
    const p1x = tipOut.x + (-ny) * widthPx, p1y = tipOut.y + (nx) * widthPx;
    const p2x = tipOut.x + (ny)  * widthPx, p2y = tipOut.y + (-nx) * widthPx;
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    poly.setAttribute('d', `M${tipIn.x.toFixed(2)},${tipIn.y.toFixed(2)} L${p1x.toFixed(2)},${p1y.toFixed(2)} L${p2x.toFixed(2)},${p2y.toFixed(2)} Z`);
    markersGroup.appendChild(poly);
  });

  // ============================================================================
  // Lógica de giro
  // ============================================================================
  const rotor       = document.getElementById('wheelRotor');
  const spinCtaBtn   = document.getElementById('spinCtaBtn');
  const spinHubBtn   = document.getElementById('spinHubBtn');
  const resultBox    = document.getElementById('resultBox');
  const resultPill   = document.getElementById('resultPill');

  // ---- referencias del alien mascota animado ----
  const alienMascot   = document.getElementById('alienMascot');
  const alienSparkles = document.getElementById('alienSparkles');

  // Genera las chispas doradas de celebración alrededor del alien.
  // Se regeneran en cada victoria para que el DOM no acumule nodos viejos
  // y para poder reiniciar limpiamente la animación CSS de cada spark.
  // Se lanzan en dos "oleadas" (delay 0 y delay ~0.55s) para que las chispas
  // acompañen tanto el salto inicial como los rebotes posteriores, en vez
  // de aparecer todas de golpe y apagarse mucho antes de que termine el gesto.
  function spawnAlienSparkles(){
    alienSparkles.innerHTML = '';
    const count = 12;
    for (let i = 0; i < count; i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = (i / count) * 360 + (Math.random() * 18 - 9);
      const dist  = 30 + Math.random() * 20; // % relativo al contenedor .alien-sparkles
      const rad = angle * Math.PI / 180;
      const x = 50 + Math.cos(rad) * dist;
      const y = 50 + Math.sin(rad) * dist * 0.8; // achatado verticalmente, más "aro" que círculo
      s.style.left = x + '%';
      s.style.top  = y + '%';
      const wave = i % 2 === 0 ? 0 : 0.55; // dos oleadas intercaladas
      s.style.animationDelay = (wave + Math.random() * 0.12) + 's';
      alienSparkles.appendChild(s);
    }
  }

  // Pone al alien en modo "intriga": se llama justo al iniciar cada giro.
  function alienStartWaiting(){
    alienMascot.classList.remove('is-celebrating');
    // forzar reflow para poder re-lanzar 'is-waiting' aunque ya estuviera puesta
    // (por si el usuario encadena giros muy rápido en el futuro)
    void alienMascot.offsetWidth;
    alienMascot.classList.add('is-waiting');
  }

  // Cambia al alien a modo "celebración": se llama al anunciar el premio.
  function alienStartCelebrating(){
    alienMascot.classList.remove('is-waiting');
    void alienMascot.offsetWidth;
    spawnAlienSparkles();
    alienMascot.classList.add('is-celebrating');
    // Al terminar la animación de festejo, vuelve a idle (sin clase) y limpia
    // las chispas para dejar el DOM ligero hasta la próxima victoria.
    setTimeout(() => {
      alienMascot.classList.remove('is-celebrating');
      alienSparkles.innerHTML = '';
    }, 1950);
  }

  let currentRotation = 0;
  let spinning = false;

  function pickWeightedPrize(){
    const pool = [];
    prizes.forEach(p => {
      const w = weights[p.label] ?? 1;
      for (let i = 0; i < w; i++) pool.push(p);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ============================================================================
  // BLINDAJE ANTI-DESAJUSTE: dado el ángulo final REAL que quedó aplicado al
  // rotor (currentRotation), calcula matemáticamente cuál de los "prizes"
  // definidos arriba es el que físicamente está bajo el puntero (0°, arriba)
  // en ESTE momento. No confía en "qué premio se pretendía" — vuelve a leer
  // la geometría desde cero. Se usa como verificación obligatoria antes de
  // anunciar cualquier resultado: solo puede mostrarse un premio que de
  // verdad exista en "prizes" y que de verdad esté bajo el puntero.
  // ============================================================================
  function getPrizeUnderPointer(finalRotationDeg){
    // Normaliza la rotación aplicada al rango [0, 360)
    const rot = ((finalRotationDeg % 360) + 360) % 360;
    // Si el disco rotó "rot" grados en sentido horario, el punto del disco
    // que ahora coincide con el puntero (posición fija 0°) es el que
    // ORIGINALMENTE estaba en el ángulo (360 - rot) mod 360.
    const originalAngleAtPointer = ((360 - rot) % 360 + 360) % 360;
    // Busca en qué sector [startAngle, endAngle) cae ese ángulo original.
    // Los sectores son exactamente los mismos "prizes" ya definidos arriba:
    // solo puede devolver uno de los premios que realmente existen en la rueda.
    let found = prizes.find(p => originalAngleAtPointer >= p.startAngle && originalAngleAtPointer < p.endAngle);
    // Salvaguarda de precisión de punto flotante para el borde exacto 360°/0°
    if (!found) found = prizes[0];
    return found;
  }

  function spin(){
    if (spinning) return;
    spinning = true;
    spinCtaBtn.disabled = true;
    spinHubBtn.disabled = true;
    resultBox.classList.remove('show');

    // el alien empieza a mirar la ruleta con intriga/emoción justo cuando arranca el giro
    alienStartWaiting();

    const prize = pickWeightedPrize();

    // El puntero está fijo arriba (0°). Para que el sector del premio quede
    // exactamente bajo el puntero, la rueda debe terminar este giro en el
    // ángulo (mod 360) donde ese sector coincide con el puntero.
    //
    // IMPORTANTE: "currentRotation" es la rotación TOTAL acumulada desde el
    // primer giro (crece sin límite, giro tras giro). El disco YA puede estar
    // desfasado de 0° por los giros anteriores, así que el ángulo a girar
    // AHORA debe calcularse relativo a esa posición actual — no en aislamiento
    // como si el disco siempre arrancara en 0°. Por eso se resta el desfase
    // actual (currentRotation mod 360) antes de sumar las vueltas completas.
    // Se usa el mismo "centerAngle" que se usó para dibujar el sector y su
    // texto, así el resultado mostrado SIEMPRE es el sector que queda bajo
    // el puntero — no puede haber premio "de mentira", en ningún giro,
    // incluyendo el segundo, el décimo o el número mil de la sesión.
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 vueltas completas
    // offset aleatorio dentro del sector, dejando un margen de seguridad para
    // que nunca caiga demasiado cerca de una línea divisoria
    const margin = arc * 0.28;
    const randomOffset = (Math.random() * (arc - margin * 2)) - (arc / 2 - margin);

    const normDeg = (x) => ((x % 360) + 360) % 360;
    const desiredFinalMod = normDeg(-prize.centerAngle + randomOffset);
    const currentMod = normDeg(currentRotation);
    const deltaToTarget = normDeg(desiredFinalMod - currentMod);
    const targetAngle = deltaToTarget + 360 * extraSpins;

    currentRotation += targetAngle;

    rotor.style.transition = 'transform 5.2s cubic-bezier(.11,.82,.1,1)';
    rotor.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinCtaBtn.disabled = false;
      spinHubBtn.disabled = false;

      // VERIFICACIÓN OBLIGATORIA: antes de anunciar nada, se recalcula desde
      // cero, a partir del ángulo final REAL aplicado al rotor, qué sector
      // está físicamente bajo el puntero. Este es el premio que se anuncia
      // SIEMPRE — nunca el premio "elegido" al azar al inicio del giro. En
      // condiciones normales ambos son el mismo objeto (por eso no se nota
      // ninguna diferencia visual), pero esta doble comprobación asegura
      // matemáticamente que jamás se puede anunciar un premio que no sea
      // exactamente el que quedó bajo el puntero.
      const verifiedPrize = getPrizeUnderPointer(currentRotation);
      if (verifiedPrize.label !== prize.label){
        // Esto no debería ocurrir nunca; se deja registrado por si en el
        // futuro alguien modifica el código y rompe la sincronía, para que
        // el fallo sea visible en desarrollo en vez de pasar desapercibido.
        console.warn('[ruleta] Discrepancia detectada y corregida: se iba a anunciar "' + prize.label + '" pero el sector real bajo el puntero es "' + verifiedPrize.label + '". Se usa el resultado verificado.');
      }

      resultPill.textContent = `¡Ganaste ${verifiedPrize.label}!`;
      resultBox.classList.add('show');

      // el alien deja de "esperar" y celebra el premio que se acaba de anunciar
      alienStartCelebrating();

      // Evento personalizado para que la web anfitriona pueda escuchar el
      // resultado. Usa siempre el premio verificado (el que realmente está
      // bajo el puntero), nunca el "elegido" antes de girar.
      window.dispatchEvent(new CustomEvent('ruletaResultado', {
        detail: { label: verifiedPrize.label, value: verifiedPrize.value }
      }));
    }, 5300);
  }

  spinCtaBtn.addEventListener('click', spin);
  spinHubBtn.addEventListener('click', spin);

  // ---- estrellas de fondo decorativas ----
  const starsField = document.getElementById('starsField');
  const starCount = 60;
  for (let i = 0; i < starCount; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    starsField.appendChild(s);
  }

  // ---- bombillas del aro exterior ----
  const bulbsOuter = document.getElementById('bulbsOuter');
  const bulbCount = 28;
  const bulbRadius = 226;
  for (let i = 0; i < bulbCount; i++){
    const a = (i / bulbCount) * Math.PI * 2 - Math.PI/2;
    const x = 250 + bulbRadius * Math.cos(a);
    const y = 250 + bulbRadius * Math.sin(a);
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', 4.2);
    circle.setAttribute('fill', i % 2 === 0 ? '#7ff2ff' : '#e6b3ff');
    circle.classList.add('bulb');
    circle.style.animationDelay = (i * 0.09) + 's';
    bulbsOuter.appendChild(circle);
  }
})();
</script>

</body>
