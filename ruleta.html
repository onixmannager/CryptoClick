<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ruleta Galáctica</title>

<!-- Mismo favicon que index.html -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Misma tipografía "Fredoka One" que index.html: sin esto, .rl-title
     (pantalla de carga) caía al fallback 'Segoe UI' del sistema en vez de
     usar la fuente redondeada real, por eso se veía distinta a index.html. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-light:#f5d68a;
    --gold:#d9a441;
    --gold-dark:#8a5a1e;
    --cyan:#4bd8ff;
    --cyan-glow:#7ff2ff;
    --purple:#7b2fd6;
    --purple-dark:#3a1266;
    --green:#1fae7a;
    --green-dark:#0c5f42;
    --blue:#1b4fa8;
    --blue-dark:#0a2a5e;
    --bg-void:#050818;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 30%, #0e1a3a 0%, #050818 60%, #020310 100%);
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
    padding:20px;
    touch-action:manipulation;
  }

  .stage{
    position:relative;
    z-index:2;
    width:min(92vw, 440px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- estrellas de fondo ---------- */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#bfe6ff;
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }

  /* ---------- estrellas fugaces (se disparan mientras la rueda gira) ---------- */
  .shooting-star{
    position:fixed;
    top:0;
    left:0;
    width:2px;
    height:2px;
    z-index:1;
    pointer-events:none;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 1px rgba(255,255,255,.9), 0 0 14px 3px rgba(123,47,214,.5);
    opacity:0;
    will-change:transform, opacity;
  }
  .shooting-star::after{
    content:'';
    position:absolute;
    top:50%;
    right:100%;
    width:110px;
    height:1.5px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(191,230,255,.85) 100%);
  }
  @keyframes shoot{
    0%{opacity:0; transform:translate(0,0) rotate(var(--ang));}
    6%{opacity:1;}
    85%{opacity:1;}
    100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--ang));}
  }

  /* ---------- lienzo de fuegos artificiales (se dispara al ganar) ---------- */
  #fireworksCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:40;
    pointer-events:none;
  }

  /* ---------- contenedor de la rueda ---------- */
  .wheel-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.6));
  }

  /* pico con cabeza alien */
  .alien-spike{
    position:absolute;
    top:-11%;
    left:50%;
    transform:translateX(-50%);
    width:24%;
    z-index:20;
    filter:drop-shadow(0 0 10px rgba(75,216,255,.7));
  }

  /* aro exterior con luces animadas */
  .ring-lights{
    position:absolute;
    inset:0;
    animation:none;
  }
  .bulb{
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.35; filter:brightness(1);}
    50%{opacity:1; filter:brightness(1.8);}
  }

  /* la rueda que gira */
  #wheelSvg{
    display:block;
    width:100%;
    height:100%;
    transform:rotate(0deg);
  }
  #wheelRotor{
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .sector-label{
    font-family:'Arial Black', 'Segoe UI', sans-serif;
    font-weight:900;
    fill:url(#textGoldBevel);
    stroke:#4a2b06;
    stroke-width:3;
    paint-order:stroke fill;
    letter-spacing:.5px;
    filter:url(#textEmboss);
  }

  /* botón central de disparo */
  .spin-btn{
    position:absolute;
    top:50%;
    left:50%;
    width:15.5%;
    height:15.5%;
    transform:translate(-50%,-50%);
    z-index:30;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:transparent;
    padding:0;
  }
  .spin-btn:active .hub-core{
    transform:scale(.94);
  }
  .spin-btn:disabled{cursor:default;}
  .hub-core{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #c9a6ff 0%, #8b4fe0 22%, #5a1fb0 48%, #2c0d5e 78%, #180736 100%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.35),
      inset 0 -10px 20px rgba(0,0,0,.55),
      0 0 22px rgba(139,79,224,.85),
      0 0 45px rgba(75,216,255,.35);
    border:3px solid var(--gold);
    transition:transform .15s ease;
  }

  /* puntero superior */
  .pointer{
    position:absolute;
    top:-2.5%;
    left:50%;
    transform:translateX(-50%);
    width:7%;
    z-index:25;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  }

  /* ---------- Resultado ---------- */
  .result-box{
    margin-top:22px;
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .result-box.show{
    opacity:1;
    transform:translateY(0);
  }
  .result-pill{
    padding:10px 28px;
    border-radius:999px;
    background:linear-gradient(180deg,#1a2350,#0c1230);
    border:1.5px solid var(--cyan);
    box-shadow:0 0 18px rgba(75,216,255,.55), inset 0 0 10px rgba(75,216,255,.15);
    color:var(--gold-light);
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.5px;
    text-shadow:0 0 8px rgba(245,214,138,.5);
  }

  .spin-cta{
    margin-top:18px;
    padding:13px 40px;
    border-radius:999px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,#3a1266,#1a0838);
    color:var(--gold-light);
    font-weight:800;
    font-size:1rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 0 20px rgba(123,47,214,.55), inset 0 1px 0 rgba(255,255,255,.15);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .spin-cta:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 0 28px rgba(75,216,255,.6), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .spin-cta:active:not(:disabled){
    transform:translateY(0);
  }
  .spin-cta:disabled{
    opacity:.5;
    cursor:default;
  }

  .brand{
    margin-top:26px;
    color:var(--cyan-glow);
    letter-spacing:4px;
    font-size:.7rem;
    opacity:.55;
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .result-pill{font-size:.9rem; padding:9px 20px;}
    .spin-cta{font-size:.85rem; padding:11px 30px;}
  }

  /* ---------- alien animado, pegado al lado derecho del botón GIRAR ---------- */
  /* position:fixed a propósito: el <body> tiene overflow:hidden, así que un
     elemento position:absolute dentro de .stage que se salga hacia la derecha
     quedaría recortado sin más — fixed se posiciona contra el viewport y no
     lo afecta. Su left/top/width exactos los calcula JS
     (alignAlienToSpinButton) a partir de la posición real del botón GIRAR y
     del espacio disponible en cada momento — por eso aquí NO hay media query
     con un ancho fijo por breakpoint; el ancho es 100% dinámico. */
  .alien-anim-wrap{
    position:fixed;
    z-index:35;
    width:200px;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    /* top/left también animados: antes cambiaban en seco (sin transición) al
       recalcularse en alignAlienToSpinButton(), así que cuando el navegador
       mostraba/ocultaba su barra inferior el alien "saltaba" de golpe a la
       nueva posición en vez de acomodarse suavemente. */
    transition:opacity .35s ease, width .2s ease, top .2s ease, left .2s ease;
  }
  .alien-anim-wrap.show{
    opacity:1;
  }
  #alienAnimCanvas{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(75,216,255,.35));
  }

  /* ---------- topbar: volver al juego + saldo $CLK ---------- */
  /* Mismo lenguaje visual "glass panel" que index.html/invasion.html, para que
     el saldo se sienta parte de la misma app y no un añadido suelto. */
  #ruletaTopbar{
    position:relative;
    z-index:3;
    width:100%;
    max-width:min(92vw, 440px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    transform:translateY(-28px);
  }
  #ruletaBackLink{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--cyan-glow);
    text-decoration:none;
    font-weight:800;
    font-size:.8rem;
    letter-spacing:.5px;
    text-transform:uppercase;
    opacity:.85;
  }
  /* Botón de silenciar: mismo estilo que #muteBtn en index.html. */
  #ruletaTopbarLeft{
    display:flex;
    align-items:center;
    gap:8px;
  }
  #muteBtn{
    background:rgba(10,12,22,.5);
    border:1px solid rgba(255,255,255,.14);
    border-radius:50%;
    width:28px;
    height:28px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s,border-color .2s;
    flex-shrink:0;
  }
  #muteBtn:active{transform:scale(.88);}
  #muteBtn.off{opacity:.5;}
  #ruletaBalPill{
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(10,12,22,.5);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    padding:6px 12px;
  }
  #ruletaBalIcon{font-size:16px;}
  #ruletaBalNum{
    font-family:'Arial Black','Segoe UI',sans-serif;
    font-weight:900;
    font-size:15px;
    color:var(--gold-light);
    line-height:1;
    transition:transform .15s;
  }
  #ruletaBalNum.bump{transform:scale(1.12);}
  #ruletaBalLabel{
    font-size:9px;
    color:var(--cyan-glow);
    font-weight:800;
    letter-spacing:1.2px;
    opacity:.7;
  }

  /* ---------- overlay de login (si se abre ruleta.html sin sesión) ---------- */
  #ruletaLoginOv{
    position:fixed;inset:0;z-index:200;
    background:rgba(3,4,12,.92);
    display:none;
    align-items:center;justify-content:center;
    padding:24px;
    text-align:center;
  }
  #ruletaLoginOv.show{display:flex;}
  #ruletaLoginBox{
    max-width:340px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  #ruletaLoginBox p{color:#cfd8ff;font-size:.9rem;line-height:1.4;}
  #ruletaLoginGo{
    padding:12px 26px;
    border-radius:999px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,#3a1266,#1a0838);
    color:var(--gold-light);
    font-weight:800;
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:.5px;
  }

  /* ---------- pantalla de carga (mismo diseño que #loading en index.html) ---------- */
  #ruletaLoading{
    position:fixed;inset:0;background:#0B0A12;z-index:99999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .6s;
  }
  #ruletaLoading.hide{opacity:0;pointer-events:none;}
  .rl-title{
    font-family:'Fredoka One',cursive,'Segoe UI',sans-serif;
    font-size:28px;
    background:linear-gradient(135deg,#C8FF4D,#FFC369);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    animation:rlPulse 1.2s ease-in-out infinite;
  }
  @keyframes rlPulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  .rl-barwrap{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;}
  .rl-bar{height:100%;width:0%;background:linear-gradient(90deg,#C8FF4D,#FFC369);border-radius:6px;transition:width .1s linear;}
  .rl-tip{font-size:11px;color:#918EAA;font-weight:800;letter-spacing:1px;}
/* ── Comportamiento tipo app nativa: sin selección de texto ni menú contextual ── */
*{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}
img,a{-webkit-touch-callout:none}
</style>
</head>
<body>

<!-- Pantalla de carga: mismo diseño que index.html (título con gradiente,
     alien animado, barra de progreso simulada y texto rotativo), pero se
     oculta cuando ESTA página termina de cargar del todo (evento 'load' del
     navegador: HTML parseado + todas las imágenes declaradas en el DOM,
     incluida la de este mismo preloader), en vez de seguir el flujo de
     login/alias de index.html, que aquí no aplica. Los 120 frames del alien
     de la rueda (window.ALIEN_FRAMES) se cargan aparte, de forma dinámica y
     progresiva vía JS más abajo, y no forman parte de este 'load': el juego
     ya deja jugar mientras siguen llegando en segundo plano. -->
<div id="ruletaLoading">
  <div class="rl-title">CRYPTO ALIEN</div>
  <img src="https://raw.githubusercontent.com/onixmannager/CryptoClick/refs/heads/main/images/alienmeditacion.png"
       alt="alien"
       style="width:170px; height:170px; animation:rlPulse 1s infinite; object-fit:contain;">
  <div class="rl-barwrap"><div class="rl-bar" id="ruletaLoadBar"></div></div>
  <div class="rl-tip" id="ruletaLoadTip">INICIANDO BLOCKCHAIN...</div>
</div>
<script>
(function(){
  // Misma estética que runLoader() en index.html: barra que avanza a saltos
  // aleatorios y un texto que va rotando entre "tips". La diferencia es la
  // condición para OCULTARSE: aquí no hay login/alias que esperar, así que
  // se tapa la página hasta que termine de cargar del todo (window 'load':
  // todas las imágenes/recursos declarados en el HTML, incluida la del
  // propio preloader), y como mínimo hasta que la barra llegue al 100% —
  // lo que tarde más de las dos — para que no se vea un salto brusco si la
  // carga real termina antes que la animación.
  var RL_TIPS = ['SINCRONIZANDO BLOCKCHAIN...','CARGANDO NODOS P2P...','VERIFICANDO BLOQUES...','INICIANDO MINADO...','CONECTANDO A RED CLK...'];
  var bar = document.getElementById('ruletaLoadBar');
  var tip = document.getElementById('ruletaLoadTip');
  var p = 0, ti = 0, barDone = false, pageLoaded = false;

  function maybeHide(){
    if (!barDone || !pageLoaded) return;
    var el = document.getElementById('ruletaLoading');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(function(){ if (el) el.remove(); }, 700);
  }

  var iv = setInterval(function(){
    p += Math.random() * 18 + 4;
    if (p > 100) p = 100;
    if (bar) bar.style.width = p + '%';
    if (tip) tip.textContent = RL_TIPS[ti % RL_TIPS.length];
    ti++;
    if (p >= 100){
      clearInterval(iv);
      barDone = true;
      maybeHide();
    }
  }, 180);

  window.addEventListener('load', function(){
    pageLoaded = true;
    maybeHide();
  });
  // Salvaguarda: si 'load' ya se disparó antes de llegar a esta línea (caso
  // extremo, ej. recursos servidos 100% desde caché), addEventListener no lo
  // dispararía en retrospectiva y el loader se quedaría tapando la pantalla
  // para siempre.
  if (document.readyState === 'complete'){
    pageLoaded = true;
    maybeHide();
  }
})();
</script>

<div class="stars" id="starsField"></div>
<canvas id="fireworksCanvas"></canvas>

<!-- Overlay de login: la ruleta necesita sesión iniciada porque el premio se
     suma al mismo saldo $CLK de saves/{uid} que usa index.html. Si alguien
     abre ruleta.html directo sin haber iniciado sesión en el juego principal,
     no hay a qué cuenta sumarle el premio. -->
<div id="ruletaLoginOv"><div id="ruletaLoginBox">
  <div style="font-size:40px">🔒</div>
  <p>Inicia sesión en CRYPTO ALIEN para que tus premios de la ruleta se sumen a tu saldo $CLK.</p>
  <a id="ruletaLoginGo" href="index.html">Ir a iniciar sesión</a>
</div></div>

<div class="stage">

  <div id="ruletaTopbar">
    <div id="ruletaTopbarLeft">
      <a id="ruletaBackLink" href="index.html">← Volver</a>
      <button id="muteBtn" onclick="toggleMute()" aria-label="Silenciar sonido">🔊</button>
    </div>
    <div id="ruletaBalPill">
      <span id="ruletaBalIcon">🪙</span>
      <div>
        <div id="ruletaBalNum">–</div>
        <div id="ruletaBalLabel">$CLK</div>
      </div>
    </div>
  </div>

  <div class="wheel-wrap" id="wheelWrap">

    <!-- pico dorado con cabeza alien -->
    <svg class="alien-spike" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="spikeGold" x1="0.15" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="30%" stop-color="#f5d68a"/>
          <stop offset="55%" stop-color="#c99a3a"/>
          <stop offset="80%" stop-color="#a9701f"/>
          <stop offset="100%" stop-color="#6b4413"/>
        </linearGradient>
        <radialGradient id="alienFace" cx="50%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#204f64"/>
          <stop offset="55%" stop-color="#0b2430"/>
          <stop offset="100%" stop-color="#020608"/>
        </radialGradient>
        <radialGradient id="eyeGlow" cx="45%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#eafeff"/>
          <stop offset="40%" stop-color="#7ff2ff"/>
          <stop offset="75%" stop-color="#279cc4"/>
          <stop offset="100%" stop-color="#0d5a78"/>
        </radialGradient>
      </defs>

      <!-- marco dorado del pico, forma de escudo redondeado, con bisel -->
      <path d="M100 2
               C140 2 168 28 170 62
               C172 98 158 130 138 158
               L100 226
               L62 158
               C42 130 28 98 30 62
               C32 28 60 2 100 2 Z"
            fill="url(#spikeGold)" stroke="#3a2200" stroke-width="3"/>
      <path d="M100 10
               C134 10 158 32 160 62
               C162 94 149 122 132 148
               L100 210
               L68 148
               C51 122 38 94 40 62
               C42 32 66 10 100 10 Z"
            fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.55"/>

      <!-- cara oscura interior -->
      <path d="M100 22
               C130 22 149 41 151 64
               C153 90 143 113 129 136
               L100 192
               L71 136
               C57 113 47 90 49 64
               C51 41 70 22 100 22 Z"
            fill="url(#alienFace)" stroke="#7ff2ff" stroke-width="3" opacity="0.95"/>

      <!-- ojos almendrados, tamaño moderado para leerse nítidos incluso pequeños -->
      <ellipse cx="82" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="118" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="79" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>
      <ellipse cx="115" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>

      <!-- boca pequeña -->
      <path d="M92 146 Q100 152 108 146" stroke="#4bd8ff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    </svg>

    <!-- puntero -->
    <svg class="pointer" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ptrGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fdeeb0"/>
          <stop offset="60%" stop-color="#d9a441"/>
          <stop offset="100%" stop-color="#7a4d16"/>
        </linearGradient>
      </defs>
      <path d="M30 68 L2 10 Q30 -6 58 10 Z" fill="url(#ptrGold)" stroke="#5c3a0f" stroke-width="2"/>
      <circle cx="30" cy="16" r="6" fill="#7b2fd6" stroke="#f5d68a" stroke-width="2"/>
    </svg>

    <!-- ================= RUEDA SVG ================= -->
    <svg id="wheelSvg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- gradientes de sectores: radiales tipo "cuenco" — sombra hacia el centro, luz hacia el borde -->
        <radialGradient id="secGreen" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#052c1f"/>
          <stop offset="38%" stop-color="#0e7a52"/>
          <stop offset="68%" stop-color="#2fd39a"/>
          <stop offset="88%" stop-color="#7ffcd0"/>
          <stop offset="100%" stop-color="#c8fff0"/>
        </radialGradient>
        <radialGradient id="secPurple" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#230a4a"/>
          <stop offset="38%" stop-color="#6620c4"/>
          <stop offset="68%" stop-color="#a86bf0"/>
          <stop offset="88%" stop-color="#d9b6ff"/>
          <stop offset="100%" stop-color="#f3e5ff"/>

  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_112_mcwlen.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_113_zt67ti.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_114_rgywaz.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_115_ghgyzx.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_116_y9zdvd.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_117_pd7slq.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_118_dmezli.webp",
  "https://res.cloudinary.com/dgfrkwkf2/image/upload/alien_119_hqe1aw.webp"
];
</script>

<script>
(function(){
  // ============================================================================
  // ÚNICA FUENTE DE VERDAD DE LOS PREMIOS.
  // Todo lo demás (sectores de colores, textos, marcadores, cálculo del giro y
  // el resultado mostrado) se genera a partir de ESTE array, así que nunca puede
  // haber un desajuste entre lo que se ve pintado y lo que realmente se gana.
  //
  // "angle" = ángulo del CENTRO del sector, medido en sentido horario desde
  // arriba (12 en punto = 0°). No hace falta tocarlo si quieres añadir/quitar
  // premios: el ancho de sector (arc) se reparte solo entre 360°.
  // ============================================================================
  const prizes = [
    { label: "100K", value: 100000, gradient: "secGreen"  },
    { label: "5K",   value: 5000,   gradient: "secPurple" },
    { label: "10K",  value: 10000,  gradient: "secBlue"   },
    { label: "25K",  value: 25000,  gradient: "secRed"    },
    { label: "50K",  value: 50000,  gradient: "secOrange" },
    { label: "1K",   value: 1000,   gradient: "secTeal"   }
  ];

  // ---- probabilidades (opcional, editable) ----
  // "Peso" relativo de cada premio. Puedes cambiar estos números libremente:
  // la geometría de la rueda (tamaño de cada sector, posición del texto)
  // siempre se mantendrá coherente porque se recalcula a partir de "prizes",
  // que es fijo; solo cambia la PROBABILIDAD de caer en cada sector, no su
  // tamaño visual ni su etiqueta.
  //
  // Reparto actual (sobre un total de 100): 1K+5K+10K suman 82% -> premios
  // "normales", casi siempre caen; 25K+50K suman 16% -> más difíciles;
  // 100K es 2% (1 de cada 50 tiradas en promedio) -> premio especial.
  // OJO: el peso de "100K" de aquí abajo es solo el peso BASE. La probabilidad
  // real de 100K sube con cada tirada que pasa sin que salga, para que nunca
  // quede eternamente ausente pero tampoco se vuelva común (ver la "racha del
  // premio mayor" en pickWeightedPrize, más abajo).
  const weights = {
    "100K": 2,
    "5K":   28,
    "10K":  22,
    "25K":  10,
    "50K":  6,
    "1K":   32
  };

  const CX = 250, CY = 250;
  const R_SECTOR   = 196;   // radio del disco de sectores
  const R_LABEL    = 128;   // radio donde se centra el texto de cada premio
  const R_MARK_IN  = 190;   // radio interior del marcador triangular
  const R_MARK_OUT = 202;   // radio exterior del marcador triangular
  const arc = 360 / prizes.length; // ancho angular de cada sector (60° con 6 premios)

  // ============================================================================
  // SONIDOS: archivos de audio reales (no sintetizados). Deja aquí la ruta de
  // cada archivo cuando lo tengas -el resto del código ya está conectado y no
  // hay que tocar nada más. Si RULETA_SOUND_SRC o ALIEN_SOUND_SRC quedan
  // vacíos ('') el juego sigue funcionando normal, simplemente sin ese sonido
  // (no rompe nada aunque no subas los archivos todavía).
  //
  // - RULETA_SOUND_SRC: el traqueteo de la rueda girando. Se reproduce en
  //   bucle (loop) desde el instante en que arranca el giro y se corta en
  //   seco cuando el resultado aparece en pantalla -si tu archivo dura menos
  //   que el giro (5.2s) esto evita que se quede en silencio el resto del
  //   tiempo; si dura más, simplemente se corta antes de terminar. Usa un
  //   archivo que ya tenga la sensación de "frenado" si quieres que encaje
  //   con el frenado visual de la rueda, ya que no se altera su velocidad.
  // - ALIEN_SOUND_SRC: efecto del alien. Se reproduce una vez, en el mismo
  //   instante en que arranca su animación (misma duración ~5.2s que el giro).
  // ============================================================================
  // Estado de silencio: comparte la misma clave de localStorage que
  // index.html ('cck4_muted') para que el mute sea consistente entre
  // páginas -si el jugador silencia en index.html, la ruleta abre ya
  // silenciada, y viceversa.
  let _ruletaMuted = false;
  try{ _ruletaMuted = localStorage.getItem('cck4_muted') === '1'; }catch(e){}

  const RULETA_SOUND_SRC = 'sounds/girando.mp3';
  const ALIEN_SOUND_SRC  = ''; // ej: 'sounds/alien-grito.mp3'
  const GANADOR_SOUND_SRC = 'sounds/ganador.mp3';
  const FUEGOS_SOUND_SRC  = 'sounds/explosion-fuegos-artificiales.mp3';
  const YUPI_SOUND_SRC    = 'sounds/yupi.mp3';
  const MUSICA_FONDO_SOUND_SRC = 'sounds/casino.mp3'; // música de fondo en loop, mismo volumen que index.html

  // El elemento <audio> se crea YA, al cargar el script (no en el primer
  // click), precisamente para que la descarga del archivo empiece en cuanto
  // se abre la página. Así, cuando el usuario pulsa GIRAR, el archivo ya
  // está total o parcialmente descargado y play() no tiene que esperar a la
  // red -si se creara de forma perezosa dentro del primer click, ese primer
  // giro (y solo ese) notaría el retraso de la primera descarga.
  // El listener 'error' es la única forma fiable de saber si el archivo en
  // sí falló al CARGAR (404, ruta rota, códec no soportado por el
  // navegador) -eso puede pasar antes incluso de llamar a play(), así que
  // un try/catch alrededor de play() no lo detectaría.
  let _ruletaAudioEl = null;
  function getRuletaAudioEl(){
    if (!RULETA_SOUND_SRC) return null;
    if (!_ruletaAudioEl){
      _ruletaAudioEl = new Audio(RULETA_SOUND_SRC);
      _ruletaAudioEl.preload = 'auto'; // suena UNA vez por tirada, sin loop
      _ruletaAudioEl.addEventListener('error', () => {
        const err = _ruletaAudioEl.error;
        console.error('[sonido ruleta] No se pudo cargar "' + RULETA_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)', '-> revisa que la ruta sea correcta relativa a este HTML y que el navegador soporte el formato del archivo.');
      });
    }
    return _ruletaAudioEl;
  }
  let _alienAudioEl = null;
  function getAlienAudioEl(){
    if (!ALIEN_SOUND_SRC) return null;
    if (!_alienAudioEl){
      _alienAudioEl = new Audio(ALIEN_SOUND_SRC);
      _alienAudioEl.preload = 'auto';
      _alienAudioEl.addEventListener('error', () => {
        const err = _alienAudioEl.error;
        console.error('[sonido alien] No se pudo cargar "' + ALIEN_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)');
      });
    }
    return _alienAudioEl;
  }
  let _ganadorAudioEl = null;
  function getGanadorAudioEl(){
    if (!GANADOR_SOUND_SRC) return null;
    if (!_ganadorAudioEl){
      _ganadorAudioEl = new Audio(GANADOR_SOUND_SRC);
      _ganadorAudioEl.preload = 'auto';
      _ganadorAudioEl.addEventListener('error', () => {
        const err = _ganadorAudioEl.error;
        console.error('[sonido ganador] No se pudo cargar "' + GANADOR_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)');
      });
    }
    return _ganadorAudioEl;
  }
  let _fuegosAudioEl = null;
  function getFuegosAudioEl(){
    if (!FUEGOS_SOUND_SRC) return null;
    if (!_fuegosAudioEl){
      _fuegosAudioEl = new Audio(FUEGOS_SOUND_SRC);
      _fuegosAudioEl.preload = 'auto';
      _fuegosAudioEl.addEventListener('error', () => {
        const err = _fuegosAudioEl.error;
        console.error('[sonido fuegos artificiales] No se pudo cargar "' + FUEGOS_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)');
      });
    }
    return _fuegosAudioEl;
  }
  let _yupiAudioEl = null;
  function getYupiAudioEl(){
    if (!YUPI_SOUND_SRC) return null;
    if (!_yupiAudioEl){
      _yupiAudioEl = new Audio(YUPI_SOUND_SRC);
      _yupiAudioEl.preload = 'auto';
      _yupiAudioEl.addEventListener('error', () => {
        const err = _yupiAudioEl.error;
        console.error('[sonido yupi] No se pudo cargar "' + YUPI_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)');
      });
    }
    return _yupiAudioEl;
  }
  // Música de fondo: volumen bajado a 0.15 (antes 0.4, sonaba demasiado
  // alta), mismo nivel que la música de fondo de index.html (BGM.VOL),
  // en loop continuo desde que carga la página.
  const MUSICA_FONDO_VOL = 0.15;
  let _musicaFondoAudioEl = null;
  function getMusicaFondoAudioEl(){
    if (!MUSICA_FONDO_SOUND_SRC) return null;
    if (!_musicaFondoAudioEl){
      _musicaFondoAudioEl = new Audio(MUSICA_FONDO_SOUND_SRC);
      _musicaFondoAudioEl.preload = 'auto';
      _musicaFondoAudioEl.loop = true;
      _musicaFondoAudioEl.volume = _ruletaMuted ? 0 : MUSICA_FONDO_VOL;
      _musicaFondoAudioEl.addEventListener('error', () => {
        const err = _musicaFondoAudioEl.error;
        console.error('[música de fondo] No se pudo cargar "' + MUSICA_FONDO_SOUND_SRC + '". Código de error:', err ? err.code : '(desconocido)');
      });
    }
    return _musicaFondoAudioEl;
  }
  // Dispara la creación (y por tanto la descarga) de los elementos de audio
  // ya mismo, en vez de esperar al primer spin(). getRuletaAudioEl()/
  // getAlienAudioEl() siguen siendo la única fuente de verdad -aquí solo se
  // fuerza que corra pronto, no se duplica su lógica.
  getRuletaAudioEl();
  getAlienAudioEl();
  getGanadorAudioEl();
  getFuegosAudioEl();
  getYupiAudioEl();
  getMusicaFondoAudioEl();

  // Se llama al arrancar el giro (junto a rotor.style.transform más abajo).
  // Si .play() falla (autoplay bloqueado, archivo aún no listo, etc.) se
  // registra el motivo exacto en consola en vez de callarse -antes un
  // .catch(()=>{}) silencioso tragaba el error sin dejar ninguna pista.
  function playSpinSound(){
    if (_ruletaMuted) return;
    const el = getRuletaAudioEl();
    if (!el) return;
    el.currentTime = 0;
    el.volume = 0.4;
    el.play().catch(err => console.error('[sonido ruleta] play() rechazado:', err.name, '-', err.message));
  }
  function stopSpinSound(){
    if (_ruletaAudioEl){
      _ruletaAudioEl.pause();
      _ruletaAudioEl.currentTime = 0;
    }
  }
  // Se llama junto a playAlienAnimation(), más abajo.
  function playAlienSound(){
    if (_ruletaMuted) return;
    const el = getAlienAudioEl();
    if (!el) return;
    el.currentTime = 0;
    el.play().catch(err => console.error('[sonido alien] play() rechazado:', err.name, '-', err.message));
  }
  // Se llama cuando termina el giro, junto a stopSpinSound().
  function playGanadorSound(){
    if (_ruletaMuted) return;
    const el = getGanadorAudioEl();
    if (!el) return;
    el.currentTime = 0;
    el.volume = 0.4;
    el.play().catch(err => console.error('[sonido ganador] play() rechazado:', err.name, '-', err.message));
  }
  // Se llama junto al estallido principal de runFireworksShow().
  function playFuegosSound(){
    if (_ruletaMuted) return;
    const el = getFuegosAudioEl();
    if (!el) return;
    el.currentTime = 0;
    el.play().catch(err => console.error('[sonido fuegos artificiales] play() rechazado:', err.name, '-', err.message));
  }
  // Se llama 3.5s después del click en GIRAR (ver setTimeout en spin()).
  function playYupiSound(){
    if (_ruletaMuted) return;
    const el = getYupiAudioEl();
    if (!el) return;
    el.currentTime = 0;
    el.play().catch(err => console.error('[sonido yupi] play() rechazado:', err.name, '-', err.message));
  }
  // Arranca la música de fondo en loop, volumen bajado (ver MUSICA_FONDO_VOL).
  // Igual que en index.html, se intenta reproducir apenas carga la página; si
  // el navegador bloquea el autoplay con sonido (política común en móvil
  // hasta que hay una interacción del usuario), se reintenta una sola vez en
  // el primer click/touch/tecla, sin volver a intentarlo después.
  function playMusicaFondo(){
    if (_ruletaMuted) return;
    const el = getMusicaFondoAudioEl();
    if (!el) return;
    el.play().catch(() => {
      const reintentar = () => {
        if (_ruletaMuted) return;
        el.play().catch(err => console.error('[música de fondo] play() rechazado:', err.name, '-', err.message));
        ['click','touchstart','keydown'].forEach(ev => document.removeEventListener(ev, reintentar));
      };
      ['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, reintentar, { once:true }));
    });
  }
  playMusicaFondo();

  // Botón de silenciar (mismo altavoz 🔊/🔇 que index.html): silencia/reanuda
  // la música de fondo en curso y evita que los efectos (giro, alien, ganador,
  // fuegos, yupi) suenen mientras esté activado. Comparte la clave
  // 'cck4_muted' de localStorage con index.html para que el estado de mute
  // sea el mismo en toda la app.
  window.toggleMute = function(){
    _ruletaMuted = !_ruletaMuted;
    try{ localStorage.setItem('cck4_muted', _ruletaMuted ? '1' : '0'); }catch(e){}
    const musica = getMusicaFondoAudioEl();
    if (musica){
      if (_ruletaMuted){
        musica.pause();
      } else {
        musica.volume = MUSICA_FONDO_VOL;
        musica.play().catch(()=>{});
      }
    }
    const btn = document.getElementById('muteBtn');
    if (btn){
      btn.textContent = _ruletaMuted ? '🔇' : '🔊';
      btn.classList.toggle('off', _ruletaMuted);
    }
  };
  // Sincroniza el ícono del botón con el estado inicial leído de localStorage.
  (function syncMuteBtn(){
    const btn = document.getElementById('muteBtn');
    if (btn){
      btn.textContent = _ruletaMuted ? '🔇' : '🔊';
      btn.classList.toggle('off', _ruletaMuted);
    }
  })();


  // Convierte un ángulo "horario desde arriba" a coordenadas cartesianas del SVG.
  // ángulo 0° = arriba (12 en punto), 90° = derecha, 180° = abajo, 270° = izquierda.
  function polarToXY(angleDeg, radius){
    const rad = (angleDeg - 90) * Math.PI / 180;
    return {
      x: CX + radius * Math.cos(rad),
      y: CY + radius * Math.sin(rad)
    };
  }

  // Precalcula, para cada premio, su ángulo de inicio/centro/fin de sector.
  // Esto es lo que garantiza la coherencia total: el mismo "centerAngle" se usa
  // para dibujar el sector, para rotar+colocar su texto, y para calcular a qué
  // ángulo debe parar la rueda cuando ese premio es el elegido.
  prizes.forEach((p, i) => {
    p.startAngle  = i * arc;
    p.centerAngle = i * arc + arc / 2;
    p.endAngle    = (i + 1) * arc;
  });

  const sectorsGroup  = document.getElementById('sectorsGroup');
  const dividersGroup = document.getElementById('dividersGroup');
  const labelsGroup   = document.getElementById('labelsGroup');
  const markersGroup  = document.getElementById('markersGroup');

  // ---- 1) Dibuja los 6 sectores (arcos) ----
  prizes.forEach(p => {
    const start = polarToXY(p.startAngle, R_SECTOR);
    const end   = polarToXY(p.endAngle,   R_SECTOR);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    // arco de más de 180°? con 6 sectores de 60° nunca ocurre, pero se calcula
    // por si se cambia el número de premios en el futuro.
    const largeArc = (p.endAngle - p.startAngle) > 180 ? 1 : 0;
    path.setAttribute('d',
      `M${CX},${CY} L${start.x.toFixed(2)},${start.y.toFixed(2)} A${R_SECTOR},${R_SECTOR} 0 ${largeArc},1 ${end.x.toFixed(2)},${end.y.toFixed(2)} Z`
    );
    path.setAttribute('fill', `url(#${p.gradient})`);
    sectorsGroup.appendChild(path);
  });

  // ---- 2) Líneas divisoras en cada límite entre sectores (doble trazo) ----
  const dividerAngles = prizes.map(p => p.startAngle); // un límite antes de cada sector
  const thickLines = [];
  const glowLines  = [];
  dividerAngles.forEach(a => {
    const pt = polarToXY(a, R_SECTOR);
    thickLines.push(`<line x1="${CX}" y1="${CY}" x2="${pt.x.toFixed(2)}" y2="${pt.y.toFixed(2)}"/>`);
    glowLines.push(`<line x1="${CX}" y1="${CY}" x2="${pt.x.toFixed(2)}" y2="${pt.y.toFixed(2)}"/>`);
  });
  dividersGroup.innerHTML = `
    <g stroke="#7a4d16" stroke-width="5" opacity="0.55">${thickLines.join('')}</g>
    <g stroke="#7ff2ff" stroke-width="2.5" opacity="0.95" filter="url(#neonGlow)">${glowLines.join('')}</g>
  `;

  // ---- 3) Etiquetas de texto: SIEMPRE centradas en el centroide real del
  // sector y orientadas como un rayo recto (radial) desde el centro hacia
  // afuera, nunca "de cabeza" en la mitad inferior de la rueda. ----
  prizes.forEach(p => {
    const pos = polarToXY(p.centerAngle, R_LABEL);
    // Ángulo de rotación del texto = mismo ángulo del sector, para que quede
    // perfectamente alineado como una línea recta (radial) desde el centro.
    // Se normaliza matemáticamente al rango (-90°, 90°] usando módulo puro
    // (sin condiciones con bordes ambiguos), así el texto nunca aparece
    // invertido/patas arriba, ni siquiera en los ángulos exactos 90°/270°.
    let textAngle = ((p.centerAngle + 180) % 360 + 360) % 360 - 180;
    if (textAngle > 90) textAngle -= 180;
    if (textAngle < -90) textAngle += 180;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('class', 'sector-label');
    text.setAttribute('x', pos.x.toFixed(2));
    text.setAttribute('y', pos.y.toFixed(2));
    text.setAttribute('font-size', '42');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('transform', `rotate(${textAngle.toFixed(2)} ${pos.x.toFixed(2)} ${pos.y.toFixed(2)})`);
    text.textContent = p.label;
    labelsGroup.appendChild(text);
  });

  // ---- 4) Marcadores triangulares dorados en cada límite entre sectores ----
  dividerAngles.forEach(a => {
    const tipIn  = polarToXY(a, R_MARK_IN);
    const tipOut = polarToXY(a, R_MARK_OUT);
    // perpendicular al radio, para dar ancho al triángulo
    const perpRad = (a) * Math.PI / 180;
    const nx = Math.cos(perpRad), ny = Math.sin(perpRad);
    const widthPx = 9;
    const p1x = tipOut.x + (-ny) * widthPx, p1y = tipOut.y + (nx) * widthPx;
    const p2x = tipOut.x + (ny)  * widthPx, p2y = tipOut.y + (-nx) * widthPx;
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    poly.setAttribute('d', `M${tipIn.x.toFixed(2)},${tipIn.y.toFixed(2)} L${p1x.toFixed(2)},${p1y.toFixed(2)} L${p2x.toFixed(2)},${p2y.toFixed(2)} Z`);
    markersGroup.appendChild(poly);
  });

  // ============================================================================
  // Lógica de giro
  // ============================================================================
  const rotor       = document.getElementById('wheelRotor');
  const spinCtaBtn   = document.getElementById('spinCtaBtn');
  const spinHubBtn   = document.getElementById('spinHubBtn');
  const resultBox    = document.getElementById('resultBox');
  const resultPill   = document.getElementById('resultPill');

  let currentRotation = 0;
  let spinning = false;

  // ============================================================================
  // Animación del alien (secuencia de 120 PNG con fondo transparente), a la
  // derecha de la pantalla junto al botón GIRAR. Se reproduce una vez, entera,
  // cada vez que se pulsa GIRAR — durante los mismos ~5.2s que tarda la rueda.
  // Se dibuja en <canvas> (no <video>) porque así se preserva el canal alpha
  // de los PNG sin depender de codecs de vídeo con transparencia.
  // ============================================================================
  const alienAnimWrap   = document.getElementById('alienAnimWrap');
  const alienAnimCanvas = document.getElementById('alienAnimCanvas');
  const alienAnimCtx    = alienAnimCanvas.getContext('2d');

  const ALIEN_FRAME_COUNT = window.ALIEN_FRAMES.length; // 120
  const ALIEN_ANIM_DURATION_MS = 5200; // igual que la duración del giro de la rueda
  let alienImages = [];
  let alienImagesReady = false;

  // ----------------------------------------------------------------------------
  // Coloca el widget pegado al lado derecho del botón GIRAR (#spinCtaBtn),
  // leyendo su posición REAL en pantalla con getBoundingClientRect(). Así
  // queda "al lado del botón" de verdad, sin importar el tamaño de ventana.
  //
  // En vez de un breakpoint fijo (ej. "si la ventana mide menos de 860px, vete
  // arriba"), se calcula el espacio real que queda a la derecha del botón en
  // cada momento. Si no alcanza para el ancho normal del widget, este se
  // encoge hasta un mínimo utilizable; solo si NI ASÍ cabe (pantallas muy
  // angostas, tipo móvil en vertical) se coloca DEBAJO del botón — nunca
  // arriba del todo, para que siga leyéndose como "al lado de GIRAR".
  // ----------------------------------------------------------------------------
  const ALIEN_MAX_WIDTH = 200; // ancho "normal" (coincide con el CSS)
  const ALIEN_MIN_WIDTH = 70;  // por debajo de esto ya no vale la pena encogerlo más
  const ALIEN_GAP = 20;        // separación entre el botón y el alien

  function alignAlienToSpinButton(){
    const btnRect = spinCtaBtnRef().getBoundingClientRect();
    // Usar el visualViewport (tamaño real visible + su offset) en vez de
    // window.innerWidth/innerHeight: en móvil, al aparecer/ocultarse la barra
    // de direcciones o la barra de navegación del sistema, el layout viewport
    // (de donde salen innerWidth/innerHeight y getBoundingClientRect) puede
    // desalinearse del área visual realmente visible, que es contra la que
    // se posiciona un elemento position:fixed. Sin este ajuste, el alien
    // quedaba calculado con coordenadas viejas y se salía de la pantalla o
    // no volvía a su sitio al sacar esos botones.
    const vv = window.visualViewport;
    const vvWidth  = vv ? vv.width  : window.innerWidth;
    const vvHeight = vv ? vv.height : window.innerHeight;
    const vvOffsetLeft = vv ? vv.offsetLeft : 0;
    const vvOffsetTop  = vv ? vv.offsetTop  : 0;

    const spaceRight = (vvOffsetLeft + vvWidth) - btnRect.right - ALIEN_GAP - 8; // 8px margen de seguridad

    if (spaceRight >= ALIEN_MIN_WIDTH){
      // cabe al lado (a tamaño normal o encogido para que quepa)
      const targetWidth = Math.min(ALIEN_MAX_WIDTH, spaceRight);
      alienAnimWrap.style.width = targetWidth + 'px';
      alienAnimWrap.style.left = (btnRect.right + ALIEN_GAP) + 'px';
      alienAnimWrap.style.right = 'auto';
      alienAnimWrap.style.bottom = 'auto';
      // centrado verticalmente respecto al botón, acotado para que no se
      // salga del viewport (ej. escritorio, donde el botón GIRAR puede
      // quedar bajo en la página y el personaje asomaba cortado por abajo)
      const wrapHeight = alienAnimWrap.offsetHeight;
      let targetTop = btnRect.top + btnRect.height / 2 - wrapHeight / 2;
      targetTop = Math.max(vvOffsetTop + 8, Math.min(targetTop, vvOffsetTop + vvHeight - wrapHeight - 8));
      alienAnimWrap.style.top = targetTop + 'px';
    } else {
      // no hay espacio horizontal ni encogido al mínimo: se coloca debajo del
      // botón, centrado con él, para seguir estando "junto a GIRAR" en vez de
      // saltar a una esquina lejana de la pantalla.
      // targetWidth se acota también por la altura visible disponible debajo
      // del botón (vvHeight - espacio ya ocupado): antes, cuando el navegador
      // mostraba su barra inferior (vvHeight se reduce), el alien se seguía
      // calculando con el ancho/alto "de siempre" y el clamp de targetTop lo
      // empujaba hacia ARRIBA hasta quedar tapado por el propio botón GIRAR
      // -de ahí que pareciera "escondido/recortado". Ahora, si no entra
      // completo por abajo, se encoge (nunca se empuja por encima del botón).
      const availableBelow = (vvOffsetTop + vvHeight) - btnRect.bottom - ALIEN_GAP - 8;
      const maxWidthByHeight = availableBelow > 0 ? availableBelow * 1.6 : ALIEN_MIN_WIDTH; // el wrap es más alto que ancho (canvas 340x604), 1.6 ~= alto/ancho
      const targetWidth = Math.max(ALIEN_MIN_WIDTH, Math.min(ALIEN_MAX_WIDTH, vvWidth * 0.5, maxWidthByHeight));
      alienAnimWrap.style.width = targetWidth + 'px';
      alienAnimWrap.style.left = (btnRect.left + btnRect.width / 2 - targetWidth / 2) + 'px';
      alienAnimWrap.style.right = 'auto';
      const wrapHeight = alienAnimWrap.offsetHeight;
      // el tope SIEMPRE es debajo del botón (nunca se clampea por encima de
      // btnRect.bottom): si no cabe entero en el alto visible, ya se encogió
      // arriba vía maxWidthByHeight, así que aquí solo se recorta el margen
      // inferior sobrante, sin tapar el botón.
      let targetTop = btnRect.bottom + ALIEN_GAP;
      const maxTop = (vvOffsetTop + vvHeight) - wrapHeight - 8;
      if (maxTop >= targetTop){
        targetTop = Math.min(targetTop, maxTop);
      }
      alienAnimWrap.style.top = targetTop + 'px';
      alienAnimWrap.style.bottom = 'auto';
    }
  }
  // referencia perezosa porque spinCtaBtn se define más abajo en este mismo script
  function spinCtaBtnRef(){ return document.getElementById('spinCtaBtn'); }

  window.addEventListener('resize', alignAlienToSpinButton);
  window.addEventListener('orientationchange', alignAlienToSpinButton);
  // En móvil, mostrar/ocultar la barra de direcciones o la barra de
  // herramientas del navegador cambia el viewport real sin que 'resize' de
  // window se dispare siempre de forma fiable -eso dejaba al alien calculado
  // con coordenadas viejas y "perdido" fuera de la pantalla visible. La API
  // visualViewport sí refleja ese cambio, así que se usa como respaldo.
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', alignAlienToSpinButton);
    window.visualViewport.addEventListener('scroll', alignAlienToSpinButton);
  }
  alignAlienToSpinButton();

  (function preloadAlienFrames(){
    let loaded = 0;
    alienImages = window.ALIEN_FRAMES.map((src) => {
      const img = new Image();
      img.onload = () => {
        loaded++;
        if (loaded === ALIEN_FRAME_COUNT) alienImagesReady = true;
      };
      img.src = src;
      return img;
    });
    // pinta el primer frame en cuanto esté listo y hace visible el widget de
    // una vez — así el alien queda estático desde el momento en que carga la
    // página, sin esperar a que el usuario pulse GIRAR por primera vez
    alienImages[0].onload = () => {
      loaded++;
      if (loaded === ALIEN_FRAME_COUNT) alienImagesReady = true;
      alienAnimCtx.drawImage(alienImages[0], 0, 0, alienAnimCanvas.width, alienAnimCanvas.height);
      alignAlienToSpinButton(); // el canvas ya tiene su tamaño final renderizado
      alienAnimWrap.classList.add('show');
    };
  })();

  let alienAnimRunning = false;
  function playAlienAnimation(){
    // si las imágenes aún no han terminado de cargar (conexión lenta), se
    // reproduce igual con las que ya estén listas en ese instante — nunca se
    // bloquea el giro de la rueda por esto.
    alienAnimWrap.classList.add('show');
    alienAnimRunning = true;
    const startTime = performance.now();

    function step(now){
      if (!alienAnimRunning) return;
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / ALIEN_ANIM_DURATION_MS, 1);
      const frameIndex = Math.min(
        ALIEN_FRAME_COUNT - 1,
        Math.floor(progress * ALIEN_FRAME_COUNT)
      );
      const img = alienImages[frameIndex];
      if (img && img.complete && img.naturalWidth > 0){
        alienAnimCtx.clearRect(0, 0, alienAnimCanvas.width, alienAnimCanvas.height);
        alienAnimCtx.drawImage(img, 0, 0, alienAnimCanvas.width, alienAnimCanvas.height);
      }
      if (progress < 1){
        requestAnimationFrame(step);
      } else {
        alienAnimRunning = false;
        // se queda mostrando el último frame; el widget permanece visible
        // (no se oculta) para que el alien "acompañe" también el resultado
      }
    }
    requestAnimationFrame(step);
  }

  // ---- racha ("pity") del premio mayor (100K) ----
  // Objetivo pedido: 1K/5K/10K salen casi siempre, 25K/50K son más difíciles,
  // y 100K es "especial", casi nunca sale... pero tampoco debe quedar
  // eternamente ausente. Por eso su peso no es fijo: se usa el peso BASE
  // (2, definido arriba en "weights") mientras la racha sin 100K sea corta,
  // y a partir de PITY_GRACE_SPINS tiradas sin que salga, ese peso empieza a
  // subir poco a poco (sin techo) hasta que vuelve a tocar — momento en el
  // que la racha se reinicia a 0. Además, 100K nunca puede salir dos veces
  // seguidas (se excluye del sorteo justo en la tirada siguiente a haberlo
  // ganado). Esta racha vive solo en memoria: no se guarda en ningún sitio,
  // así que se reinicia si se recarga la página (a propósito, por ahora).
  let spinsSinceLast100K = 0;
  let lastPrizeLabel = null;
  const PITY_GRACE_SPINS = 15; // tiradas de gracia antes de que el peso empiece a subir
  const PITY_STEP_SPINS  = 8;  // cada cuántas tiradas (tras la gracia) sube un escalón
  const PITY_STEP_AMOUNT = 3;  // cuánto sube el peso en cada escalón

  function get100KWeight(){
    const base = weights["100K"];
    if (spinsSinceLast100K <= PITY_GRACE_SPINS) return base;
    const stepsPast = Math.floor((spinsSinceLast100K - PITY_GRACE_SPINS) / PITY_STEP_SPINS);
    return base + stepsPast * PITY_STEP_AMOUNT;
  }

  function pickWeightedPrize(){
    const pool = [];
    prizes.forEach(p => {
      // nunca dos 100K seguidos: se excluye del sorteo en esta tirada
      if (p.label === "100K" && lastPrizeLabel === "100K") return;
      const w = (p.label === "100K") ? get100KWeight() : (weights[p.label] ?? 1);
      for (let i = 0; i < w; i++) pool.push(p);
    });
    const chosen = pool[Math.floor(Math.random() * pool.length)];

    spinsSinceLast100K = (chosen.label === "100K") ? 0 : spinsSinceLast100K + 1;
    lastPrizeLabel = chosen.label;

    return chosen;
  }

  function spin(){
    if (spinning) return;
    // La ruleta suma el premio al saldo $CLK del juego principal, así que
    // necesita sesión iniciada. Sin usuario no hay a qué cuenta sumarle nada.
    if (!window.__fbUser){
      document.getElementById('ruletaLoginOv').classList.add('show');
      return;
    }
    // Límite de 1 tirada cada 12h (ver window.ruletaCooldown, definido en el
    // <script type="module"> de Firebase más abajo — otro ámbito JS, por eso
    // se consulta vía window en vez de una variable compartida). El botón ya
    // debería estar disabled en este caso, así que esto es solo una segunda
    // línea de defensa; se refresca la UI por si había quedado desincronizada.
    if (window.ruletaCooldown && window.ruletaCooldown.msRemaining() > 0){
      window.ruletaCooldown.refreshUI();
      return;
    }
    spinning = true;
    spinCtaBtn.disabled = true;
    spinHubBtn.disabled = true;
    resultBox.classList.remove('show');

    const prize = pickWeightedPrize();

    // El puntero está fijo arriba (0°). Para que el sector del premio quede
    // exactamente bajo el puntero, la rueda debe rotar de forma que
    // (anguloCentroSector + rotacionFinal) % 360 === 0.
    // Se usa el mismo "centerAngle" que se usó para dibujar el sector y su
    // texto, así el resultado mostrado SIEMPRE es el sector que queda bajo
    // el puntero — no puede haber premio "de mentira".
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 vueltas completas
    // offset aleatorio dentro del sector, dejando un margen de seguridad para
    // que nunca caiga demasiado cerca de una línea divisoria
    const margin = arc * 0.28;
    const randomOffset = (Math.random() * (arc - margin * 2)) - (arc / 2 - margin);
    // La fórmula de abajo asume que la rueda arranca desde una posición
    // normalizada (0-360°). currentRotation es acumulativo entre tiradas, así
    // que se normaliza aquí con modulo 360 antes de sumar el nuevo giro; si no,
    // a partir de la 2ª tirada el giro seguiría sumándose sobre el ángulo bruto
    // acumulado (miles de grados) y el sector que queda bajo el puntero se iría
    // desalineando del premio real cada vez más.
    const normalizedRotation = ((currentRotation % 360) + 360) % 360;
    const targetAngle = 360 * extraSpins - prize.centerAngle + randomOffset - normalizedRotation;

    currentRotation += targetAngle;

    rotor.style.transition = 'transform 5.2s cubic-bezier(.11,.82,.1,1)';
    rotor.style.transform = `rotate(${currentRotation}deg)`;
    playSpinSound();
    setTimeout(playYupiSound, 3500);

    // Mientras la rueda gira (los 5.2s de suspense), el fondo cobra vida con
    // estrellas fugaces cruzando la pantalla — refuerza la sensación de estar
    // "en juego" en vez de mirar una espera vacía.
    startShootingStars();

    // El alien de la derecha reproduce su animación completa en sincronía con
    // el giro de la rueda (misma duración, ~5.2s).
    playAlienAnimation();
    playAlienSound();

    setTimeout(() => {
      resultPill.textContent = `¡Ganaste ${prize.label}!`;
      resultBox.classList.add('show');

      // El suspense termina: apagamos las estrellas fugaces y el sonido de
      // la ruleta girando, y celebramos el premio con una tanda de fuegos
      // artificiales, el "momento de recompensa" que hace que apetezca
      // volver a girar.
      stopShootingStars();
      stopSpinSound();
      playGanadorSound();
      runFireworksShow();

      // Evento personalizado para que la web anfitriona pueda escuchar el resultado
      window.dispatchEvent(new CustomEvent('ruletaResultado', {
        detail: { label: prize.label, value: prize.value }
      }));

      // Suma el premio al saldo $CLK real (Firestore + localStorage), el
      // mismo que usa index.html. Sin esto la rueda giraba "bonito" pero el
      // premio se perdía: solo vivía un instante en el texto de resultPill.
      //
      // El botón GIRAR se mantiene bloqueado (spinning=true) hasta que este
      // premio termine de guardarse: si se reactivara ya mismo, el jugador
      // podía lanzar otra tirada mientras el paso "nube" de esta seguía en
      // curso, y esa respuesta tardía podía llegar y pisar en pantalla el
      // total ya actualizado de la tirada siguiente — el marcador se veía
      // mal un instante y "se corregía" recién en el giro de después.
      const finishSpin = () => {
        spinning = false;
        spinCtaBtn.disabled = false;
        spinHubBtn.disabled = false;
      };
      if (window.awardRuletaPrize){
        Promise.resolve(window.awardRuletaPrize(prize.value)).then(finishSpin, finishSpin);
      } else {
        finishSpin();
      }
    }, 5300);
  }

  // ============================================================================
  // Estrellas fugaces: se disparan varias veces mientras la rueda está girando,
  // para que el fondo se sienta "vivo" durante los 5.2s de tensión antes del
  // premio. Cada una es un <div> efímero que se autodestruye al terminar su
  // animación CSS (evita ir acumulando nodos en el DOM sesión tras sesión).
  // ============================================================================
  function launchShootingStar(){
    const star = document.createElement('div');
    star.className = 'shooting-star';

    // Punto de partida en un borde aleatorio (arriba o a la izquierda), ángulo
    // de vuelo hacia abajo-derecha, como una estrella fugaz real cruzando el cielo.
    const startFromTop = Math.random() < 0.5;
    const startX = startFromTop ? Math.random() * window.innerWidth * 0.7 : -40;
    const startY = startFromTop ? -20 : Math.random() * window.innerHeight * 0.5;
    const angleDeg = 25 + Math.random() * 20; // trayectoria diagonal, 25°-45°
    const distance = Math.max(window.innerWidth, window.innerHeight) * 0.9;
    const rad = angleDeg * Math.PI / 180;
    const dx = Math.cos(rad) * distance;
    const dy = Math.sin(rad) * distance;
    const duration = 0.9 + Math.random() * 0.6;

    star.style.left = startX + 'px';
    star.style.top = startY + 'px';
    star.style.setProperty('--ang', angleDeg + 'deg');
    star.style.setProperty('--dx', dx + 'px');
    star.style.setProperty('--dy', dy + 'px');
    star.style.animation = `shoot ${duration}s linear forwards`;

    document.body.appendChild(star);
    setTimeout(() => star.remove(), duration * 1000 + 100);
  }

  let shootingStarInterval = null;
  function startShootingStars(){
    stopShootingStars();
    launchShootingStar(); // una inmediata, no esperar al primer intervalo
    shootingStarInterval = setInterval(launchShootingStar, 650);
  }
  function stopShootingStars(){
    if (shootingStarInterval){
      clearInterval(shootingStarInterval);
      shootingStarInterval = null;
    }
  }

  // ============================================================================
  // Fuegos artificiales: lienzo canvas a pantalla completa, dibuja varias
  // explosiones de partículas (física simple: velocidad + gravedad + fricción +
  // desvanecimiento) cuando se revela el premio. Pensado para reforzar el
  // "momento de recompensa" y dar ganas de volver a girar.
  // ============================================================================
  const fwCanvas = document.getElementById('fireworksCanvas');
  const fwCtx = fwCanvas.getContext('2d');
  let fwParticles = [];
  let fwAnimId = null;
  let fwDPR = Math.max(1, window.devicePixelRatio || 1);

  function resizeFireworksCanvas(){
    fwDPR = Math.max(1, window.devicePixelRatio || 1);
    fwCanvas.width = window.innerWidth * fwDPR;
    fwCanvas.height = window.innerHeight * fwDPR;
    fwCanvas.style.width = window.innerWidth + 'px';
    fwCanvas.style.height = window.innerHeight + 'px';
    fwCtx.setTransform(fwDPR, 0, 0, fwDPR, 0, 0);
  }
  window.addEventListener('resize', resizeFireworksCanvas);
  resizeFireworksCanvas();

  const FW_COLORS = ['#7ff2ff', '#f5d68a', '#e6b3ff', '#4bd8ff', '#ffe08a', '#c9a6ff'];

  function spawnFireworkBurst(cx, cy, scale){
    scale = scale || 1;
    const particleCount = Math.round((46 + Math.floor(Math.random() * 18)) * scale);
    const color = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)];
    for (let i = 0; i < particleCount; i++){
      const angle = (i / particleCount) * Math.PI * 2 + Math.random() * 0.2;
      const speed = (2.4 + Math.random() * 4.2) * Math.sqrt(scale);
      fwParticles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        // decaimiento lento -> cada estallido tarda ~2-3.7s en apagarse del
        // todo, así el cielo se mantiene "lleno" en vez de flashear y
        // desaparecer de golpe entre una tanda y la siguiente
        decay: 0.0045 + Math.random() * 0.0055,
        size: (1.6 + Math.random() * 2.2) * Math.sqrt(scale),
        color: Math.random() < 0.75 ? color : '#ffffff'
      });
    }
  }

  function runFireworksShow(){
    // Estallido principal, grande y centrado sobre la rueda, justo en el
    // instante en que se revela el premio: es el "boom" de impacto que marca
    // el momento exacto de la recompensa.
    spawnFireworkBurst(window.innerWidth * 0.5, window.innerHeight * 0.34, 1.9);
    playFuegosSound();

    // Después, una tanda larga y escalonada de estallidos secundarios
    // repartidos por la pantalla a lo largo de ~3.6s, como un castillo de
    // fuegos artificiales que se sostiene varios segundos -- nunca se quedan
    // más de ~450ms sin que nazca un estallido nuevo, así el show no tiene
    // huecos donde se sienta que ya terminó antes de tiempo.
    const bursts = 10 + Math.floor(Math.random() * 3);
    for (let i = 0; i < bursts; i++){
      setTimeout(() => {
        const bx = window.innerWidth * (0.14 + Math.random() * 0.72);
        const by = window.innerHeight * (0.14 + Math.random() * 0.4);
        spawnFireworkBurst(bx, by, 0.75 + Math.random() * 0.55);
      }, 200 + i * 340);
    }
    if (!fwAnimId) fwAnimId = requestAnimationFrame(fireworksLoop);
  }

  function fireworksLoop(){
    fwCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    fwCtx.globalCompositeOperation = 'lighter';

    for (let i = fwParticles.length - 1; i >= 0; i--){
      const p = fwParticles[i];
      p.vy += 0.045;      // gravedad suave
      p.vx *= 0.985;      // fricción del aire
      p.vy *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;

      if (p.life <= 0){
        fwParticles.splice(i, 1);
        continue;
      }

      fwCtx.globalAlpha = Math.max(0, p.life);
      fwCtx.fillStyle = p.color;
      fwCtx.beginPath();
      fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      fwCtx.fill();
    }

    fwCtx.globalAlpha = 1;
    fwCtx.globalCompositeOperation = 'source-over';

    if (fwParticles.length > 0){
      fwAnimId = requestAnimationFrame(fireworksLoop);
    } else {
      fwAnimId = null; // deja de dibujar cuando ya no queda ninguna partícula viva
    }
  }

  spinCtaBtn.addEventListener('click', spin);
  spinHubBtn.addEventListener('click', spin);

  // ---- estrellas de fondo decorativas ----
  const starsField = document.getElementById('starsField');
  const starCount = 60;
  for (let i = 0; i < starCount; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    starsField.appendChild(s);
  }

  // ---- bombillas del aro exterior ----
  const bulbsOuter = document.getElementById('bulbsOuter');
  const bulbCount = 28;
  const bulbRadius = 226;
  for (let i = 0; i < bulbCount; i++){
    const a = (i / bulbCount) * Math.PI * 2 - Math.PI/2;
    const x = 250 + bulbRadius * Math.cos(a);
    const y = 250 + bulbRadius * Math.sin(a);
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', 4.2);
    circle.setAttribute('fill', i % 2 === 0 ? '#7ff2ff' : '#e6b3ff');
    circle.classList.add('bulb');
    circle.style.animationDelay = (i * 0.09) + 's';
    bulbsOuter.appendChild(circle);
  }
})();
</script>

<!-- ============ FIREBASE (mismo proyecto que index.html) ============
     La ruleta lee y escribe el mismo documento saves/{uid} que usa
     index.html para todo el progreso del juego. El campo "clk" es el saldo
     GASTABLE actual y "totalClk" un contador acumulado que solo sube; el
     premio de la ruleta suma a ambos, exactamente como hace addClk() en
     index.html, para que un giro se refleje igual que cualquier otra forma
     de ganar $CLK dentro del juego. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEVcDHhKSyPd4n_U-DXzJI7lskY7BTiyI",
  authDomain: "crypto-alien.firebaseapp.com",
  projectId: "crypto-alien",
  storageBucket: "crypto-alien.firebasestorage.app",
  messagingSenderId: "61542154571",
  appId: "1:61542154571:web:bddd5100632abc9f09a8ce"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
window.__fb = { auth, db, doc, getDoc, setDoc, serverTimestamp };

// Mismas claves/formato que index.html (ver SAVE_KEY_PREFIX y sanitize() ahí),
// para que el save de un lado sea 100% compatible con el otro.
const SAVE_KEY = 'cck4';
const SAVE_KEY_PREFIX = 'cck4_user_';
function saveKeyForUid(uid){ return uid ? SAVE_KEY_PREFIX + uid : SAVE_KEY; }

// Mismos campos numéricos que sanitize() en index.html: solo se tocan clk y
// totalClk aquí, pero se preserva (o rellena con 0) el resto de campos para
// que un documento nuevo/corrupto no rompa index.html al leerlo después.
const NUMERIC_FIELDS = ['clk','totalClk','totalTaps','lvl','xp','xpNeed','energy','eMax','eRegen','tapPow','pph','maxCombo','upsCount','refs','refEarned','dailyDay','dStreak','lastDaily','boostEnd','lastSave','lastPassive','skin','wkAnchor','wkBase','moAnchor','moBase','lastRuletaSpin'];
function sanitizeForSave(d){
  d = d && typeof d === 'object' ? d : {};
  for (const k of NUMERIC_FIELDS){
    if (typeof d[k] !== 'number' || !isFinite(d[k])) d[k] = 0;
    if (d[k] < 0) d[k] = 0;
  }
  if (d.lvl < 1) d.lvl = 1;
  if (d.xpNeed < 500) d.xpNeed = 500;
  if (d.eMax < 120) d.eMax = 120;
  if (d.eRegen < 0.04) d.eRegen = 0.04;
  if (d.tapPow < 1) d.tapPow = 1;
  if (!d.ups || typeof d.ups !== 'object') d.ups = {};
  if (!d.missions || typeof d.missions !== 'object') d.missions = {};
  if (typeof d.alias !== 'string') d.alias = '';
  if (typeof d.uid !== 'string') d.uid = '';
  return d;
}

function fmtClk(n){
  n = Math.floor(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return n + '';
}

function bumpBalUI(clk){
  const numEl = document.getElementById('ruletaBalNum');
  if (!numEl) return;
  numEl.textContent = fmtClk(clk);
  numEl.classList.remove('bump'); void numEl.offsetWidth; numEl.classList.add('bump');
}

// ---- límite de 1 tirada cada 12h, sin acumular tiradas pendientes ----
// "Sin acumular" significa literal: si el jugador deja pasar 2, 3 o más días
// sin entrar, al volver solo tiene la 1 tirada normal disponible (no se le
// "deben" las tiradas de los días que faltó). Por eso el cooldown se calcula
// siempre como lastRuletaSpin + 12h, nunca como un contador de fichas que
// vaya sumando una por día.
const RULETA_COOLDOWN_MS = 12 * 60 * 60 * 1000;
let _lastKnownRuletaSpin = 0; // último lastRuletaSpin visto (local o nube), en memoria para que spin() lo consulte sin tener que esperar a Firestore
function msUntilNextSpin(lastSpinTs){
  if (!isFinite(lastSpinTs) || lastSpinTs <= 0) return 0;
  return Math.max(0, (lastSpinTs + RULETA_COOLDOWN_MS) - Date.now());
}
function fmtCooldown(ms){
  const totalMin = Math.ceil(ms / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `Vuelve en ${h}h ${m}m`;
  return `Vuelve en ${m}m`;
}
// Aplica el estado de cooldown al botón GIRAR (y al botón redondo del hub,
// si existe). No toca "spinning": ese flag sigue siendo exclusivamente para
// la animación en curso, este es un bloqueo aparte y de más larga duración.
// Nota: spinCtaBtn/spinHubBtn/spin() viven en OTRO <script> (el de la lógica
// de la rueda), que es un ámbito JS separado de este módulo — por eso aquí
// se llega a los botones por document.getElementById() en vez de reusar sus
// referencias internas, y por eso lo que spin() necesita consultar se
// expone en window (ver window.ruletaCooldown más abajo).
function applySpinCooldownUI(lastSpinTs){
  // lastSpinTs === undefined -> "solo repinta", no toques el valor en memoria
  // (lo usa spin() vía refreshUI() cuando quiere reafirmar la UI sin aportar
  // un dato nuevo). Cualquier otro valor no numérico sí se normaliza a 0,
  // igual que antes, porque ahí sí es un dato explícito (aunque inválido).
  if (lastSpinTs !== undefined){
    _lastKnownRuletaSpin = isFinite(lastSpinTs) ? lastSpinTs : 0;
  }
  const remaining = msUntilNextSpin(_lastKnownRuletaSpin);
  const onCooldown = remaining > 0;
  const ctaBtn = document.getElementById('spinCtaBtn');
  const hubBtn = document.getElementById('spinHubBtn');
  if (ctaBtn){ ctaBtn.disabled = onCooldown; ctaBtn.textContent = onCooldown ? fmtCooldown(remaining) : 'GIRAR'; }
  if (hubBtn) hubBtn.disabled = onCooldown;
  return onCooldown;
}
// Expuesto para que spin() (definida en el <script> de la lógica de la
// rueda, más arriba en el documento, ámbito distinto a este módulo) pueda
// comprobar el cooldown como defensa adicional justo antes de girar, sin
// depender solo de que el botón ya esté deshabilitado en el DOM.
window.ruletaCooldown = {
  msRemaining: () => msUntilNextSpin(_lastKnownRuletaSpin),
  refreshUI: applySpinCooldownUI
};

// ---- carga inicial del saldo (localStorage primero, Firestore si hace falta) ----
async function loadInitialBalance(user){
  const numEl = document.getElementById('ruletaBalNum');
  if (!user){
    if (numEl) numEl.textContent = '–';
    return;
  }
  try{
    const localRaw = localStorage.getItem(saveKeyForUid(user.uid));
    const localData = localRaw ? JSON.parse(localRaw) : null;
    if (localData && typeof localData.clk === 'number'){
      bumpBalUI(localData.clk);
    }
    if (localData) applySpinCooldownUI(localData.lastRuletaSpin || 0);
    const snap = await getDoc(doc(db, 'saves', user.uid));
    if (snap.exists()){
      const cloudData = JSON.parse(snap.data().data);
      const cloudUpdatedAt = snap.data().updatedAt;
      const cloudUpdatedMs = cloudUpdatedAt && cloudUpdatedAt.toMillis ? cloudUpdatedAt.toMillis() : 0;
      const localSavedMs = (localData && localData.lastSave) || 0;
      // Solo se aplica el saldo de Firestore si es MÁS RECIENTE que el
      // localStorage ya mostrado arriba. cloudSaveNow() en index.html sube
      // a Firestore como mucho cada 20s (CLOUD_MIN_INTERVAL), así que si el
      // jugador acaba de tapear en el padre y entra aquí antes de esos 20s,
      // Firestore todavía tiene un clk viejo: sin esta comparación, ese
      // valor viejo pisaba el saldo correcto que localStorage ya mostraba.
      if (typeof cloudData.clk === 'number' && cloudUpdatedMs >= localSavedMs) bumpBalUI(cloudData.clk);
      // El mayor de los dos lados manda (mismo criterio "solo sube" que
      // mergeStates() usa en index.html): si el jugador giró en otro
      // dispositivo/pestaña y ese dato aún no llegó a este localStorage,
      // no queremos mostrar el botón habilitado por error.
      applySpinCooldownUI(Math.max(_lastKnownRuletaSpin, cloudData.lastRuletaSpin || 0));
    } else if (!localData){
      bumpBalUI(0);
    }
  }catch(err){
    console.warn('No se pudo cargar el saldo $CLK en la ruleta:', err);
    if (numEl && numEl.textContent === '–') numEl.textContent = '0';
  }
}

// ---- suma el premio: localStorage al instante + Firestore con merge ----
// Se lee el documento más reciente justo antes de escribir (en vez de fiarse
// de un valor cacheado) para no pisar progreso que el jugador haya hecho en
// index.html en otra pestaña/dispositivo momentos antes de girar la ruleta.
//
// Los premios se ENCOLAN (_ruletaAwardQueue) en vez de descartarse si se
// solapan: antes, si una tirada llamaba a esta función mientras la anterior
// todavía estaba leyendo/escribiendo en Firestore, la guarda "_ruletaAwarding"
// abortaba la segunda llamada entera y ese premio no llegaba a sumarse nunca
// a Firestore. Encadenar las llamadas asegura que cada premio se procesa
// exactamente una vez, en el orden en que se ganó, y que bumpBalUI() siempre
// pinta el total acumulado hasta ese momento y no el de una tirada aislada
// que responde tarde y pisa un valor más nuevo.
let _ruletaAwardQueue = Promise.resolve();
async function _awardRuletaPrizeNow(amount){
  const user = window.__fbUser;
  if (!user || !isFinite(amount) || amount <= 0) return;
  const won = Math.floor(amount * 100) / 100;

  try{
    // 1) Local: lee el save local más reciente de este usuario (o uno vacío si no existe)
    //    y le suma el premio ya mismo, para que el saldo no se pierda si falla la red.
    const key = saveKeyForUid(user.uid);
    let localData;
    try{
      const raw = localStorage.getItem(key);
      localData = raw ? JSON.parse(raw) : {};
    }catch(e){ localData = {}; }
    localData = sanitizeForSave(localData);
    localData.uid = user.uid;
    localData.clk += won;
    localData.totalClk += won;
    localData.lastSave = Date.now();
    localData.lastRuletaSpin = localData.lastSave; // arranca el cooldown de 12h desde este mismo instante
    try{ localStorage.setItem(key, JSON.stringify(localData)); }catch(e){
      console.warn('No se pudo guardar el premio de la ruleta en localStorage:', e);
    }
    bumpBalUI(localData.clk);
    applySpinCooldownUI(localData.lastRuletaSpin);

    // 2) Nube: relee saves/{uid} justo antes de escribir. Normalmente se suma
    //    el premio sobre ese valor de la nube (por si el jugador avanzó en
    //    otra pestaña/dispositivo momentos antes de girar). PERO si lo que
    //    hay en la nube está más ATRASADO que "localData" de arriba (mismo
    //    dispositivo, ya con el premio sumado) — típicamente porque el
    //    guardado en la nube que dispara el link de la ruleta (forceSave())
    //    es "fire and forget" y no le da tiempo a terminar antes de navegar
    //    a esta página — entonces sumar el premio OTRA VEZ sobre ese
    //    snapshot viejo producía un total menor al que ya se había mostrado
    //    en el paso 1, y el marcador se veía "bajar" en vez de sumar. En ese
    //    caso se usa localData tal cual como base (el premio ya está sumado
    //    ahí, no hay que volver a sumarlo) y solo se sincroniza hacia la nube.
    const ref = doc(db, 'saves', user.uid);
    const snap = await getDoc(ref);
    const rawCloudData = snap.exists() ? sanitizeForSave(JSON.parse(snap.data().data)) : null;
    const cloudIsNewer = rawCloudData && (typeof rawCloudData.lastSave === 'number' ? rawCloudData.lastSave : 0) > localData.lastSave;
    let cloudData;
    if (cloudIsNewer){
      cloudData = rawCloudData;
      cloudData.uid = user.uid;
      cloudData.clk += won;
      cloudData.totalClk += won;
      cloudData.lastSave = Date.now();
      cloudData.lastRuletaSpin = cloudData.lastSave; // mismo criterio que en el paso local
    } else {
      cloudData = { ...localData }; // ya trae lastRuletaSpin puesto por el paso 1
    }
    await setDoc(ref, {
      data: JSON.stringify(cloudData),
      updatedAt: serverTimestamp()
    });
    bumpBalUI(cloudData.clk);
    applySpinCooldownUI(cloudData.lastRuletaSpin);
  }catch(err){
    // El premio ya quedó a salvo en localStorage (paso 1) aunque esto falle;
    // solo la copia en la nube no se actualizó todavía.
    console.error('No se pudo sincronizar el premio de la ruleta con Firestore:', err);
  }
}
window.awardRuletaPrize = function(amount){
  // Encadena sobre la promesa anterior en vez de lanzar en paralelo: así el
  // paso 2 (nube) de un premio nunca puede resolver DESPUÉS del paso 2 de un
  // premio ganado más tarde y pisar el marcador con un total desactualizado.
  _ruletaAwardQueue = _ruletaAwardQueue.then(() => _awardRuletaPrizeNow(amount));
  return _ruletaAwardQueue;
};


onAuthStateChanged(auth, (user) => {
  window.__fbUser = user || null;
  const loginOv = document.getElementById('ruletaLoginOv');
  if (user){
    if (loginOv) loginOv.classList.remove('show');
  }
  loadInitialBalance(user || null);
});

<!-- Evitar zoom en móvil: bloquea pinch-zoom (2 dedos) y doble-tap zoom -->
<script>
document.addEventListener('touchmove', function(e){
  if (e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });

var __ultimoTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var ahora = Date.now();
  if (ahora - __ultimoTouchEnd <= 300) e.preventDefault();
  __ultimoTouchEnd = ahora;
}, { passive: false });
</script>
