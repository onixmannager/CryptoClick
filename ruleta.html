<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta Galáctica</title>
<style>
  :root{
    --gold-light:#f5d68a;
    --gold:#d9a441;
    --gold-dark:#8a5a1e;
    --cyan:#4bd8ff;
    --cyan-glow:#7ff2ff;
    --purple:#7b2fd6;
    --purple-dark:#3a1266;
    --green:#1fae7a;
    --green-dark:#0c5f42;
    --blue:#1b4fa8;
    --blue-dark:#0a2a5e;
    --bg-void:#050818;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 30%, #0e1a3a 0%, #050818 60%, #020310 100%);
    font-family:'Segoe UI', system-ui, sans-serif;
    overflow:hidden;
    padding:20px;
  }

  .stage{
    position:relative;
    width:min(92vw, 440px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- estrellas de fondo ---------- */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;height:2px;
    background:#bfe6ff;
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.9;}
  }

  /* ---------- contenedor de la rueda ---------- */
  .wheel-wrap{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    filter:drop-shadow(0 10px 40px rgba(0,0,0,.6));
  }

  /* pico con cabeza alien */
  .alien-spike{
    position:absolute;
    top:-11%;
    left:50%;
    transform:translateX(-50%);
    width:24%;
    z-index:20;
    filter:drop-shadow(0 0 10px rgba(75,216,255,.7));
  }

  /* aro exterior con luces animadas */
  .ring-lights{
    position:absolute;
    inset:0;
    animation:none;
  }
  .bulb{
    animation:blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.35; filter:brightness(1);}
    50%{opacity:1; filter:brightness(1.8);}
  }

  /* la rueda que gira */
  #wheelSvg{
    display:block;
    width:100%;
    height:100%;
    transform:rotate(0deg);
  }
  #wheelRotor{
    transform-box: fill-box;
    transform-origin: 50% 50%;
  }

  .sector-label{
    font-family:'Arial Black', 'Segoe UI', sans-serif;
    font-weight:900;
    fill:url(#textGoldBevel);
    stroke:#5c3a0f;
    stroke-width:2.5;
    paint-order:stroke fill;
    letter-spacing:.5px;
    filter:url(#textEmboss);
  }

  /* botón central de disparo */
  .spin-btn{
    position:absolute;
    top:50%;
    left:50%;
    width:15.5%;
    height:15.5%;
    transform:translate(-50%,-50%);
    z-index:30;
    border:none;
    border-radius:50%;
    cursor:pointer;
    background:transparent;
    padding:0;
  }
  .spin-btn:active .hub-core{
    transform:scale(.94);
  }
  .spin-btn:disabled{cursor:default;}
  .hub-core{
    width:100%;
    height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #c9a6ff 0%, #8b4fe0 22%, #5a1fb0 48%, #2c0d5e 78%, #180736 100%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.35),
      inset 0 -10px 20px rgba(0,0,0,.55),
      0 0 22px rgba(139,79,224,.85),
      0 0 45px rgba(75,216,255,.35);
    border:3px solid var(--gold);
    transition:transform .15s ease;
  }

  /* puntero superior */
  .pointer{
    position:absolute;
    top:-2.5%;
    left:50%;
    transform:translateX(-50%);
    width:7%;
    z-index:25;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.6));
  }

  /* ---------- Resultado ---------- */
  .result-box{
    margin-top:22px;
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(-8px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .result-box.show{
    opacity:1;
    transform:translateY(0);
  }
  .result-pill{
    padding:10px 28px;
    border-radius:999px;
    background:linear-gradient(180deg,#1a2350,#0c1230);
    border:1.5px solid var(--cyan);
    box-shadow:0 0 18px rgba(75,216,255,.55), inset 0 0 10px rgba(75,216,255,.15);
    color:var(--gold-light);
    font-weight:800;
    font-size:1.05rem;
    letter-spacing:.5px;
    text-shadow:0 0 8px rgba(245,214,138,.5);
  }

  .spin-cta{
    margin-top:18px;
    padding:13px 40px;
    border-radius:999px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,#3a1266,#1a0838);
    color:var(--gold-light);
    font-weight:800;
    font-size:1rem;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 0 20px rgba(123,47,214,.55), inset 0 1px 0 rgba(255,255,255,.15);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .spin-cta:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 0 28px rgba(75,216,255,.6), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .spin-cta:active:not(:disabled){
    transform:translateY(0);
  }
  .spin-cta:disabled{
    opacity:.5;
    cursor:default;
  }

  .brand{
    margin-top:26px;
    color:var(--cyan-glow);
    letter-spacing:4px;
    font-size:.7rem;
    opacity:.55;
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .result-pill{font-size:.9rem; padding:9px 20px;}
    .spin-cta{font-size:.85rem; padding:11px 30px;}
  }
</style>
</head>
<body>

<div class="stars" id="starsField"></div>

<div class="stage">

  <div class="wheel-wrap" id="wheelWrap">

    <!-- pico dorado con cabeza alien -->
    <svg class="alien-spike" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="spikeGold" x1="0.15" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="30%" stop-color="#f5d68a"/>
          <stop offset="55%" stop-color="#c99a3a"/>
          <stop offset="80%" stop-color="#a9701f"/>
          <stop offset="100%" stop-color="#6b4413"/>
        </linearGradient>
        <radialGradient id="alienFace" cx="50%" cy="28%" r="80%">
          <stop offset="0%" stop-color="#204f64"/>
          <stop offset="55%" stop-color="#0b2430"/>
          <stop offset="100%" stop-color="#020608"/>
        </radialGradient>
        <radialGradient id="eyeGlow" cx="45%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#eafeff"/>
          <stop offset="40%" stop-color="#7ff2ff"/>
          <stop offset="75%" stop-color="#279cc4"/>
          <stop offset="100%" stop-color="#0d5a78"/>
        </radialGradient>
      </defs>

      <!-- marco dorado del pico, forma de escudo redondeado, con bisel -->
      <path d="M100 2
               C140 2 168 28 170 62
               C172 98 158 130 138 158
               L100 226
               L62 158
               C42 130 28 98 30 62
               C32 28 60 2 100 2 Z"
            fill="url(#spikeGold)" stroke="#3a2200" stroke-width="3"/>
      <path d="M100 10
               C134 10 158 32 160 62
               C162 94 149 122 132 148
               L100 210
               L68 148
               C51 122 38 94 40 62
               C42 32 66 10 100 10 Z"
            fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.55"/>

      <!-- cara oscura interior -->
      <path d="M100 22
               C130 22 149 41 151 64
               C153 90 143 113 129 136
               L100 192
               L71 136
               C57 113 47 90 49 64
               C51 41 70 22 100 22 Z"
            fill="url(#alienFace)" stroke="#7ff2ff" stroke-width="3" opacity="0.95"/>

      <!-- ojos almendrados, tamaño moderado para leerse nítidos incluso pequeños -->
      <ellipse cx="82" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="118" cy="80" rx="12" ry="17" fill="url(#eyeGlow)"/>
      <ellipse cx="79" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>
      <ellipse cx="115" cy="74" rx="4" ry="5" fill="rgba(255,255,255,0.9)"/>

      <!-- boca pequeña -->
      <path d="M92 146 Q100 152 108 146" stroke="#4bd8ff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    </svg>

    <!-- puntero -->
    <svg class="pointer" viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="ptrGold" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fdeeb0"/>
          <stop offset="60%" stop-color="#d9a441"/>
          <stop offset="100%" stop-color="#7a4d16"/>
        </linearGradient>
      </defs>
      <path d="M30 68 L2 10 Q30 -6 58 10 Z" fill="url(#ptrGold)" stroke="#5c3a0f" stroke-width="2"/>
      <circle cx="30" cy="16" r="6" fill="#7b2fd6" stroke="#f5d68a" stroke-width="2"/>
    </svg>

    <!-- ================= RUEDA SVG ================= -->
    <svg id="wheelSvg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- gradientes de sectores: radiales tipo "cuenco" — sombra hacia el centro, luz hacia el borde -->
        <radialGradient id="secGreen" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#052c1f"/>
          <stop offset="38%" stop-color="#0e7a52"/>
          <stop offset="68%" stop-color="#2fd39a"/>
          <stop offset="88%" stop-color="#7ffcd0"/>
          <stop offset="100%" stop-color="#c8fff0"/>
        </radialGradient>
        <radialGradient id="secPurple" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#230a4a"/>
          <stop offset="38%" stop-color="#6620c4"/>
          <stop offset="68%" stop-color="#a86bf0"/>
          <stop offset="88%" stop-color="#d9b6ff"/>
          <stop offset="100%" stop-color="#f3e5ff"/>
        </radialGradient>
        <radialGradient id="secBlue" cx="50%" cy="50%" r="75%">
          <stop offset="0%" stop-color="#071b40"/>
          <stop offset="38%" stop-color="#1b52ad"/>
          <stop offset="68%" stop-color="#4f8bf0"/>
          <stop offset="88%" stop-color="#a9caff"/>
          <stop offset="100%" stop-color="#e2edff"/>
        </radialGradient>

        <!-- sombra curva de "cuenco" superpuesta a cada sector, independiente del color -->
        <radialGradient id="bowlShade" cx="50%" cy="50%" r="72%">
          <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
          <stop offset="50%" stop-color="rgba(0,0,0,0.06)"/>
          <stop offset="78%" stop-color="rgba(0,0,0,0)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>

        <!-- brillo especular tipo cristal, elipse desplazada hacia arriba-izquierda -->
        <radialGradient id="glassSheen" cx="34%" cy="28%" r="42%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
          <stop offset="35%" stop-color="rgba(255,255,255,0.12)"/>
          <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>

        <!-- relieve dorado para texto: bisel metálico con luz arriba-izq y sombra abajo-der -->
        <linearGradient id="textGoldBevel" x1="0.2" y1="0" x2="0.75" y2="1">
          <stop offset="0%" stop-color="#fff8e0"/>
          <stop offset="35%" stop-color="#ffe9a8"/>
          <stop offset="55%" stop-color="#e0ac3e"/>
          <stop offset="80%" stop-color="#a9701f"/>
          <stop offset="100%" stop-color="#7a4d16"/>
        </linearGradient>

        <filter id="textEmboss" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="2.5" stdDeviation="0" flood-color="#3a2200" flood-opacity="0.9"/>
          <feDropShadow dx="0" dy="-1.5" stdDeviation="0" flood-color="#fff6d8" flood-opacity="0.55"/>
        </filter>

        <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="wideBlur"/>
          <feGaussianBlur stdDeviation="2" result="tightBlur"/>
          <feMerge>
            <feMergeNode in="wideBlur"/>
            <feMergeNode in="tightBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
          <stop offset="70%" stop-color="rgba(255,255,255,0)"/>
        </radialGradient>

        <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#c9a6ff"/>
          <stop offset="30%" stop-color="#8b4fe0"/>
          <stop offset="65%" stop-color="#4c1d94"/>
          <stop offset="100%" stop-color="#1c0838"/>
        </radialGradient>

        <linearGradient id="frameGold" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="18%" stop-color="#f5d68a"/>
          <stop offset="35%" stop-color="#c99a3a"/>
          <stop offset="50%" stop-color="#8a5a1e"/>
          <stop offset="65%" stop-color="#c99a3a"/>
          <stop offset="82%" stop-color="#f5d68a"/>
          <stop offset="100%" stop-color="#6b4413"/>
        </linearGradient>

        <!-- bisel interior del aro: da el canto grueso metálico -->
        <linearGradient id="frameGoldInner" x1="0.1" y1="0.05" x2="0.9" y2="1">
          <stop offset="0%" stop-color="#7a4d16"/>
          <stop offset="20%" stop-color="#e9c364"/>
          <stop offset="45%" stop-color="#fff6d8"/>
          <stop offset="55%" stop-color="#b9862f"/>
          <stop offset="80%" stop-color="#6b4413"/>
          <stop offset="100%" stop-color="#3a2200"/>
        </linearGradient>

        <radialGradient id="hubBevel" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6d8"/>
          <stop offset="55%" stop-color="#e9c364"/>
          <stop offset="80%" stop-color="#8a5a1e"/>
          <stop offset="100%" stop-color="#3a2200"/>
        </radialGradient>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

      </defs>

      <!-- ===== marco exterior dorado — biselado multicapa, canal de luces hundido ===== -->
      <!-- sombra de contacto general, debajo de todo -->
      <ellipse cx="250" cy="260" rx="235" ry="220" fill="rgba(0,0,0,0.45)" filter="url(#softGlow)"/>

      <!-- ANILLO DORADO EXTERIOR: delgado, bisel marcado con franjas de luz/sombra -->
      <circle cx="250" cy="250" r="248" fill="url(#frameGold)"/>
      <circle cx="250" cy="250" r="248" fill="none" stroke="#3a2200" stroke-width="2"/>
      <circle cx="250" cy="250" r="243" fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="250" cy="250" r="236" fill="none" stroke="#4a2e0c" stroke-width="2" opacity="0.7"/>

      <!-- CANAL HUNDIDO: fondo oscuro morado donde viven las luces, entre dos bordes dorados -->
      <circle cx="250" cy="250" r="233" fill="#1a0f38"/>
      <circle cx="250" cy="250" r="233" fill="none" stroke="#0a0620" stroke-width="3"/>
      <circle cx="250" cy="250" r="220" fill="none" stroke="#0a0620" stroke-width="3"/>

      <!-- ANILLO DORADO INTERIOR: separa el canal de luces del disco -->
      <circle cx="250" cy="250" r="217" fill="url(#frameGoldInner)"/>
      <circle cx="250" cy="250" r="217" fill="none" stroke="#fff6d8" stroke-width="1" opacity="0.55"/>
      <circle cx="250" cy="250" r="210" fill="none" stroke="#3a2200" stroke-width="2" opacity="0.7"/>

      <!-- BANDA NEGRA: caída hacia el disco de sectores -->
      <circle cx="250" cy="250" r="207" fill="none" stroke="#050310" stroke-width="10"/>
      <circle cx="250" cy="250" r="200" fill="#0c1230"/>

      <!-- aro morado + cian justo antes del disco -->
      <circle cx="250" cy="250" r="200" fill="none" stroke="#5a1fb0" stroke-width="4" opacity="0.7"/>
      <circle cx="250" cy="250" r="197" fill="none" stroke="#4bd8ff" stroke-width="2" opacity="0.9" filter="url(#softGlow)"/>

      <!-- bombillas del canal hundido, radio intermedio entre los dos anillos dorados -->
      <g class="ring-lights" id="bulbsOuter"></g>

      <!-- ===== rueda giratoria (sectores + textos) ===== -->
      <g id="wheelRotor">

        <!-- disco base -->
        <circle cx="250" cy="250" r="196" fill="#08101f"/>

        <!-- 6 sectores de 60° cada uno, empezando arriba (100K), sentido horario -->
        <!-- 100K arriba (verde) -->
        <path d="M250,250 L250,54 A196,196 0 0,1 419.7,152 Z" fill="url(#secGreen)"/>
        <!-- 5K arriba-derecha (púrpura) -->
        <path d="M250,250 L419.7,152 A196,196 0 0,1 419.7,348 Z" fill="url(#secPurple)"/>
        <!-- 10K abajo-derecha (azul) -->
        <path d="M250,250 L419.7,348 A196,196 0 0,1 250,446 Z" fill="url(#secBlue)"/>
        <!-- 25K abajo (verde) -->
        <path d="M250,250 L250,446 A196,196 0 0,1 80.3,348 Z" fill="url(#secGreen)"/>
        <!-- 50K abajo-izquierda (púrpura) -->
        <path d="M250,250 L80.3,348 A196,196 0 0,1 80.3,152 Z" fill="url(#secPurple)"/>
        <!-- 1K arriba-izquierda (azul) -->
        <path d="M250,250 L80.3,152 A196,196 0 0,1 250,54 Z" fill="url(#secBlue)"/>

        <!-- líneas divisoras: doble trazo (dorado grueso + cian brillante fino) para simular separación física de gajos -->
        <g stroke-linecap="round">
          <g stroke="#7a4d16" stroke-width="5" opacity="0.55">
            <line x1="250" y1="250" x2="250" y2="54"/>
            <line x1="250" y1="250" x2="419.7" y2="152"/>
            <line x1="250" y1="250" x2="419.7" y2="348"/>
            <line x1="250" y1="250" x2="250" y2="446"/>
            <line x1="250" y1="250" x2="80.3" y2="348"/>
            <line x1="250" y1="250" x2="80.3" y2="152"/>
          </g>
          <g stroke="#7ff2ff" stroke-width="2.5" opacity="0.95" filter="url(#neonGlow)">
            <line x1="250" y1="250" x2="250" y2="54"/>
            <line x1="250" y1="250" x2="419.7" y2="152"/>
            <line x1="250" y1="250" x2="419.7" y2="348"/>
            <line x1="250" y1="250" x2="250" y2="446"/>
            <line x1="250" y1="250" x2="80.3" y2="348"/>
            <line x1="250" y1="250" x2="80.3" y2="152"/>
          </g>
        </g>

        <!-- sombra curva tipo "cuenco" — da profundidad de plato hondo a cada sector -->
        <circle cx="250" cy="250" r="196" fill="url(#bowlShade)"/>

        <!-- brillo especular tipo cristal, superpuesto sobre toda la rueda -->
        <circle cx="250" cy="250" r="196" fill="url(#glassSheen)" style="mix-blend-mode:screen"/>

        <!-- aro cian luminoso justo en el borde interior del disco, como vidrio retroiluminado -->
        <circle cx="250" cy="250" r="188" fill="none" stroke="#9df3ff" stroke-width="3" opacity="0.85" filter="url(#neonGlow)"/>

        <circle cx="250" cy="250" r="196" fill="none" stroke="#c99a3a" stroke-width="4"/>
        <circle cx="250" cy="250" r="192" fill="none" stroke="#fff6d8" stroke-width="1.5" opacity="0.5"/>

        <!-- ===== textos de premios — centrados por trigonometría real en el centroide de cada sector ===== -->
        <!-- 100K arriba: (325, 120) -->
        <text class="sector-label" x="325" y="120" font-size="40" text-anchor="middle" dominant-baseline="middle">100K</text>
        <!-- 5K arriba-derecha: (400, 250) -->
        <text class="sector-label" x="400" y="250" font-size="44" text-anchor="middle" dominant-baseline="middle" transform="rotate(60 400 250)">5K</text>
        <!-- 10K abajo-derecha: (325, 380) -->
        <text class="sector-label" x="325" y="380" font-size="42" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60 325 380)">10K</text>
        <!-- 25K abajo: (175, 380) -->
        <text class="sector-label" x="175" y="380" font-size="42" text-anchor="middle" dominant-baseline="middle">25K</text>
        <!-- 50K abajo-izquierda: (100, 250) -->
        <text class="sector-label" x="100" y="250" font-size="42" text-anchor="middle" dominant-baseline="middle" transform="rotate(60 100 250)">50K</text>
        <!-- 1K arriba-izquierda: (175, 120) -->
        <text class="sector-label" x="175" y="120" font-size="44" text-anchor="middle" dominant-baseline="middle" transform="rotate(-60 175 120)">1K</text>

        <!-- marcadores triangulares dorados en los bordes -->
        <g fill="url(#frameGold)" stroke="#5c3a0f" stroke-width="1.5">
          <path d="M250,54 l10,16 l-20,0 Z"/>
          <path d="M419.7,152 l16,10 l-18,10 Z" transform="translate(-6,-8)"/>
          <path d="M419.7,348 l16,-10 l-18,-10 Z" transform="translate(-6,8)"/>
          <path d="M250,446 l10,-16 l-20,0 Z"/>
          <path d="M80.3,348 l-16,-10 l18,-10 Z" transform="translate(6,8)"/>
          <path d="M80.3,152 l-16,10 l18,10 Z" transform="translate(6,-8)"/>
        </g>
      </g>

      <!-- ===== hub central fijo (no gira) — esfera de cristal con profundidad real ===== -->
      <ellipse cx="250" cy="258" rx="52" ry="46" fill="rgba(0,0,0,0.5)" filter="url(#softGlow)"/>
      <circle cx="250" cy="250" r="60" fill="url(#hubBevel)"/>
      <circle cx="250" cy="250" r="60" fill="none" stroke="#3a2200" stroke-width="1.5"/>
      <circle cx="250" cy="250" r="51" fill="#08101f"/>
      <circle cx="250" cy="250" r="48" fill="url(#hubGlow)"/>
      <!-- sombra interna inferior de la esfera -->
      <path d="M210,268 A48,48 0 0,0 290,268 A55,38 0 0,1 210,268 Z" fill="rgba(0,0,0,0.4)"/>
      <!-- highlight especular principal -->
      <ellipse cx="233" cy="232" rx="17" ry="11" fill="rgba(255,255,255,0.55)"/>
      <!-- highlight secundario, más pequeño y nítido -->
      <ellipse cx="226" cy="226" rx="6" ry="4" fill="rgba(255,255,255,0.9)"/>
      <circle cx="250" cy="250" r="48" fill="none" stroke="#f5d68a" stroke-width="1.5" opacity="0.55"/>

    </svg>

    <!-- botón invisible clickable sobre el hub -->
    <button class="spin-btn" id="spinHubBtn" aria-label="Girar ruleta"></button>

  </div>

  <div class="result-box" id="resultBox">
    <div class="result-pill" id="resultPill">¡100K créditos!</div>
  </div>

  <button class="spin-cta" id="spinCtaBtn">GIRAR</button>

  <div class="brand">GALACTIC WINS</div>
</div>

<script>
(function(){
  // Premios en el ORDEN ANGULAR de la rueda, empezando en el sector de arriba (100K)
  // y avanzando en sentido HORARIO, tal como en la imagen de referencia.
  const prizes = [
    { label: "100K", value: 100000, angle: 0   }, // arriba
    { label: "5K",   value: 5000,   angle: 60  }, // arriba-derecha
    { label: "10K",  value: 10000,  angle: 120 }, // abajo-derecha
    { label: "25K",  value: 25000,  angle: 180 }, // abajo
    { label: "50K",  value: 50000,  angle: 240 }, // abajo-izquierda
    { label: "1K",   value: 1000,   angle: 300 }  // arriba-izquierda
  ];

  const rotor       = document.getElementById('wheelRotor');
  const spinCtaBtn   = document.getElementById('spinCtaBtn');
  const spinHubBtn   = document.getElementById('spinHubBtn');
  const resultBox    = document.getElementById('resultBox');
  const resultPill   = document.getElementById('resultPill');

  let currentRotation = 0;
  let spinning = false;

  // ---- probabilidades (opcional, editable) ----
  // Pon aquí el "peso" relativo de cada premio para controlar la probabilidad.
  // Por defecto son equiprobables (1 cada uno = 16.6% cada sector).
  const weights = {
    "100K": 1,
    "5K":   1,
    "10K":  1,
    "25K":  1,
    "50K":  1,
    "1K":   1
  };

  function pickWeightedPrize(){
    const pool = [];
    prizes.forEach(p => {
      const w = weights[p.label] ?? 1;
      for (let i = 0; i < w; i++) pool.push(p);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spin(){
    if (spinning) return;
    spinning = true;
    spinCtaBtn.disabled = true;
    spinHubBtn.disabled = true;
    resultBox.classList.remove('show');

    const prize = pickWeightedPrize();

    // El puntero está fijo arriba (0°). Para que el sector del premio quede
    // exactamente bajo el puntero, la rueda debe rotar de forma que
    // (anguloSector + rotacionFinal) % 360 === 0.
    // Añadimos vueltas completas extra para el efecto de giro, más un
    // pequeño offset aleatorio dentro del sector para que no caiga siempre
    // en el centro exacto (más natural).
    const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 vueltas completas
    const randomOffset = (Math.random() * 30) - 15; // +/-15° dentro del sector de 60°
    const targetAngle = 360 * extraSpins - prize.angle + randomOffset;

    currentRotation += targetAngle;

    rotor.style.transition = 'transform 5.2s cubic-bezier(.11,.82,.1,1)';
    rotor.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinning = false;
      spinCtaBtn.disabled = false;
      spinHubBtn.disabled = false;
      resultPill.textContent = `¡Ganaste ${prize.label}!`;
      resultBox.classList.add('show');

      // Evento personalizado para que la web anfitriona pueda escuchar el resultado
      window.dispatchEvent(new CustomEvent('ruletaResultado', {
        detail: { label: prize.label, value: prize.value }
      }));
    }, 5300);
  }

  spinCtaBtn.addEventListener('click', spin);
  spinHubBtn.addEventListener('click', spin);

  // ---- estrellas de fondo decorativas ----
  const starsField = document.getElementById('starsField');
  const starCount = 60;
  for (let i = 0; i < starCount; i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
    starsField.appendChild(s);
  }

  // ---- bombillas del aro exterior ----
  const bulbsOuter = document.getElementById('bulbsOuter');
  const bulbCount = 28;
  const bulbRadius = 226;
  for (let i = 0; i < bulbCount; i++){
    const a = (i / bulbCount) * Math.PI * 2 - Math.PI/2;
    const x = 250 + bulbRadius * Math.cos(a);
    const y = 250 + bulbRadius * Math.sin(a);
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', x.toFixed(1));
    circle.setAttribute('cy', y.toFixed(1));
    circle.setAttribute('r', 4.2);
    circle.setAttribute('fill', i % 2 === 0 ? '#7ff2ff' : '#e6b3ff');
    circle.classList.add('bulb');
    circle.style.animationDelay = (i * 0.09) + 's';
    bulbsOuter.appendChild(circle);
  }
})();
</script>

</body>
</html>
