<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diagnóstico de sonido - Ruleta</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:600px;margin:40px auto;padding:0 20px;background:#111;color:#eee;}
  button{font-size:18px;padding:14px 28px;cursor:pointer;border-radius:8px;border:none;background:#7b2fd6;color:#fff;margin:10px 0;}
  button:hover{background:#8b4fe0;}
  #log{background:#000;color:#0f0;font-family:monospace;font-size:13px;padding:14px;border-radius:8px;white-space:pre-wrap;min-height:200px;margin-top:20px;}
  .err{color:#f66;}
  .ok{color:#6f6;}
  .warn{color:#fd6;}
</style>
</head>
<body>
  <h2>Diagnóstico de sonido — Ruleta Galáctica</h2>
  <p>Pulsa el botón. Debería sonar UN tic seco inmediatamente. El registro de abajo te dirá exactamente qué está pasando en cada paso, sin necesidad de abrir la consola del navegador.</p>
  <button id="btnTest">▶ Probar tic de ruleta</button>
  <button id="btnInfo">ℹ Info del navegador</button>
  <div id="log">Esperando...</div>

<script>
const logEl = document.getElementById('log');
function log(msg, cls){
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function clearLog(){ logEl.innerHTML = ''; }

// ---- copia exacta del mecanismo de audio de ruleta.html ----
let _audioCtx = null;
function getAudioCtx(){
  if (_audioCtx) return _audioCtx;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx){
    log('AudioContext NO existe en este navegador (window.AudioContext y window.webkitAudioContext son undefined).', 'err');
    return null;
  }
  _audioCtx = new Ctx();
  log('AudioContext creado. Estado inicial: ' + _audioCtx.state, _audioCtx.state === 'running' ? 'ok' : 'warn');
  log('sampleRate: ' + _audioCtx.sampleRate + ' Hz');
  return _audioCtx;
}

function playTick(strength){
  const ctx = getAudioCtx();
  if (!ctx){ log('playTick abortado: no hay AudioContext.', 'err'); return; }

  if (ctx.state === 'suspended'){
    log('Contexto estaba "suspended", llamando a resume()...', 'warn');
    ctx.resume().then(() => {
      log('resume() resuelto. Nuevo estado: ' + ctx.state, ctx.state === 'running' ? 'ok' : 'err');
    }).catch(e => log('resume() lanzó error: ' + e.message, 'err'));
  }

  try{
    const dur = 0.018;
    const bufferSize = Math.ceil(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1800 + strength * 900;
    filter.Q.value = 1.1;

    const gainNode = ctx.createGain();
    const peak = 0.22 + strength * 0.28;
    const now = ctx.currentTime;
    gainNode.gain.setValueAtTime(peak, now);
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + dur);

    noise.connect(filter);
    filter.connect(gainNode);
    gainNode.connect(ctx.destination);

    noise.start(now);
    noise.stop(now + dur);

    log('Nodo de audio creado y arrancado (ctx.currentTime=' + now.toFixed(3) + ', peak=' + peak.toFixed(2) + '). Si no sonó, el problema es de salida de audio del sistema/navegador, no del código.', 'ok');
  }catch(e){
    log('EXCEPCIÓN al construir/arrancar el nodo: ' + e.name + ': ' + e.message, 'err');
  }
}

document.getElementById('btnTest').addEventListener('click', () => {
  clearLog();
  log('Click recibido. Ejecutando playTick(0.7)...');
  playTick(0.7);
});

document.getElementById('btnInfo').addEventListener('click', () => {
  clearLog();
  log('User-Agent: ' + navigator.userAgent);
  log('window.AudioContext: ' + (typeof window.AudioContext));
  log('window.webkitAudioContext: ' + (typeof window.webkitAudioContext));
  if (_audioCtx){
    log('Contexto ya creado. Estado actual: ' + _audioCtx.state);
    log('baseLatency: ' + (_audioCtx.baseLatency !== undefined ? _audioCtx.baseLatency : 'no disponible'));
  } else {
    log('Aún no se ha creado ningún AudioContext (pulsa "Probar tic" primero).');
  }
  log('¿Documento tiene foco?: ' + document.hasFocus());
});
</script>
</body>
</html>
