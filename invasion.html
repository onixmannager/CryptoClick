<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a14;--card:#16142a;--card2:#1e1c34;--card3:#252342;
  --yellow:#FFD700;--orange:#FF6B35;--pink:#FF3CAC;--purple:#8B5CF6;
  --blue:#3B82F6;--cyan:#06B6D4;--green:#10B981;--red:#EF4444;
  --text:#fff;--muted:#6B68A0;--border:rgba(255,255,255,0.07);
  --fh:'Fredoka One',cursive;--fb:'Nunito',sans-serif;
  /* Glass panel tokens: mismo lenguaje visual "cockpit HUD" que index.html,
     para que cuando esta sección tenga contenido las tarjetas encajen. */
  --glass:rgba(10,12,22,.42);--glass2:rgba(12,14,26,.5);
  --glass-border:rgba(255,255,255,.14);--glass-blur:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ═══════════ FONDO base: color sólido detrás de todo ═══════════ */
html{
  width:100%;min-height:100vh;background-color:#0b0a14;
}
/* body: fondo oscuro real de la app (--bg / #0b0a14), visible a los
   lados de la consola en pantallas anchas; #app se centra pero SIN
   limitar su alto — ocupa toda la pantalla igual que en móvil. */
body{width:100%;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;scrollbar-width:none;-ms-overflow-style:none;display:flex;justify-content:center}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}

/* LOADING — idéntico al de index.html: barra de progreso + tips rotativos */
#loading{position:fixed;inset:0;background:#0b0a14;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
.ll{font-family:var(--fh);font-size:28px;background:linear-gradient(135deg,#FFD700,#FF6B35,#FF3CAC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.lbw{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}
.lb{height:100%;width:0%;background:linear-gradient(90deg,#FFD700,#FF3CAC);border-radius:6px;transition:width .1s linear}
.lt{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px}

/* BG BLOBS — mismo fondo animado decorativo que index.html */
#blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.1;animation:blobF 10s ease-in-out infinite alternate}
.b1{width:500px;height:500px;background:#8B5CF6;top:-150px;left:-150px}
.b2{width:400px;height:400px;background:#FF3CAC;bottom:-100px;right:-100px;animation-delay:-4s}
.b3{width:300px;height:300px;background:#06B6D4;top:40%;left:60%;animation-delay:-7s}
@keyframes blobF{from{transform:translate(0,0) scale(1)}to{transform:translate(30px,30px) scale(1.1)}}

/* APP — misma "consola" de 430px que en móvil, SIEMPRE a pantalla
   completa (100vh). El body la centra con flex; nunca se encajona
   ni se le añade tarjeta/borde extra en escritorio. La imagen del
   mapa vive AQUÍ (no en html/body) para no estirarse a todo el
   ancho de pantalla en escritorio — background-size:cover llena
   los 430px de alto sin franjas y sin ningún filtro/overlay. */
#app{
  position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;
  display:flex;flex-direction:column;padding-bottom:82px;
  background-image:url('images/fondoinvasion.jpg');
  background-position:center top;background-size:cover;background-repeat:no-repeat;background-attachment:scroll;
}

/* TOPBAR — igual que index.html, con logo de vuelta al juego principal */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:10px}
#logo{font-family:var(--fh);font-size:15px;color:var(--yellow);text-decoration:none;letter-spacing:.3px;flex-shrink:0}
#usermini{display:flex;align-items:center;gap:8px}
#muteBtn{background:var(--card2);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;color:var(--text)}
#muteBtn.off{opacity:.5}

/* BALANCE CLK — mismo lenguaje visual "glass panel" que el resto del sitio.
   Vive en el topbar, así que se ve igual en móvil y en escritorio (el topbar
   es parte de #app, que siempre está centrado y a tamaño fijo de 430px).
   Lee el mismo documento saves/{uid} que usa index.html para el saldo. */
#balMini{display:flex;align-items:center;gap:7px;background:var(--glass);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:12px;padding:6px 12px;min-width:0}
#balMiniIcon{font-size:15px;flex-shrink:0}
#balMiniNum{font-family:var(--fh);font-size:20px;color:var(--yellow);line-height:1;letter-spacing:.3px;transition:transform .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#balMiniNum.bump{transform:scale(1.08)}
#balMiniLabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.5px;margin-top:1px;white-space:nowrap}

/* grupo izquierdo: logo + balance en columna */
.left-group{display:flex;flex-direction:column;align-items:flex-start;gap:2px}

</style>
</head>
<body>

<div id="loading">
  <div class="ll">👾 INVASIÓN</div>
  <img src="https://raw.githubusercontent.com/onixmannager/CryptoClick-images/refs/heads/main/BackgroundEraser_20260330_044416658.png"
       alt="alien"
       style="width:170px;height:170px;animation:pulse 1s infinite;object-fit:contain;">
  <div class="lbw"><div class="lb" id="lbar"></div></div>
  <div class="lt" id="ltip">INICIANDO INVASIÓN...</div>
</div>

<div id="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="app">

  <div id="topbar">
    <div class="left-group">
      <a href="index.html" id="logo">👾 INVASIÓN</a>
      <div id="balMini">
        <span id="balMiniIcon">🪙</span>
        <div>
          <div id="balMiniNum">–</div>
          <div id="balMiniLabel">$CLK</div>
        </div>
      </div>
    </div>
    <div id="usermini">
      <button id="muteBtn" onclick="toggleMute()" aria-label="Silenciar sonido">🔊</button>
    </div>
  </div>

  <!-- Música propia de esta sección, en loop, preload="auto" igual que bgMusic
       en index.html. El archivo de audio se sube aparte al repo. -->
  <audio id="bgMusic" src="sounds/audioinvasion.mp3" loop preload="auto"></audio>

</div>

<!-- ============ FIREBASE (mismo proyecto que index.html) ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEVcDHhKSyPd4n_U-DXzJI7lskY7BTiyI",
  authDomain: "crypto-alien.firebaseapp.com",
  projectId: "crypto-alien",
  storageBucket: "crypto-alien.firebasestorage.app",
  messagingSenderId: "61542154571",
  appId: "1:61542154571:web:bddd5100632abc9f09a8ce"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);
window.__fb = { auth, db, doc, getDoc };

// Si no hay sesión iniciada, de momento no redirigimos: esta pantalla
// aún no tiene lógica propia de juego/guardado, solo boot + fondo + música.
onAuthStateChanged(auth, (user) => {
  window.__fbUser = user || null;
  loadClkBalance(user || null);
});

// ============ SALDO $CLK (solo lectura) ============
// Lee el mismo documento saves/{uid} que index.html usa para todo el
// progreso del juego. El campo "clk" ahí es el saldo GASTABLE actual
// (baja al comprar mejoras), igual que el balance mostrado en index.html.
// Esta pantalla NO escribe nada, solo refleja el saldo ya guardado.
function fmtClk(n){
  n=Math.floor(n);
  if(n>=1e12)return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return n+'';
}
async function loadClkBalance(user){
  const numEl=document.getElementById('balMiniNum');
  if(!numEl)return;
  if(!user){
    numEl.textContent='–';
    return;
  }
  try{
    const snap=await getDoc(doc(db,'saves',user.uid));
    if(snap.exists()){
      const raw=snap.data().data;
      const parsed=JSON.parse(raw);
      const clk=typeof parsed.clk==='number'?parsed.clk:0;
      numEl.textContent=fmtClk(clk);
      numEl.classList.remove('bump');void numEl.offsetWidth;numEl.classList.add('bump');
    }else{
      numEl.textContent='0';
    }
  }catch(err){
    console.warn('No se pudo cargar el saldo $CLK:', err);
    numEl.textContent='–';
  }
}
</script>

<!-- ============ PRELOAD + MÚSICA ============ -->
<script>
const TIPS=['CARGANDO SECTOR...','ESCANEANDO NAVES...','SINCRONIZANDO RADAR...','PREPARANDO DEFENSAS...','CONECTANDO A RED CLK...'];

function runLoader(onDone){
  const bar=document.getElementById('lbar'),tip=document.getElementById('ltip');
  let p=0,ti=0;
  const iv=setInterval(()=>{
    p+=Math.random()*18+4;if(p>100)p=100;
    bar.style.width=p+'%';
    tip.textContent=TIPS[ti%TIPS.length];ti++;
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>{
        document.getElementById('loading').classList.add('hide');
        if(onDone)onDone();
        setTimeout(()=>{const l=document.getElementById('loading');if(l)l.remove()},700);
      },400);
    }
  },180);
}

// Música de fondo: mismo patrón que BGM en index.html — no puede sonar
// hasta el primer gesto del usuario (política de autoplay del navegador).
const BGM=(()=>{
  const VOL=0.15;
  let el=null,started=false,muted=false;
  function getEl(){ if(!el)el=document.getElementById('bgMusic'); return el; }
  function applyVolume(){ const a=getEl(); if(!a)return; a.volume=muted?0:VOL; }
  function start(){
    const a=getEl(); if(!a||started)return;
    started=true;applyVolume();
    a.play().catch(()=>{ started=false; });
  }
  return{
    init(){
      applyVolume();
      ['touchstart','mousedown','click','keydown'].forEach(ev=>document.addEventListener(ev,start,{once:true,passive:true}));
    },
    toggleMute(){
      muted=!muted;applyVolume();
      return muted;
    },
    isMuted(){ return muted; }
  };
})();
BGM.init();

function toggleMute(){
  const muted=BGM.toggleMute();
  const mb=document.getElementById('muteBtn');
  if(mb){mb.textContent=muted?'🔇':'🔊';mb.classList.toggle('off',muted);}
}

window.addEventListener('load',()=>{ runLoader(); });
</script>

<!-- PWA: registro del service worker (mismo que index.html) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
      .then((registration) => registration.update())
      .catch((err) => console.warn('SW registration failed:', err));
  });
}
</script>
